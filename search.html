ки несчастных расцепились и в оглушающем женском вопле парень полетел вниз. Женщина рванулась за ним, резким движением бедра сбросив малышку, вцепившуюся ей в ногу. Малышка покатилась к трещине и сорвалась в неё. Женщина даже не успела сообразить, что случилось. Крик девочки перекрыл все другие крики и женщина оцепенела, его услышав. До конца, до удара.  Саша схватил ее сзади и удерживал изо всех сил пока не подоспели спасатели. Его довезли до третьего кольца. Шереметьевская полностью провалилась, трещина шла прямо через КВН по стене Райкинского центра. Спасатели перекинули его на тросе на другую сторону улицы, прямо к началу Третьей Марьиной, в конце которой виднелся его дом. Вроде, целый. Бежать он уже не мог. Пополз на четвереньках. Входная дверь висела на одной петле. Через холл извивался узкий чёрный пролом, который на глазах крошился и обваливался. Никто не отзывался. Он взбежал на второй этаж. Дом был пустой. И пустой была капсула. К вечеру трещины поползли из столицы в сторону Петербурга. Говорили, что сильно пострадал Клин. Ему сообщили, что голландские гости погибли во время посадки самолета и что все действия по контракту остановлены. Пока не наступил комендантский час он бродил по всему району в поисках своих. Или их следов"}, {"title": "ТЕЛЕОПЕРАТОР КАК СУБЪЕКТ ТВОРЧЕСТВА ", "date": "25 декабря 2021", "categories": "Телевидение", "file": "post/052.html", "text": "Телеоператор середины прошлого века был вынужден все время доказывать себе и другим, что он «оператор». Возможностей создавать «картинку» у него в те времена было много меньше, чем у киношников. Те творили с помощью хорошо отлаженной технологической и технической схемы. Телеоператор полагался только на себя. Скажем, так называемый «внутрикадровый монтаж», то есть съёмка сцены в движении. У советских телевизионщиков эта задача решалась исключительно усилиями самого оператора - он сам двигал тяжеленный трехколёсный гидравлический или газовый штатив, управляя его движением, подъемом или опусканием камерной площадки, наклоном, поворотом или вращением почти стокилограммовой, камерной «головки»... И при этом надо было ещё следить за композицией ключевых кадров, управлять трансфокатором, видеть «краем глаза» и слышать одним ухом происходящее на площадке,  команды орущего режиссера, движение актеров и коллег, сценарный план и многое многое другое. У киношного коллеги столько было помощников – и фокус переводить, и долю по рельсам двигать и камеру поднимать да наклонять. У телеоператора никого. Всё сам. Его левая рука была занята ручкой управляющей гидроподъемником штатива. Правая - рулевым рычагом, отвечавшим за поворот колёс. Ею же приходилось толкать или тянуть штатив в нужную сторону. Ею же крутить ручку фокуса и перекидывать турель оптики или нажимать кнопки трансфокатора... Кошмар! И это, напоминаю, частенько в прямом эфире! Наехал на собственную ногу – тихо! Не кричи! Можно было, конечно, закрепить камеру на одном объекте, на дикторе, скажем, или на арфе и сидеть «поплевывая» в сторонке, в тени и прохладе. Но какой это «оператор» – так, механик при камере, в лучшем случае. А амбиции! А Творчество! А здоровая профессиональная конкуренция! Можно было наловчиться выполнять сложные, почти виртуозные, движения, изменяя ось оптики сразу по трём координатам. В этом зигзагообразном или линейном движении, естественно, участвовал весь операторский организм – крепкие ноги, «вытанцовывавшие кадр», плечи, поддерживающие камеру, все обе-две операторские руки. Иногда при наездах помогал крепкий лоб, упирающийся в рамку видоискателя. Давишь лбом, обеспечивая «наезд», и крутишь себе все ручки. Конечно, одновременно двигаться в трёх координатах и следить ещё и за фокусом было не просто, требовался и опыт и нахальство. И какая-никакая физическая сила. Получалось не всегда и не у всех. У киношных операторов, как правило, не получалось. Даже у Рерберга. Особенно трудно было лавировать почти двухсоткилограммовым комплексом после плотного обеда или кружки пива. И потому принцип Геллермана - «Телеоператор должен быть худым и голодным» - имел право быть верным. Для советских ветеранов «малого экрана» это был почти основополагающий принцип. Тем более, при ассистентской зарплате в 80 рублей минус налог и всяческие обязательные взносы. Впрочем, и операторы при категориях не намного больше получали. Ну, 120 или 160, максимум. А ассистенты тогда составляли основу операторской группы. На 80 рублей особо толстым не станешь, особенно семейным. В общем, телеоператор спускал за съемку больше килограммов своей плоти, чем киношник, это однозначно. Кинооператоры к этому были не приспособлены, хоть и всегда смотрели на телеколлег сверху вниз. Всех операторских задач здесь перечислять не берусь. Были, естественно, и другие съемочные функции. Например, надо было уметь крутить турель с объективами. В основном это требовалось на выездных съемках. На футболе, скажем. На советских камерах объективов, как правило, было четыре. Три стандартные - 35, 85, 130 мм. Четвёртый, большой, длиннофокусный - 200 или 300 мм. Это была тяжелая махина. Махануть турелью с такой «дурой» было дано не каждому. И не каждый, сидевший на свою беду в этот момент под камерой, выживал. Ещё бо`льшие объективы - 500, 750 или 1000 мм, был и такой, уже крепились к камере ещё и специальными растяжками. Крутануть турель с такими навесами было смерти подобно. Но случалось. Однажды оператор Степанов в пылу творчества в Большом Зале филармонии провернул 750 миллиметровую оптику мне на голову. Возможно и потому в моей жизни так многое не удалось. Кадр, снимаемый 1000-миллиметровым монстром, был, конечно, божественным. С Дворцовой набережной можно было рассмотреть мимику актера на бастионе Петропавловки. Или с набережной канала Грибоедова заглянуть в окно девушки на Сенной. Молодые режиссеры ЛенТВ очень любили переукрупненную жизнь. В телевизионном мире тоже ведь пахло Оттепелью. И все искали новое, неизведанное. Режиссеры либералы - Кухаренко, скажем, или Латышев, очень любили длинную оптику. «Подглядывать за жизнью» было прогрессивно. А Кухаренко вообще реальную картинку не уважал. Ему б всё через отражения, пятна, дымы. Из-за одной его работы меня аж как-то оштрафовали. Полчаса эфира в расфокусе. Интересно, хоть один зритель до конца его экспериментов досиживал ли? Но нам самим было очень интересно! Потом появился трансфокатор. Французский. Единственный на всем пространстве Союза. Это случилось где-нибудь в 62-63-м. Тут уж обзавидывались киношники. Такой красивой оптики у них и близко не было. Не знаю уж почему, но этот инженерный шедевр тщательно прятался от иностранных гостей и никогда не выдавался группе, работу которой могли бы увидеть иностранцы. Так было с моей работой на Японию. Мне было строжайше приказано молчать о существовании в Питере необходимой японцам оптики. В результате они вынуждены были везти через всю Сибирь свои объективы, которые к нашим камерам так и не подошли. Тогда же появился первый мобильный комплекс. На сверхроскошной машине - автобусе «Юность» можно было снимать с движения. Но только на расстоянии размотанного кабеля. Небольшие радиолинии ещё не «изобрели». Где-то 300 метров от стоящей ПТС, не более. И, естественно, во время съёмки за или параллельно «Юности» должен был бежать кабельмейстер с кабелем в руках. Очень похоже на современные трансляции бегущих охранников при лимузине северокорейского вождя. У замечательной «Юности» было две камеры. Одна смотрела назад через распахнутый задний проем, вторая помещалась на крыше во вращающейся капсуле. Удержать ее во время движения было почти невозможно - никакой стабилизации не было. Так что особых шедевров эта очень красивая машина ЛенТВ тогда не подарила. Но мы ее любили. «Юность» была оборудована всеми признаками серьезной правительственной машины - проблесками, сиреной, красотой. Наикрутейшим развлечением продвинутой операторской молодежи был подъезд сверкающего телевизионного лимузина с суровым оператором в люке к какой-нибудь пивной забегаловке. Милицейские «маячки» на крыше сверкали, сирена надрывалась ... Заведение мигом пустело и путь к пивному прилавку становился свободным."}, {"title": "ЕЛКА ИЛЬИЧА (ЛенТв, середина 60-х) ", "date": "27 декабря 2021", "categories": "Телевидение", "file": "post/053.html", "text": "...Постановщики были перегружены предновогодними заказами и елку для праздничного «Солнцеворота» искать отказались. Елка нужна была особая - плоская и, как бы это сказать, «круто треугольная». Я придумал снимать сцену птичьего застолья сверху, с  «небес»,  и для этого елку надо было закрепить  горизонтально. Телевизионная же  камера, не киношная - тяжеленная, над деревом не подвесишь, не те ещё времена.  Вот и решил я зрителя обмануть, елку положить  верхушкой в объектив,  сугробы с забором и собачьей будкой поставить сзади на бок и зрителя  пустить, как бы, в полёт над  заснеженной землей. Потому и елка нужна была «удобная», чтоб в ней спрятать актеров и куклы, но не ущербная. Заказать художникам не успевали, решили найти сами.  Созвонились с Рощинским  питомником- приезжайте, выбирайте любую.  За два дня до эфира, на студийном грузовом автобусе  мы с оператором Димой Удюрминским поехали «на порубки». До Комарово дорога была расчищена. Дальше, похоже, уже давно никто не ездил.   Указатель «Рощино» ещё торчал над сугробом, но границы шоссе уже было не угадать. Мы и пытаться не стали, вытащили из салона двуручную пилу и проваливаясь по грудь стали пробиваться к ближайшим елкам. Вполне подходящая была прямо перед глазами метрах в пятидесяти, сбоку от огромного сугроба, погребшего, как мы предположили, знаменитую скульптурную группу «Ленин с пионерами». Лысина Ильича угадывалась, но дети в снегу утонули безнадежно. Ещё на полпути стало понятно, что  до ёлок   нам не добраться. Снежный покров становился все глубже, грозясь там нас и похоронить. Пила провалилась в снег, быстро заледенела и застряла там напрочь, не подаваясь ни на какие усилия ее вытащить. Развернуться для отступления тоже оказалось невозможным. Снег был плотным настолько, что с трудом вытащив руку,  обратно я ее засунуть уже  не смог. Так и застрял с вытянутой перед собой варежкой, конкурируя с вождем. Решили пробиваться к  нему. Другого пути не было. Полчаса, наверное, пробивались. Наконец я ногой упёрся во что-то твёрдое, подтянул и Диму.  Ленин от наших дёрганий чуть от снега отряхнулся и даже одним глазом из сугроба выглянул. Мы потоптались, думаю, по пионерским головам, и более-менее устойчиво пристроились рядом с ленинским глазом. Перевели дух. Надо было понять, как и куда дальше? Освобождённой рукой я стал нашему водиле сигналы подавать. Спасай, мол. Тот в тепле сидит, кайфует. Наконец увидел, вылез, понял ситуацию и лезть к нам наотрез отказался. Залез обратно в  автобус и  укатил. - За помощью – прохрипел  Дима. Вижу, он уже синий и испуганный. Дело плохо. - Давай, хрипит, -  нору выроем. Под снегом теплее будет. - Давай, соглашаюсь я, - только мне одной рукой никак, рой ты. - А я не могу, мне руки не вытащить, говорит Дима и почему-то жутко матерится, чего я за ним совсем не знал. Да, совсем плохо, понимаю я. Стал одной рукой сверху снег разгребать. Докопался до Ленинского плеча. Там и панамка пионера показалась. Но теплее не становилось. И  тут застучал недалеко топор дровосека. Мы встрепенулись, головами завертели, пытаемся помощь рассмотреть. Никого не видим, правда обзора в 360 градусов не получается, не повернуться нам в нашей ловушке. Стали орать - Эй, эй!!!  Стук продолжается, а ответа нет. Минут пятнадцать прошло. Околели мы окончательно, охрипли. Не скажу, что с жизнью попрощались - молодые все ж, активные, да и вождь рядом страдает, но мам вспомнили неоднократно - и наших и его и вообще. Тут кто-то как заорёт - сторонись! Зашуршало сильно и прямо на нас -  на меня с Димой, на Ленина с пионерами, на  нашу снежную западню, рухнул  елочный ствол с пушистыми ветвями, шишками, колючими иголками и снежной взвесью. Диму даже по голове садануло, еле увернулся. - Ползите сюда - кричат нам с дороги. Хватаясь за ветви, подтягиваясь, упираясь локтями вытащили мы наши заиндевелые тела на поверхность и как могли быстро поползли, поползли… Водила с топором в руке помог нам подняться и в тёплый салон засунул. Водки налил, всякого сухого тряпья на нас накинул. Потом ушёл и притащил срубленную ель. Оказалась именно той, которая нам приглянулась и из-за которой мы Ленина потоптали. Водила  с другой стороны к дереву подъехал, с твёрдой. Выжили мы и новогоднюю передачу в эфир выдали. Только эффект полёта не получился. Как елку не подвешивай, обмануть зрителя не удаётся.  Для него на телеэкране низ всегда внизу, а верх сверху, как декорацию не крути."}, {"title": "Ответ на претензии по поводу моих историй", "date": "27 декабря 2021", "categories": "Царапины на памяти", "file": "post/054.html", "text": "Главное правило путешествующего в прошлое, подобного мне, - не всматривайся в прошлое и не вслушивайся! Прошлое существует, по крайней мере во мне, лишь отражением  в сияющей луже, возникшей в памяти и постепенно заполнившей все ее закоулки и пустоты. Отражением временами ярким  и четким, но таким тонким, постоянно  дрожащим, готовым исчезнуть от любого прикосновения, дуновения, шага, колеса...  «Не входи в воду» - главное теперь мое правило памяти.  Не тревожь отражение,  не разбивай зеркало. Собрать осколки почти наверняка не получится. И не получалось у меня почти никогда. Столько от этого навсегда утеряно - разговоры, черты лиц, свет и звук прожитого. Ещё помнится, что-то  было ж, было. Но это уже лишь закорючки в старой записной книжке, которые и расшифровать почти невозможно. Ну читал я как-то свои полудетские стихи Бродскому и что-то он резкое мне про них говорил. Такое  резкое, что навсегда отбил у меня всякие поползновения на эту деятельность. Но однажды, через десятилетия, попытался я эти разговоры  «реставрировать» и записать на бумаге. Напрягался, выуживая в памяти детали, всматривался... И всё, полное фиаско в результате. Ни помню теперь ни звука из долгого, умного и исповедального с его стороны разговора. И лица не помню, и сопутствующего... И разговоры с Николаем Акимовым совершенно потеряны. А ведь несколько дней с ним провёл в подготовке его самого последнего и трагичного юбилея. Очень интересных разговоров. Все обещал себе их зафиксировать. Однажды попробовал и потерял окончательно. А уж  истории родных. Теперь знаю - напрягать память нельзя.  Бесполезно. вредно, безнадежно. Записывайте сразу. Или сразу или никогда. Все поздние операции с памятью - реконструкция, сочинительство, фантазии. «Вспоминая», мы просто  разрываем на осколки и блики  нежнейшую пленку прошлого, а «успокаиваясь» она уже в исходное состояние не вернётся, не сможет. Все дробится, перемешивается, тонет, теряется ...неизбежно. Впрочем,  это не аксиома. Возможно, у других по другому. Но у меня так,  и обвинять меня в «писательских» искажениях рассказываемых мною историй не следует. Как и требовать конкретных слов, поступков, фактов. Не помню конкретностей и деталей. Помню ощущения и общую картину. Как могу."}, {"title": "Леонид Якобсон (набросок)", "date": "26 декабря 2021", "categories": "Царапины на памяти", "file": "post/055.html", "text": "Знакомая консерваторская девушка задолго до интернетовской эпохи долго, годы, не могла мне простить не совсем точного объяснения появления коровьего молока в ее утренней бутылке.  Я ее невинно спросил - как она может это пить? И на ее заинтересованное - а что?, объяснил, - ведь, чтоб молоко из коровы добыть милое животное разрезают с правого боку и отжимают напиток «по-живому» специальным коловоротом.  Раньше ей никто не объяснял такие интимные подробности  и новое знание совершенно ее сразило. Она уронила бутылку, расплескав жидкость, потом долго плакала, отказавшись на молоко даже смотреть, не то чтоб лужу подтирать, и, что ещё хуже,  понесла ее нелегкая поделиться  страшным открытием  с подружками фортепьянного факультета.  А пианистки - невинны до одури, и  болтливы, что для реноме  моей знакомой дорого потом обошлось. Вроде, вокалистки ещё круче, но я этого утверждать не могу. Я  совсем не об этом. Я о балете. Совершенное дежавю пришлось испытать мне, когда, открыв рот от изумления и восхищения, просиживал штаны в репетиционных Ленинградского  «Ансамбля хореографических миниатюр», где гениальный Якобсон объяснял своим юным артистам, что такое любовь. И не просто «Любовь», а любовь Адольфа Гитлера к Еве Браун. Это им предстояло танцевать в балете по «Девятой симфонии Шостаковича» и вызывало оторопь - как это?!! Я  снимал на рубеже семидесятых репетиции Якобсона на «Конвас», специально купленный и отремонтированный, снимал полуподпольно. Немного об этом уже писал. А много и не мог. Память мало чего сохранила, а весь киношный материал, нескольких шестидесятиметровых кассет, был смыт на ЛенТв  по приказу партийного начальства.  Остались в памяти только  отдельные кадрики. Но такие блестящие, что не удержусь и попытаюсь их рассмотреть. Леонид Вениаминович был абсолютным и уникальным профессионалом. Он знал о человеческом теле всё. За что и как браться при поддержке, что б не сломать какую-нибудь кость и не порвать какую-либо мышцу.  На какие пальцы приземляться при прыжке с пируэтом. Как выбросить балерину в «полет», что б и подбросить повыше и не сломать ни себе руку, ни балерине ноги и жизнь.., знал и мог показать. Я, увы, олух и даже близко не могу объяснить и описать - чего такого знал Якобсон про наше с вами  устройство! Но он-то знал досконально! И только он.  Бывал я за кулисами и у Эйфмана и у Григоровича.  «Детский сад», извините. Никакого сравнения! И по постановке задач и по показу, про хореографию уж и не говорю. С тех ещё  пор не высоко ставлю я великих советских балетмейстеров. Помню, как Якобсон показывал партнеру Аллы Осипенко  уникальную поддержку народной артистки  двумя руками за одну голень для миниатюры «Минотавр», по моему.  Тот, многоопытный и сильный мулат и танцор, танцевавший с Аллой на всех знаменитейших сценах мира, категорически отказывался такую поддержку выполнять - утверждая, что она невыполнима и невозможна. И Осипенко почти что плакала - этого нельзя никак, сломает он мне позвоночник, Леонид Вениаминович!  «Когда знаешь, за что и как держать, никогда ничего не сломаешь, вот смотри» - и Якобсон скрутил пробегавшего мимо парня и на вытянутых руках поднял его за ногу над головой. А было ему тогда уже под семьдесят и парень был в килограммах! Потом сколько раз Осипенко взлетала в этом па под всеобщий восторг и овации. Впрочем, инспекторы профсоюзов по травмам в театре никогда не переводились. Все время там что - нибудь да случалось. Техническая сложность хореографии Якобсона была запредельной. Чуть расслабишься и ищи себе новую ногу или новое место работы. Со скандалом, естественно! А не расслабляйся! Нот Леонид Вениаминович не знал совсем,  записывал  придуманную хореографию пиктограммами. В отличие от прочих великих он  не  «ставил»  «общее впечатление» от музыки.  Вся его партитура движений рассчитывалась и расписывалась на каждый такт, каждый инструмент, каждый аккорд, каждый «вздох» музыки...  Кстати, и поэтому он предпочитал использовать в своём творчестве фонограммы, ибо при «живом» оркестровом или концертмейстерском исполнении был велик риск расхождения музыки и танца, что его хореография не допускала. С другой стороны, вспоминаю, как на одном из спектаклей порвалась пленка магнитофона на, уже не помню, кажется, на «Еврейской свадьбе».  Какое-то время номер продолжался в  удручающей и скрипящей тишине, пока звукорежиссёр пальцем подгонял бабину под движения танцоров и «врубил» звук так точно и к месту, что вызвал всеобщий упоительный восторг. Так в хореографии все было выверенно, обязательно и логично! Меня особо восхищали «задачи», которые Якобсон ставил перед собой и исполнителями. Они всегда были «техническими», т.е. максимально конкретными. А что будет, если квартет солисток, в его коллективе не было кордебалета, станцует  номер не размыкая рук?! И появлялся сложнейший па-де-катр, изумительный по позам и движениям, невероятно красивый и остроумный, жемчужина всей его коллекции. А если весь номер строить на поддержках, не опуская солистку двумя ногами на пол вообще?! Фантастический «Полёт Тальоне» изумлял всех! А как он работал со светом! С костюмами, с гримом! Снимать миниатюры Якобсона было огромным наслаждением... Так, а что там с Гитлером? Прежде чем приступить к репетициям балета на музыку Шостаковича, Якобсон собрал в зале весь свой коллектив. Советская балетная юность никак не могла взять в толк, как-это танцевать Адольфа нежно, искренне, возвышенно? По задумке хореографа на сцене присутствовали одновременно, или сменяли друг друга, несколько диктаторов в разных трико и гриме. И в кульминации они должны были нежно любить Еву, плакать и совершать утонченные пируэты, умирая. Я, конечно, не помню точных слов Якобсона, у которого с фашизмом были свои счёты, но он разговаривал с артистами почти два часа. Простой смысл его объяснений был таков - влюблённый Гитлер был единственным шансом человечества спастись. Но фашизм в наших душах сильнее."}, {"title": "Буробин", "date": "28 декабря 2021", "categories": "Телевидение", "file": "post/056.html", "text": "Пять уже лет назад за поминальным столом делился печальный люд историями о Серёже Буробине. И очень быстро все сильно развеселились. Водка, конечно, способствовала. Но  сам поминаемый был источником такой радости, теплоты, невероятного ума, везения, нелепостей, парадоксов, хохота и восторгов, что более шумных и веселых поминок я и не припомню. Во первых, он был изумительно нескладен - тощий, высокий, длиннорукий и лысоватый. Сократовский лоб был всегда в глубоких морщинах, потому что, гениальный мозг Серёжи никогда не простаивал в безделии. Задачи, требовавшие немедленного решения,  находили его всюду и всегда.   И он их, практически ВСЕГДА, решал ко всеобщему изумлению. Потерян в глубоких сугробах ключ от авто - через десяток минут из часовых батареек и ржавой проволки готов был миноискатель. Прочесал Серёжа весь двор, нашел и свои ключи и ещё дюжину чужих. Мы благополучно  тогда уехали, открыв рты и не успев протрезветь и замерзнуть. Где-то на съемках в горах Таджикистана он «из интересу» запустил гидроэлектростанцию, которую все местные большевики не могли починить с довоенных времён. Однажды ночью в Питере, когда нам срочно нужна была телефонная связь и не один телефон-автомат на Невском не работал, он присмотрелся к маленькой серой коробочке на стене Пассажа, поковырял в ней пальцем и нам ответили из коммутатора Смольного... Тридцать, почти, лет назад, когда мне приспичило снять ход луны над Казанским собором и никакой замедленной, убыстрённой или покадровый съемки для видеокамер ещё не существовало, он приделал к Бетакаму будильник с посекундным выключателем и впечатляющие съемки для Всенощной Рахманинова канал Культура транслировал каждую Пасху в течении лет десяти. Бесспорно, Сергей Буробин был гением. Вот ещё одна история, это подтверждающая и связанная с приложенным фото. Серж, пристыкованный к Саше Фуксу. Пожалуй, первый «частный» комплект ТЖК, с которым в середине восьмидесятых мы ездили на «халтуру» в Финляндию. Должны мы были снять для западного заказчика интервью с руководством компании «Sony», открывавшей под Хельсинки свой завод телеаппаратуры. Собралось в чистом поле с видом на завод все высокое финско-японское начальство и мы со своим новеньким BZN - ом,  что уже вызывало ухмылки у собравшихся, поскольку для них Bosch был уже прошлым веком.  Выгружая аппаратуру из авто, Серёжа уронил магнитофон примерно с двухметровой высоты на бетон, отчего внешний вид аппарата сильно испортился. Расхохотавшаяся техническая элита собралась расходиться и с огромным трудом и унижением я ее удержал. Ну, пять - десять минут, господа! На что пузатый капиталист, директор фирмы, изрёк - аппаратуру видеозаписи отремонтировать «в чистом поле» невозможно. Тем более вам. Началось быстрое «лечение» по-русски. Серёжа подвязал искореженный корпус несчастного веревочкой. Замкнул какой-то процессор рублевой монеткой, слюнями создал нужную концентрацию смазки, чего-то «на глазок» подкрутил, подогнул, лишнее выкинул на фиг, руками записывающую головку протер... Толпа вокруг изумленно смыкалась, я таких вылезающих из орбит глаз никогда и не видел. Через семь минут мы снимали. Потом вся толпа внимательно смотрела на мониторе результат. Расходились в полной тишине. Этого быть не может! - выдавил из себя главный капиталист. Продайте нам этого инженера. Не, сказал Серёжа, мне баню достраивать."}, {"title": "Инструкция по пользованию старым человеком", "date": "26 декабря 2021", "categories": "Царапины на памяти", "file": "post/057.html", "text": "Старость. Прежде всего - это такая сеть, которую годы набрасывают на организм, что б тот от смерти не убежал. На мышцы и суставы, на кожу, на картинку в глазах, на звуки в ушах, на мысли в голове. И чем старше старый человек, тем все глубже эта сеть в него вгрызается. Всё  съёживается и скручивается, разделяясь  на маленькие, не всегда четкие, но глубокие, ячейки  и из каждой приходится выпутываться отдельно, все силы  и время на это тратя. Т.е. на любое действие, на любую процедуру, даже на открытие рта или нажимание клавиш, времени требуется всё больше и больше. Старый человек - медленный человек, прежде всего.  Замечали? Он медленно встаёт, медленно жуёт, медленно смотрит.  Он не любит скачущую музыку, клиповый монтаж в кино, рэп в литературе и  неугомонную политологию в телевизоре. Не надо старого человека подталкивать и торопить. Когда надо, он и сам споткнётся. Второе. Старый человек, как правило, живет давно и многое видел. Его трудно удивить даже встроенным в унитаз вай-фаем. Не потому, что он на таком уже сидел. Просто,  дерьма он в своей жизни видел столько, что его усовершенствованиями  старый ум уже не тронуть. И если стульчак хотя бы с подогревом и в досягаемости, то любые  другие технические выверты и навороты старому человеку пофиг.  Не пытайтесь его удивлять прогрессом цивилизации. Зря время потратите и нервы. Его можно удивить только прибавкой пенсии. Затем. Старые люди, как и остальное человечество, делятся на умных и дураков. Дураков, естественно, больше. У старых людей определять коэффициент IQ  гораздо проще, чем у не старых. Чем больше старый человек отдыхает, ни во что не вмешиваясь, тем коэффициент интеллекта у него выше. Чем больше орет и возмущается, тем, соответственно, ниже. Контрольный вопрос, который поможет вам определить класс старого человека, такой - «Верите ли Вы, что американцы были на Луне?» Если верит, то его айкью вполне себе приличный,  если же ему похуй, то он без сомнения очень умён. Без вопросов. Ещё. Старый человек, даже дурак, совсем не такой уж и дурак, как того хотелось бы молодым. Он по любому умнее последующего поколения. Господь так жизнь устроил - опыт важнее знаний.  Мудрость острее ума. Осторожность  надёжнее энтузиазма.  Время - главный учитель.  Годы - настоящая библиотека.  Смерть - единственный экзаменатор. Поэтому, совет старого в принципе ценнее мнения молодого.  Не обязательно, но в принципе. Недаром в предыдущих  цивилизациях Советы Старейшин руководили государствами. Кажется. Не недооценивайте стариков, не будьте так самонадеянны, особенно при заполнении вакансий и построении конкурентного коллектива. И последнее. Старость - не радость. Это приговор, а преследование приговорённых дело постыдное и не благодарное. Сами такие."}, {"title": " ГВОЗДЬ ", "date": "11 марта 2022", "categories": "Рассказы", "file": "post/058.html", "text": "Сказка для пенсионеров (1790-й, снежный) В синий зимний вечер к служебному подъезду нового Юсупова дворца со стороны Фонтанки подкатили почтовые сани и сидящий на облучке весь, от бобровой шапки до валенок, белый пушистый ямщик мотнул головой выскочившим из дверей слугам на облепленный снегом большой высокий пенал в санях за собой. - Посылка, детям, от мамаши. Велели без отца не открывать. Слуги бережно пенал подняли и внесли в дворцовые сени, держа его на вытянутых руках и стараясь не споткнуться о высокий порог входного тамбура.  В тамбуре уже ждал дворник, который быстро и нежно стряхнул коротким березовым веником остатки снежной пыльцы, прилипшей к его бокам и крышке. Пенал заблестел полированными деревянными гранями. Слуги присели в поклоне, протягивая посылку спустившемуся к ним гвардейцу в высоком елизаветинском кивере. Тот посылку принял, еле при этом удержав ее в руках и чуть не выронив, осмотрел все её стороны - нет ли снега, грязи, лишнего, и, прижимая тяжеловатую ношу к металлической груди, понёс ее осторожно по ступенькам чугунной винтовой лестницы наверх к мерцающим там наверху свечам, вокруг которых подпрыгивали от нетерпения две пары  детских ног в смешных разноцветных чулках и кожаных пинетках. По анфиладе темных залов пенал повезли в детскую уже два гвардейца, уложив его на лафет потешной мортиры. Перед процессией слуга нес развесистый серебряный канделябр с пятью толстыми свечами и бесчисленные язычки пламени отражались в венецианских окнах, за которыми выпархивали из темноты, планировали и прилипали к выпуклым оконным стеклам необыкновенно крупные мохнатые снежинки. Далеко в небе на башне строящегося Адмиралтейства качались два огонька, словно бабочка махала крыльями. Мальчик и девочка в пышных ночных балахонах, ведомые двумя чрезвычайно дородными нянями, семенили, замыкая торжественное шествие, выкручивали няням руки, подпрыгивали и испуганно веселились, показывая пальцами на огромные извивающиеся тени, сопровождающие процессию. Два камердинера в глубоком поклоне распахнули перед мортирой высокие зеркальные двери и мортира, ввезенная в центр полутемной высоченной ротонды, остановилась. Пенал спустили на мраморный пол, гвардейцы развернулись на каблуках, щелкнули шпорами и пятясь удалились, утаскивая за собой игрушечную пушку. Высоченные двери, чуть поскрипывая, затворились. Мальчик и девочка вырвали наконец липкие ладошки из нянькиных ручишь и на цыпочках подкрались к пеналу. Тот неожиданно пошевелился, что вызвало визг малышей и оторопь женщин. Испуганный, чуть не уронивший светильник, слуга сделал инстинктивно пару шагов назад, отчего световой круг от канделябра дернулся и выпустил из своих границ пенал. И когда взрослые опомнились, то посылку на прежнем месте не увидели. Она обнаружилась в стороне у стены, крышка пенала была откинута, его содержимое явно его покинуло и где-то затаилось. Дети завизжали оглушающе, няни, путаясь в юбках, закрутились вокруг опустевшей посылки и беспрерывно крестились, прибежавшие на крик слуги бросились разжигать подсвечники, канделябры, люстры и многочисленные бра, висящие на малахитовых пилястрах. Ротонда и подводящая к ней анфилада комнат празднично засияли, засверкали бесчисленными зеркалами, хрустальными подвесками, маслом огромных, развешанных по стенам, картин, инкрустированным паркетом под ногами, фарфором и хрусталем в высоких шкафах, полированными поверхностями столов, стульев, французских комодов и голландских кабинетов… Дети такого фейерверка вспышек и бликов за свою недолгую дворцовую жизнь никогда и не видели и, забыв о причине общего гвалта и паники, застыли в середине этой мигающей разноцветной сказки, распахнув глаза и рты. Вокруг них, звеня шпорами и кольчугами, закружили гвардейцы, заглядывая во все углы, под мебель, шторы и даже за массивные рамы картин на стенах…  Никто не знал, кого именно искать, что выскочило из этой продолговатой посылки, как и чем это выскочившее опасно и что вообще происходит?! В дверях, наконец, появился сонный и недоумевающий папа, в ночной рубашке до пят и колпаке, съехавшем на брови, отчего папино лицо выглядело весьма потешным. Весь суетящийся взрослый народ, собравшийся в детской, низко склонился и попятился. Только слуга с канделябром так и застыл, сомкнув рот и зажмурившись, чтоб случайно не захохотать. Папа заглянул в пенал и обнаружил в его глубине обычный столярный гвоздь, только очень большой, и конверт с письмом от, видимо, отправителя. В конверт был вложен пожухший от старости листок со старославянской строчкой – «ꙁасоунь​ ​себѣ​ ​ѥтотъ​ ​гвоꙁдь​ ​въ​ ​ꙁадницоу»​. Папа недоуменно строчку прочел, хихикнул – «Дура», швырнул гвоздь на пол и велел всем умолкнуть и расходиться. А высоко-высоко над всей этой круговертью, за карнизом, опоясывающим громадный потолочный плафон кисти петербургского маньериста с порхающей среди пестрых цветочных гирлянд парочкой целующихся, он в синем и она в красном переплетающихся хитонах, притаился полуголый дрожащий карлик, весь покрывшийся «гусиной кожей» от свистящего по потолкам дворца ледяного сквозняка. Он почти околел, пока толпа внизу, подчиняясь папиному жесту, наконец-то умолкла и оглядываясь разошлась, погасив все свечи и захлопнув все двери. Карлик перевалился через карниз и перебирая руками сполз по витой соломоновой колонне вниз, в темноту и скрипящую тишину ротонды. Там поднял он с пола гвоздь, зачем-то его лизнул, засунул за пояс и ушел в темноту. Очень странные вещи стали происходить в северном флигеле. Открывались сами собой дверцы шкафов и захлопывались так, что посуда летела с полок, картины срывались со стен, побеги пальм выпрыгивали из горшков и переламывались. На полированных поверхностях клавиров появлялись неприличные слова, явно процарапанные чем-то острым, похоже, гвоздем. Гвозди, вообще, кто-то стал разбрасывать по дворцу и в саду и несколько слуг сильно поранились, на них напарываясь. Несколько раз девушки, прибиравшиеся в детской, видели на паркете мокрые следы маленьких босых ног, очень странных – пальцы на ногах призрака казались узкими и слишком длинными, как у обезьян. А несколько слуг уверяли, что видели на карнизе под потолком маленькую фигурку с лицом старика, которая грозила им пальцем и смеялась. Так Нечто поселилось в северном флигеле. Его пытались выследить и поймать ловушками, сетями, облавами. Пытались отравить ядовитыми фруктами и питьем. Пытались выманить музыкой и заклинаниями. Тщетно. Он был тут, это все знали твёрдо, но никто его никогда четко не видел. Только Папа иногда в подпитии приходил в ротонду и грозил кулаком целующейся паре на плафоне. Больше он никогда не женился. С тех пор крыло на набережной посещалось редко и боязливо. Детей переселили в спешно перестроенный южный флигель. Все коридоры второго этажа, параллельные набережной, закрыли на замки, уличный выход на набережную заколотили вообще, винтовую лестницу развинтили. Слуги ту часть здания посещали только по необходимости – вымыть весной окна, что-либо принести из забытого хозяевами, протопить дом, чтоб не промерз окончательно. При этом шли группой, по одному никогда, вооружившись топорами и палками. Когда семья выезжала в летнюю молдавскую резиденцию или к морю, слуги водили во двор дворца «экскурсии» горожан, показывали, естественно за плату, затемненные окна второго этажа и рассказывали такие страсти, что даже революционные матросы, грабя дворец почти столетие спустя, это крыло пощадили, побоявшись в него даже заглядывать. (1917-й год, ветряный) Мело сильно. Отряд матросов, отправившийся с крейсера на берег в поисках еды, перелез через ограду Юсупова сада, в глубине которого горело несколько окон Дворца и пахло свежей выпечкой. Матросы разделились – часть перебежками устремились к горящим окнам, держа винтовки наперевес. Трое направились в сторону странного звука, доносившегося от пруда.  Было уже темно. Протоптанная в снегу дорожка привела к мосту. В протоке под ним кто-то плескался. Трое переглянулись и стали осторожно спускаться к воде, приготовив револьверы.  В самой темноте под мостом угадывала"}, {"title": "  ИНСТИТУТ БОНЧ-БРУЕВИЧА", "date": "25 декабря 2021", "categories": "Телевидение", "file": "post/059.html", "text": "В самом начале шестидесятых бывал я на кафедре телевидения института Бонч-Бруевича на Невском. У профессора Шмакова. И в лаборатории при кафедре. Вот это был «Диснейленд»! Там изобретались, создавались и эксплуатировались совершенно фантастические приборы и системы. Вот была, к примеру, и я вокруг неё ходил, прозрачная сфера внутри которой проецировалось объемное телевизионное изображение. Полное, на 360 градусов. Шестьдесят лет назад! Уж не помню, что именно располагалось в центре примерно метровой в диаметре колбы, но это что-то можно было обходить, рассматривая детали. Какая-то местность или лежащая скульптура. В соседней комнате функционировала опытная студия цветного ультрафиолетового телевидения. В студии была темнота, артисты гримировались густым синие-зелёным гримом. Было страшновато. Но на экране монитора все выглядело ярко и вполне натурально цветно. Впрочем, на кафедре испытывали и советское подобие американской NTSC, картинка которой сильно уступала ультрафиолету. Система «Стерео-телевидение» тоже делало первые, смешные шаги.  Мой портрет стал объектом отдельной экспериментальной съёмки. Получился очень объёмным и устрашающим. Конечно, моя память не хранит всего, там виденного. Многое забылось. Запомнились лишь отдельные разрозненные детали этих визитов в альма-матер нашего телевидения. Но, возможно, и эти клочья кому-нибудь интересны, для чего-нибудь сгодятся."}, {"title": "СВЕТ ПРОШЛОГО ВЕКА ", "date": "25 декабря 2021", "categories": "Телевидение", "file": "post/060.html", "text": "Набор осветительных приборов тогда, кто помнит, был скуден. Да и много ли тому телевидению было надо! Самые большие и мощные ДИГи, использовавшиеся в войну как прожектора ПВО, требовались редко. В основном для киношников или для хоккея с мячом (канадский хоккей в телевизоре если и был, то не часто) Хоккейные игры шли в основном вечерами на Васильевском под открытым зимнем небом и осветить стадион хоть каким-нибудь иным светом было проблемно. Мороки с этими дуговыми прожекторами было много - поджечь, заставить ровно гореть, не прозевать конца графитового стержня. Частенько бывали случаи, когда ДИГ отказывал в самый неподходящий момент. А уж какими огромными и тяжелыми были эти «дуры» - привезти, расставить на штативы, поворачивать, если надо... Не любили мы их. Я лично помню лишь об одном случае использования ДИГов в своей практике. Уже писал об этом, но повторюсь. Середина шестидесятых. Снимали в квартире Пушкина на Мойке. Что-то мистическое по запискам Гоголя. Живой эфир, естественно. Кто режиссёр, не помню, но не сомневаюсь, что хороший. Я оператор. Расставил ДИГи во дворе, направив в окна квартиры. Для создания «трепещущей», призрачной, нереальной световой атмосферы в комнатах придумал поливать стёкла окон водой из брандспойтов и сквозь такие потоки светить. Пригнали две пожарные машины для этой миссии. Отрепетировали. Получался шедевр. Но музейное руководство испугалось в последний момент, а чего скажет Смольный про такое мокрое дело, и категорически запретило. Я рыдал, но ничего сделать не мог. Но и выйти в эфир было обязательно. В сухую! И вот, не вру, за пять минут до эфира грянула гроза. И по стёклам... Просто ливень нужной мощи и направленности. Пушкинская квартира засияла и выглядела фантастически. Через пять минут после эфира дождь закончился. До сих пор считаю ту пушкинскую историю своим лучшим взаимодействием с высшими силами и своей лучшей операторской работой. Тем более, отсутствие магнитофонных записей тех времён позволяют так считать запросто. Самыми крупными ламповыми студийными приборами были «десятки» и «пятерки». Десятками были оборудованы балконы в больших студиях, на полу встречались редко - громоздкая все ж штука. Традиционно пользовали их в качестве контрового света. На моей памяти только Боря Никаноров светил ими лица. Он, вообще, был любителем максимальной контрастности. И, должен отметить, преуспевал в этом. Его световое решение сцен напоминало часто графику «Окон Роста» - три-четыре пронзающие темный кадр луча. Инженеры нервничали. Им бы поровнее. Но с Борей не особенно и поспоришь.  Миша Филиппов не был профессиональным оператором, он пришёл в профессию, если не путаю, из архитектуры и поэтому очень выделялся «плоскостной» философией светоустановки. Не любил «пятен», в его кадрах главным было сочетание больших однородных поверхностей. И это впечатляло. Вспоминаю «Фиесту» Юрского.  ВГИКовская «тройка» ЛенТВ - Черняк, Ананьев, Соколов, принесла в нашу жизнь моду на киношный, в том числе «ювелирный» свет. Бэбики, клопики, револьверы..., из осветительских складов мы извлекли всю мелочь, которая там годами ржавела. Всякие тубусы, шторки, отражатели и затемнители... Государственные сеточки и пленочные фильтры скоро на Чапыгина иссякли, операторы и ответственные световики обзаводились своими причиндалами, особенно когда начался цветной свет. Высшим шиком стало использование люксметров и окуляров для выстраивания кадра. Когда я увидел у Черняка окуляр со сменяемой оптикой, по моему операторскому самолюбию был нанесён оглушительный удар, в результате которого я ушёл в режиссуру.  У творческой молодежи очень модным стало тогда создание фоновых теней и бликов. И что б шевелились. Тазики с водой, осколки зеркал, вентиляторы, веточки и тряпочки стали привычным делом в студиях. Большие световые задачи придумывались и решались, естественно, ведущими операторами и художниками-световиками для больших студийных постановок. Ну а операторская мелочь «набивала руки» съемками дикторов. И чего только не изобреталось. И не всегда успешно.  Дмитрий Удюрминский однажды выдал диктора в эфир, посадив его в зубоврачебное кресло, в соседней студии применявшееся в качестве декорации. Хотел повыше и пневматика кресла позволяла поднять его на нужную высоту. Включил все вмонтированное в кресло электричество и сопутствующие яркие и оригинальные приборы. Получилась замечательная картинка. Ну и в эфире, на тексте о чем-то возвышенном, внезапно заработал компрессор, включив обдув рта и что стало с губами несчастного, представляете. По-моему, Витя Андреев там восседал. Но не утверждаю, все ж почти полвека. Каждый оператор по-своему понимал тонкости портретного света. Каждый выпуск новостей отличался картинкой принципиально - то яркий солнечный день, то камерные сумерки, а то и, вообще, «званый ужин при свечах». Все главные операторы пытались с этим бороться. Издавались инструкции со световыми схемами на определенные лица и ситуации. Несколько раз свет намертво закреплялся и запрещалось его трогать. Виталий Ананьев особенно в этой стандартизации преуспел. Но увы, не приживалось. Все ж и каждая персона, и состояние здоровья снимаемого лица, одежда, прическа, настроение..., читаемый текст, в конце концов, требовали операторского вмешательства. И, увы, побеждало творчество. Жора Прусов, например, поступил рационально. Он недели две-три ходил за лучшим мастером света Ананьевым и зарисовывал все того световые партитуры. Получился целый каталог. Входит Жора в дикторскую, а там, скажем, диктор Мила Евдокимова, будущая его жена, восседает. Он тут же достаёт ананьевскую схему под такой фамилией и все с точностью до сантиметров повторяет. Но всего же не учтёшь. То луч нужен не рисующий, а скользящий, то блик поймать. И Мила Евдокимова в руках Жоры выходила ужасно. Тени под глазами, нос набекрень. Просто кошмар какой-то. Семейный конфликт. Пришлось и от этой технологии отказаться. В девятую студию повесили софиты с лампами дневного света. Свет резкий, бестеневой. А там не только учебные программы снимались. Бывало и художественное вещание. Мы поскандалили, побунтовали и смирились с неизбежным прогрессом. Приходило цветное телевидение, а там главным, первое время, было требование ровного освещения. А ещё «свет» был лучшим сервисом для «контрабанды». Чего только не перемещалось в осветительских чемоданах, чехлах да и в самих приборах. Многие студийные анекдоты вырастали из этих операций. Один из любимых - как с фабрики Крупской вывезли однажды в корпусах «пятёрок» и «десяток» фабричный подарок - множество шоколада и шоколадных конфет, в суете забыли об этом и включили приборы со всем шоколадным содержимым на какой-то очередной съемке. Очень смешная история. Про шоколадное наводнение."}, {"title": "Проспект Кирова", "date": "24 декабря 2021", "categories": "Царапины на памяти", "file": "post/061.html", "text": "Рекорд скорости по появлению на работе был у меня 30-минутный. Надо было сбежать с 4 этажа дома на Сенной, разглаживая заспанное лицо да застегивая на бегу штаны и куртку. Вскочить в «американку» - трамвай номер два, который довольно редко ходил. Свернуть  с площади на Садовую, пересечь Гороховую, Невский, выехать на Марсово, оставить справа Летний сад, поторчать в пробке  на  временном мостовом обходе, где транспорт еле-еле тащился по хлипкому деревянному настилу, за мостом перебежать трамвайные пути и втиснуться во всегда переполненный  троллейбус. Дальше несколько остановок прямо - Ленфильм, бывший лицей, площадь Толстого, потом огромный безостановочный отрезок до Павлова.  У Чапыгина почему-то остановки не было. Иногда удавалось соскочить прямо на ходу, рванув двери, но чаще приходилось бежать обратно метров двести.  В начале шестидесятых ещё пускали с Павлова через проходную боксов ПТС.  Во внутреннем дворе телецентра путь сильно сокращался и в студию можно было вбежать через грузовые ворота. Подскочить к камере как раз в момент оглушительного рева сверху -  где этот Либин!!! - Тут, тут, пописать выходил, зачем кричать. В среднем же, если не бегом, то весь путь занимал минут пятьдесят. В хорошую погоду пройтись по Кировскому было в удовольствие. С кем только я этот путь не делил. С мальчишкой Боярским, помню, шли  потрясённые  белой ночью. И он так растрогался, что взобрался посреди уже нового Кировского моста на балюстраду и поклялся, что будет великим  артистом. Я поверил. Черноземов меня однажды учил фехтовать, экзамен у Коха был на следующий день, у вечного огня на Марсовом. Набежала милиция, нас скрутила и увезла в каталажку. Попытался  я объяснить милицейскому начальству, тряся студийным удостоверением, что зря они Гамлета арестовали. Фамилия начальству показалась знакомой, как-раз фильм Козинцева с Черноземовым вышел, отпустили. Экзамен я, кажется,  завалил. И ещё фамилии, фамилии... одна круче другой. Самому кажется, что сочиняю. Но нет, действительно,  было ведь. Весь Кировский, включая Каменноостровский, можно было пересечь на транспорте минут за 15- 20.  Автобусные лекции Алексея Рессера, которые он начинал у малой Невки и по Кировскому довозил до дворца Кшесинской, длились 6-7 часов без перерыва и по десять с гаком, если с перерывом. Попасть к нему на «экскурсию» было почти невозможно. Записывались, кому повезло, за год-полтора.  Это было событие почище любого театрального.  Выходили из автобуса «экскурсанты» ошарашенными увиденным и услышанным . Как же жаль, что никому, и мне в первую очередь, не пришло в голову если не заснять те «представления», то застенографировать хотя бы.  Ничего подобного ни по материалу, ни по мастерству изложения я в своей жизни больше не встречал.  Пропало, похоже, навсегда. В счастливые  гагаринские времена вышли мы с Клейманом как-то, покачиваясь и под ручку, из чапыгинского подвала и пошли  к остановке на той стороне проспекта. А фиг, не перейдёшь! На перекрёстке пикет гаишников  не пускает. Что такое? Нас телевизионщиков! Да мы вам! Тут со стороны Невки от правительственной резиденции накатывает кавалькада чёрных машин, гаишники берут под козырёк и мы, пользуясь занятостью их рук, проскальзываем на нужную нам сторону буквально под носом величественных лимузинов. В метре от нас опускается толстенное  автомобильное стекло и что-то очень родное глядит на нас и машет ручкой.  Нам машет. Мы  единственные, похоже, ленинградцы  в окружающем пейзаже, махать больше просто некому.  Не милицейским же шеренгам.  Я и Клейман от неожиданности впадаем в «ступор» и  до боли знакомое лицо проплывает мимо нас с недоумением в глазах и непониманием отсутствия восторга.  Проехав вперед с десяток метров,  Леонид Ильич  обернулся, ожидая все ж от нас реакции. Ну хоть какой-нибудь. Напрасно. Стекло обиженно поднялось и машины рванули в сторону «Льва Толстого». «Что, суки, помахать не могли» - услышали мы  из окна догоняющей кавалькаду «волги». «Эх, не до вас сейчас, а то б...,!». “И что это было?” - проснулся  наконец Клейман. «Брежневу ты сука не помахал, беда теперь»,  объясняю я.  «Как Брежневу? Какому  Брежневу? Почему Брежневу?» - вскричал на весь проспект Аркадий - «Остановить! Вернуть! Немедленно!».  Обернулся на этот вопль  весь личный состав от Чапыгина до Карповки.  Рты раскрыл, за пистолеты схватился. Что делать и как реагировать, не знает. Но команды «пресечь», видимо, нет - начальству не до нас,  лимузины слишком быстро поехали. Ну а мы мгновенно протрезвели и в красотах Кировского затерялись. Через много-много лет Толя Моргунов, по моей просьбе исследовавший мое досье на Литейном, обнаружил там запись этого дорожно-транспортного происшествия с резолюцией, которую он мне процитировать отказался. Думаю,  там было что-то типа - «Расстрелять мудачье» Году, скорее всего, в 62-ом случилось на Кировском чрезвычайное, потрясшее меня и весь город, событие.  С карниза шестиэтажного дома напротив ДК собрался прыгать, кончая жизнь, какой-то несчастный.  Внизу собралась толпа зевак. На проспекте пробка, не пройти, не проехать. Ранняя весна, чистейшее небо, огромное солнце. Проспект запружён чёрной толпой. Милицейские во всех окнах. На самом краю огромного  карниза  фигура в сияющей белой рубашке,  то подходит к самому краю, то отступает. Волосы длинные, лица не разобрать.  По всей длине карниза расселась воронья стая, с оглушительным криком взмывавшая в воздух при малейшей попытке милицейских выбраться на карниз из окон.  Фигура в белом тут же делала шаг к бездне и все отступали. И так бесконечные 6-8 часов.  Наконец  привезли сеть и растянули внизу. Приехало высокое начальство. Уже стало темнеть, когда из окон на карниз решительно полезли пожарные и милиция. Воронье вскрикнуло, снялось  и кружило  потом высоко и почти беззвучно. Тишина повисла над всем Кировским. Было слышно,  как материлась цепь,  сжимавших кольцо на скользком карнизе, как причитала какая-то старушка в окне этажом ниже, как  у кого-то звонил в квартире телефон и лаяла псина. Человек в белой рубашке выпрямился, встал воей трубки и осторожно трогая кончик его хвоста черными лоснящимися сапогами, шутил сам себе – не бросить ли тушу аллигатора к подножию мавзолея вместе с фашистскими стягами. Окружающие восхищенно смеялись. И усатый хихикал. На содержание зверюге выделили приличное помещение и еду, почти такую же вкусную как в Берлине, когда кормил его с рук сам фюрер. А вот вокруг этой старой березы веселились они как-то с незабвенной подругой, дурачились, гонялись за собачкой Берии и глупая Шипка случайно ухватила собачатину за заднюю лапу, подбросила и одним хлопком челюстей бедняжку прикончила. На свою и всех беду. Страшный переполох был тогда. Шум и крики. Вся прислуга из зоосада исчезла сразу, а саму Шипку несколько дней избивали палками так, что прожила она недолго. Да и его несколько лет после этого из узкой клетки не выпускали, кормили впроголодь и особо не церемонились. Впрочем, было такое уже в его жизни. Очень было похоже на военные невзгоды, когда спасался он бегством в потсдамской канализации… И вот теперь ползёт старик, медленно передвигая лапы и почти не изгибая хвоста. Мерещится ему старческим полусознанием бесконечно далёкое - берлинские улицы, все в руинах, полузатопленные под мостами людские тела, сладкое детское мясо. Выделывает он большие «восьмерки» невероятными своими лапищами и ничего его не отвлекает от грустных, в принципе, раздумий о своей странной жизни, судьбе и мрачных перспективах. Не о завтраке, думаю, он думает, тем более не об обеде. Легкое ещё его утреннее сознание и чистая пока душа переносит его в розовые воспоминания детства, когда и деревья были большими и беды маленькими, земля мягче и вода чище, люди вкуснее, боги добрее, небо синее, жизнь куда веселее и интереснее. Я шел, чуть отставая, по параллельной дорожке и хорошо, крокодила понимал – ну чего ему в этой престарелой жизни, пусть комфортной, пусть спокойной и сытой, безопасной и донельзя скучной. Ни-че-го! Съесть бы кого-нибудь, свернуть шею, перекусить пополам, попить кровушку. За забором шумела Большая Грузинская. Бежала весёлая молодёжь, шаркали, стуча палочками, московские пенсионеры, расталкивали толпу плечами хмурые бородатые азиаты. У запертых еще ворот детского зоопарка прижались к прутьям решётки приезжие, разглядывающие чудовище, ползущее по пустой ещё аллее вдоль галдящего, квакающего и свистящего в нетерпении зоопарковского озера. К витиеватым церетелевским воротам заворачивает с Садово Кудринской роскошный лимузин. Из тех, о ком Генри Форд говаривал – «Автомобиль может быть любого цвета, если он черный». Тормозит огромное авто, упираясь радиатором прямо в закрытые ворота и перегораживая негодующим пешеходам тротуар и часть улицы. Выскакивает из машины дядя во фраке, распахивает заднюю дверь, из которой выплывает девочка лет четырнадцати, вся из себя стройная, таинственная и прекрасная. Её уже ждут за решеткой, которая чуть приоткрывается и пропускает красавицу на территорию для всей прочей публики ещё закрытую. Ох какой визг взмывает над очередью в кассы, какие слова и жесты… Девочка в сопровождении строгих мужчин и женщин, держащихся в шаге от нее сзади, выходит к ползущей твари и останавливается в метре от неё. Двое служащих зоопарка в новеньких отглаженных синих комбинезонах тут же накидывают на крокодильи челюсти намордник и натягивают поводья. Впрочем, у крокодила и так нет сил пошевелиться, лежит он на животе, раскинув лапы и только один глаз медленно приоткрывается и в желтом мёртвом его зрачке отражается фигура девочки и яркий солнечный ореол за ее головой. Вижу, мой начальник машет рукой, мол, иди сюда. Перешагиваю через низкую ограду, подхожу. – Вот, Лиза, это наш пресс-атташе Михаил Михайлович. Он блог ведёт нашего крокодила, хорошо знает его биографию. – Как крокодила зовут? – спрашивает девочка милым детским голосом и всё не решается чудовище погладить, все не решается до него дотронуться. – Это миссисипский аллигатор, – вплетаюсь я сходу в разговор, – Он очень старый. Обычные аллигаторы на воле живут лет тридцать, сорок, приперлись? – В начале пятидесятых, – продолжил я вполголоса, – был Сатурн счастлив, привезли ему из Штатов молодую самку, лет на тридцать моложе его самого, Хотели потомства. Шипка, так звали американку, его просто околдовала. Говорят, он от неё не отползал и когда она умерла, непонятно почему, горевал несколько лет, никого не подпускал, огрызался, пытался сам умереть. Впрочем, горе и смерть сопровождали его всю жизнь. И в Америке, и в Берлине, и в Москве. Вот послушайте, что пишет «Википедия» о его судьбе, – я раскрыл планшет, – «В свою бытность в Московском зоопарке Сатурн несколько раз чуть не погиб. В 1980-х годах от потолка аквариума отвалилась бетонная плита. Она упала на отделение с аллигатором, но, к счастью для Сатурна, он спал в защитной нише. Когда было построено новое здание аквариума, Сатурн сопротивлялся переходу, в течение четырёх месяцев отказывался принимать пищу, и был близок к смерти. Однажды, желая его разбудить, пьяный посетитель бросил ему в голову бу"}];
const q = document.getElementById('q');
const out = document.getElementById('results');
function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function render(){
  const term=q.value.trim().toLocaleLowerCase('ru');
  const arr=term?posts.filter(p=>(p.title+' '+p.categories+' '+p.text).toLocaleLowerCase('ru').includes(term)):posts;
  out.innerHTML=arr.map(p=>`<li><span class="date">${esc(p.date)}</span><a href="${p.file}">${esc(p.title)}</a><span class="cat">${esc(p.categories)}</span></li>`).join('');
}
q.addEventListener('input',render); render();
