ридумал и зашипел в ответ. Пресмыкающееся, судя по виду, очень удивилось. Так и застыло с вытянутой головой и застывшими глазами. Я подшипел  ещё разочек, чисто инстинктивно. Мол, все в порядке, не бойся. Шланг мотнул шеей, туда-сюда, и опустил голову, огромных зрачков, впрочем, от меня не отводя. Продолжать осторожное отступление или рвануть к дому,  я все не мог выбрать стратегию. И то и другое казалось рискованным. Шланг тем временем развернул спираль и медленно заструился в мою сторону. Это меня подхлестнуло. Как очутился на огромном садовом столе, стоявшем метрах в десяти, и не соображу уже.  Змея затормозила, не понимая, куда я пропал, опять вытянула голову, осматриваясь. Говорят, у змей плохое зрение. Фиг, она меня увидела и радостно, как мне показалось, заскользила к столу. Я переметнул тело на фонарный столб, мгновенно поняв, что розовые лианы, его обвившие, лишь упростят змее задачу.  Перебрался на садовый душ и с него уже подтянулся на козырёк второго этажа дома. Все эти каскадерские трюки я исполнял первый раз в жизни. И в последний, судя по сердцебиению и темноте в глазах. И тут раздался свист переходящий в шипение. Над забором, отделявшим нашу территорию от небольшого буддисткого монастыря, высунулась голова монаха, который сквозь рулоны колючей проволоки, разделяющей наши владения, кого-то свистом и шипением подзывал. Я быстро понял кого - от дома в сторону забора заскользила большая серая лента, быстро, не оглядываясь и не останавливаясь. Очевидно, ее ждал ужин. Больше она нашим бассейном не пользовалась. Думаю, ей объяснили, что белого господина пугать нельзя. Янгон, 2019"}, {"title": "Звук", "date": "26 декабря 2021", "categories": "Царапины на памяти", "file": "post/004.html", "text": "Притворяться не буду, уже пуста моя память, почти. Многого чего повспоминал  и «оцифровал». Может, конечно, в глубинах, давно не тревоженных, остались ещё мощные пласты былой жизни, но понятия я о них не имею, чем подсечь и вытянуть на поверхность  не знаю, да особого смысла и не вижу. Мне за это не платят. Какие-то огрызки воспоминаний ещё шевелятся, но погоду уже не делают. Зафиксирую я их или пусть со мной помирают, не принципиально. Двигаюсь дальше из чистого любопытства. Иногда по ночам или в болезненном состоянии возникают в тихой и пустой комнате звуки, явно «не отсюда». Редко голоса, чаще шумы.  Бо´льшая часть  так и остаётся  «звоном» в ушах без картинки и определения места и времени.  Но некоторые звуки, весьма немногие, я расшифровал и привязал к прожитому. Вот некоторые «синхроны». Взрыв страшного грохота от которого разрываются перепонки. Дальше тишина какой больше никогда не слышал. По склону холма бежит мальчик в панамке и без ног. Трава под ним красная и мокрая. Над ним белая вата взрыва. Второй мой «приятель» летит раскинув руки  над землей и недоуменно  на меня смотрит.  Это лето 45-го. Воронья горка в районе Пулково под Ленинградом. Детский сад на прогулке. Пожалуй, самый первый запомненный звук в жизни Топот ног над головой. Туда-сюда. Долгий и страшный. Бегут надо мной  по крыше вагона, в которую я упираюсь ухом,  лёжа  на третьей полке среди чемоданов и тюков. Потом выстрел, тонкий вскрик и падение чего-то живого, дрожащего.  Первый осознанный звук чужой смерти. 48-й год.  Сибирь. Поезд везёт нас в Комсомольск на Амуре. Звук взбешённых волн и хрюканье свиней. Оглушительное. Наша баржа тонет посреди Таллинского залива.  Я схватился за хвост барахтающейся в воде хрюшки и так продержался до помощи. Свиной визг - первый осознанный звук собственной смерти. Начало 50-х. Вой толпы с подвываниями, сирены над городом.  Март 53-го, Дворцовая площадь, Сталин помер. И не слезинки в маминых глазах, что меня потрясло. Первый звук сомнения. Вой толпы с подвываниями  и воплями «Уррра!». Невский. 12 апреля 61-го. Запомнил звук, поскольку в первый и последний раз в жизни присоединился  душой к толпе. Микс из хриплого  старческого   «many thanks»  с покашливанием вперемежку с соль минорной фугой Баха. Меня сгоняют с унитаза, поскольку это место очень хочет занять маэстро Стоковский.  57 или 58год. Я уже давно хожу без билета за кулисы в Большой зал Филармонии и пользуюсь туалетом зелёного фойе. После  Стоковского  Бах и Малер навсегда поселяются  в моих ушах. «Сейчас уже сомневаюсь, был ли Керенский мне мужем...». Какой-то шестидесятый. Мы пьём чай в квартире Тиме и я холодею от бесконечности дистанции. На стене портрет Качалова с чашкой в руке. Из неё я, кажется, чай и пью. «А ты кто?» спрашивает меня воспитательница детсада, когда я обзываю обидчика «жидовской мордой». Вопрос всей жизни, как оказалось. «Ваша фамилия и отчество? Скажите спасибо, что вам вообще дают работать».  78-79 -й. Останкино. Голос Лапина по телефону. Это когда я последний раз запросил штатную зарплату и тарификацию.  Больше не просил. И такая звуковая картинка болтается в моей памяти - «ой, еб же твою...», громко воскликает старшая пионервожатая на школьной линейке, когда я торжественно клянусь - «... очередной раз вступая в ряды...». Это первые пятидесятые. Уже не смогу и сосчитать, сколько раз меня выгоняли и вновь принимали обратно в ряды юных ленинцев. «Ни кому из моих не говорите, но я намерен умереть немедленно» - Аркадий  Райкин в подмосковном доме для престарелых. Год, примерно 84-й, когда мы ему предлагали очередной номер в очередном новогоднем Огоньке. Прожил ещё года три. Гул газовой струи в печи. И потрескивание. Это меня спустили в котельную крематория. Я ищу маму, поскольку отвязалась бирка. Невероятный рёв ракеты на Байконуре. Мы умудрились поставить камеру у самой площадки. Это, пожалуй, посильнее  Господа! Невероятная мощь. Звук томографа. Банальность. Но смешно, что последний раз мне в уши играли Малера."}, {"title": "Фотообои", "date": "24 декабря 2021", "categories": "Рассказы", "file": "post/005.html", "text": "... Все последние полгода его донимали родственники, сумевшие дожить до его юбилея - Ну, что подарить? Чего хочешь? Что нужно? Последний месяц просто стал кошмаром - с ним говорили только об этом - Ну, реши, наконец, что тебе дарить! Ну, помоги нам! Да скажи же, что лучше? Мало того, что слышать эти бесконечные напоминания о катастрофе было невыносимо, уши затыкались сами собой изнутри. Ни о каких нововведениях в своем дожитии он слышать не желал. Никаких изменений ни в своей комнате, ни на себе, ни при себе видеть не хотел. Никаких новшеств, отстаньте. - Ну, и куда я это дену? – было главным аргументом его защиты. И действительно, куда было бы девать эти подношения? Телевизор уже пару лет чернел в углу и годился только как мутное зеркало для приглаживания лысины. Менять зачем? Одежда, вся, и обувь, настолько уже срослись с телом, что и подумать о замене было тошно. Ничего нового, кроме трусов, он к себе не подпускал. Три парижские рубашки, еще в упаковке, пятнадцать лет назад подаренные на круглую дату, дожидались его в шкафу. Он еще прикидывал, в какой именно направится в последнее путешествие. Пара югославских туфель, еще тех – социалистических, ни разу неодеванных. Вот уж ссохлись, небось. Когда-то очень дорогой костюм «Ветер с востока», серый с блестящей нитью и двумя разрезами на бедрах, ждал его, весь из себя в целлофане, лет двадцать, если не больше. Носков, еще финских доперестроечных, штопанных – перештопанных, была целая коробка. Куда ещё! Ну куда? - Новый чемодан? Смешно. Теперь он сам собой багаж и уж точно ничего больше ему перемещать не придется. Бритва? Ещё смешнее. Его старая настолько притёрлась к его впалым щекам, так все уже обстругала и отшлифовала, нового кровопролития хотите? Бинокль? Ха, у него их четыре на антресолях. И морской там и театральный. И с линзами и без. Зонт? Большой, солидный, аглицкий. Куда? Все углы за шкафом тростями забиты. Новый диван? А старый на свалку!? Фиг вам, только со мной! Там каждая вмятина с чем-то связана, каждый комок, каждая трещина. Выкиньте потом, после. А сейчас ребята, отстаньте, не теребите. Родственники вздохнули, побродили ещё по интернету, пообсуждали разные варианты, ну не компьютер же старику дарить, он его и включить побоится, и на общем телефонном собрании решили подарить юбиляру фотообои. Во всю стену. С морским закатом. Он же давно на море не был, а мечтает, небось. Вот тельняшку свою хранит, не дает выкидывать. Из детских своих игрушек только парусную лодку сохранил. Из моржовой кости, желтая, высохшая, как он. И парус расслоился на отдельные нити. Но держит же на телевизоре уже какое десятилетие! Фотообои всех устроили. Выбрали картинку, замерили стену, заказали. Приклеить взялся дальний племянник. В командировку только съездит. За неделю до юбилея привезла старику доставка огромный рулон, с трудами затащила в комнату, поставила на попа в углу, заслонив окно и оцарапав потолок, подперла стульями, велела расписаться в получении и отбыла. Сын позвонил, сказал, что племянник в командировке задерживается, но ты потерпи, сделаем. Юбилей отгремел, все отметились, он не всех узнал, но всех стерпел, выпил полрюмочки, носом задул пару свечей на торте, красной икры лизнул, с десяток икринок, и форшмак поковырял.  Все поздравления терпеливо выслушал, правда, усилитель в ухо не вставлял и в губы тостующих особо не всматривался, ну что нового они сказать могут, ответный анекдот, еще институтский, рассказал, мало кто понял, и всех поблагодарив отправился к себе. Правнуки и праправнуки довели старичье до его дивана, чмокнули в районе подбородка и пожелали счастья, долгих лет и здорового сна на морском побережье. Пошутили так. Остался он наконец один на один со своей комнатой, старостью, жизнью, лицами и голосами, звуками и запахами, и с грустным шумом в голове. Лёг, подбил подушку повыше и стал смотреть в стену, где обещали повесить фотообои, стоящие рулоном в углу. Было темно, по потолку бегали огоньки машин, заворачивающих во двор, где-то разговаривал телевизор, кто-то под окном матерился, шумел город. Привиделось ему, что лежит он на своём родном диване на берегу океана. Ночной прибой подкатывает к дивану. Соленые брызги долетают до лица, глаз и й  ствол  имеет своего владельца, с фамилией, адресом и телефоном. Такие таблички по всему лесу прикручены. Позвоните, попросите, может веточку и разрешат. Но, скорее всего, пожалуются в полицию. Посягательство, мол, на частную собственность. Животный мир немецкого леса очень к гуляющим добр и приветлив.  Под ноги не норовит, клыками и когтями, у кого осталось, не грозит и пахнет не очень. Ничего большого, больше половины человеческого роста, в немецкие леса не пускают. Все такие рослые или в загонах или в соседних государствах. Лет пятнадцать назад  молодой неопытный итальянский медведь без спросу пересёк границу и заплутал в необъятных немецких  просторах.  Как же взбудоражилась общественность. Недели три это было главной темой немецкого телевидения и прессы. Диспуты - стрелять или сетью, шли круглосуточно. Я сам начинал день с выяснения - где Бруно покакал на этот раз, тем себя обнаружив,  и какой городок властям пришлось эвакуировать, что б не подвергать опасности горожан при встрече с единственным на всю Германию  диким животным.   В конце концов зверя пристрелили чешские охотники. Немецких, способных обидеть невинное животное, не нашлось. Три дня по всей Германии играли траурные марши Генделя да Бетховена. Наша домашняя  хозяйка, фашистка до корней волос, не скрывала слёзы по убиенному. По всей стране стоят замаскированные охотничьи вышки. Для чего они и что с них можно подстрелить - для меня загадка. Подозреваю, что они теперь только для желающих осматривать страну сверху и любителей селфи. Жизнь немецкого зверья упорядочена и светла. Оленята перебегают  дорогу строго по светофору, зайцы, лисы, ежи, бобры предпочитают селиться в крупных городах, легче воровать. У нас на барже в самом центре Берлина  все время пропадали продукты из холодильника. Застукали выдру. Выдрали ее пару раз хворостиной, но осторожно, чтоб общественность не увидела. Так она ещё наглее стала, весь выводок с собой привела. В немецких лесах лишь «цыганье», вроде кабанов, представляет некоторую опасность. Умозрительную. Правда, в Берлине в разгар карантина стаи кабанов повздорили с мусульманским землячеством. Сейчас власти думают эту проблему. Не представляю чего надумают. Не кабанов же дискриминировать. А как? Красивы немецкие леса необыкновенно. Особенно в горах Шварцвальда или не немецкой теперь Богемии, особенно с ранней весны по глубокую осень. Да и зимой они краше всех наших рождественских открыток, что получал я в России под Новый Год. И грибы там растут крепкие и красивые. Только никто их не собирает, кроме Клеймана из Ленинграда, да и тот, похоже, устал за всю немецкую нацию отдуваться. А в лесных городках живут в сказочных домах сказочные мастера, целыми семьями. Мебель делают, посуду, часы кукушечьи.  Только чтоб цены на эти часы увидеть, стоит в Шварцвальде побывать. Но туда ехать надо или трамваем или машиной. Пешком не дойдёшь. Все ж приличная  по размерам страна."}, {"title": "Таня", "date": "18 апреля 2022", "categories": "Царапины на памяти", "file": "post/007.html", "text": "Прослеживается её, понятно, еврейская фамилия с плотной в вензелях бумаги с печатью императора и затейливой начальственной росписью от 1898 года, что хранится в моем архиве. Сим, “по указу ЕГО ИМПЕРАТОРСКОГО ВЕЛИЧЕСТВА“, удостоверялось вхождение прапрадеда в почетный ряд купцов 1-ой гильдии города Орша, Могилевской губернии. Октябрьские ветра разнесли семена Фамилии по всей огромной стране. Два довольно развесистых куста взошли на питерской и московской почвах. Как же похожи эти растения, как легко просчитываются и прослеживаются их невесёлые советские судьбы. Все еврейские женщины первой волны пошли в медицину и педагогику. Вышли замуж за евреев, сменили фамилию и затерялись вскоре в круговертях военной и послевоенной нелепой жизни. Все еврейские мужики пошли строго по инженерному делу. Всегда первыми замами больших начальников. Всегда орденоносцами, но не лауреатами, всегда незаменимыми, но невыездными, все при квартирах, но без дач и машин. Все женились на русских жёнах разных поднациональностей и профессий. Все русские жёны с удовольствием готовили форшмак и недолюбливали евреев. У всех родились талантливые дети. Потомки, правда, ничего не понимали в инженерии и все как один устремились в искусства. На этом поприще фамилия более-менее прославилась и стала известна не только губернским властям города Орша. Но недолго продлился фамильный Ренессанс. Наиболее талантливых деток сгубила советская мясорубка, еврейская лень и русская водка. Да и внуков тож. Немногим удалось вырваться и разлететься по странам и континентам. Приспосабливаясь к Новым землям, исковеркали они фамилию, скомкали имена, поменяли родителей, встроились в мировое беспамятство. Потускнела фамилия, помрачнела, иссохла. И скорый конец ей виден. А надежд не видно никаких. И со спокойной грустью вспоминаю я своих однофамильцев, которых было много-много в моем детстве и юности, а теперь пересчитываю я их по пальцам одной руки. Наиболее яркой звездочкой на фамильном небосводе была Таня. Сам Ойстрах предсказывал ей всемирную славу. Вся развесистая семья на цыпочках следила за ее восхождением на Олимп. Ее нечеловеческая трудоспособность, упёртость и воля были главными радостями всех фамильных застольев и семейных бесед. Однажды утром Таня не смогла взять смычок в руку. Переиграла, сказали врачи. После долгих лечений на карьере виртуоза поставили крест. Остался с ней русско-еврейский ум, фантастическая музыкальность, тоска, водка, женская щедрость и недобрая русская судьба. И... И много чего мог бы я рассказать о них о всех - родных, любимых, почти забытых и забывших... Но зачем... С Днем рождения сестра! Всегда помню."}, {"title": "Быстрые ковидные зарисовки", "date": "26 декабря 2021", "categories": "Рассказы", "file": "post/008.html", "text": "Лежит Господь у себя в офисе на кушетке. Мрачный. Настроение плохое. Ничего не хочется. Входит Мафусаил. Господи, может отобедаешь? Кулебяку греть третий раз не хорошо. Уйди нехристь, не мельтеши перед глазами Праотец кряхтя уходит, отгоняя ногой сунувшегося в дверь Зюганова. Господь подзывает к себе пальцем бутылку водки, велит налить себя в фужер. Бутылка осторожно наклоняется и булькает жидкостью да не жадничай, наливай полную. В окно заглядывает мартышка - Третий нужен? Да пошла ты.                                                                                                                 По облакам засуетились тени, шёпот пошёл по верхушкам деревьев Не в духе, не в духе. Стаи журавлей затормозили в воздухе - поворачивай, сегодня дальше не полетим. Аллигатор занёсший зуб над оленёнком, оглянулся, испуганно попятился и плюхнулся поглубже в болото. Удивленный оленёнок поморгал огромными глазищами и остался на месте, не понимая - а дальше что? Солнце нерешительно ушло в тучи и там затаилось.  Погода засуетилась, не понимая куда дуть и какую задать температуру. Море заволновалось, но не сильно, баллов так на четыре-пять. Сельское хозяйство нехотя приостановило уборочную страду, заглушило тракторы и комбайны, на всякий. Министр обороны раздумал назначать зама министра обороны вместо себя. Что-то засомневался, да и куда спешить. Школы закрылись на срочные каникулы. Заодно и музеи закрылись  и филармонии.  Поживем пока не толкаясь. Народ решил не ходить на марш протеста. Но и на  марш поддержки не пошёл. Зябко, скучно, да и зачем? Богданович раздумал пока выздоравливать. Решил лишний раз Господа не беспокоить. А чем в больничке хуже, чем дома -  кормят, футбол показывают, в попу колют. Попа  давно перестала Господу жаловаться - недокалывают и Бог с ними, им же хуже. И такая дребедень целый день. А у Господа, всего-то, положительный анализ, чего всполошились! Вон в Коммунарке сколько мест свободных. Потсдам, 2020"}, {"title": "Портрет Дорианы", "date": "24 декабря 2021", "categories": "Рассказы", "file": "post/009.html", "text": "(трёхчастёвка) Часть первая Процесс выдумался не сразу. Примерно с месяц ушло на выработку технологии. Примерно за год экспериментов и подарков сложился помаленьку рынок и теперь к нему была какая-никакая очередь с предварительной записью. Заказов было даже с избытком для ленивой работы. Он едва справлялся. Подумывал о помощниках. Хотя и фотографирование и раскраску никому доверить не решился бы. Прежде всего нужны были дополнительные руки для сколачивания рамок из багета и остекление. И хорошо бы, чтоб кто-нибудь вёл всю бухгалтерию и канцелярщину. Самым сложным, время затратным и противным было фотографирование. И главным тут было не ремесло, а «угодливость». Угодить заказчику мог только очень терпеливый мастер. Надо было точно просчитать, чего ждёт клиент «на выходе». Тем более, клиент чаще всего решительно не понимал, чего же он сам хочет. Вот тут надо было сработать на интуиции и договороспособности. Понять и уговорить. Ракурс, наклон, полуулыбка, размер головы, световой нимб за. Нужен был портрет, глядя на который заказчик автоматически сам себе улыбнулся бы и, значит, сам себе бы нравился. «Любимое» требовалось фото - «не для паспорта». Это с одной стороны. А с другой – сфотографированный лик должен был быть максимально простым для прорисовки. Сложно вздернутый нос, треугольники скул, капризный излом губ – ох уж эти завитушки индивидуальности! Что-то, конечно, скрывалось светом, что-то поворотом или наклоном, что-то букетом или безделушками, а чем-то приходилось и жертвовать, да так, чтоб плательщик не сразу бы и заметил. Трудная, одним словом и между прочим, задача. По силам минимум гению! Коим наш герой и был. Фотографируемые плательщики капризничали, редко кому сразу нравился результат, всё просили дублей и дублей. С денежками, и немалыми, большинство расставались тяжело. За день ему удавалось «удовлетворить» не более трёх портретируемых. И к вечеру он полностью опустошался, умственно и физически. Утешался алкоголем, лежанием в подушках, редко женскими ласками. Дальше было проще. Следующим утром, не очень ранним, приступал он к творчеству. Не очень ранним, поскольку надо было глазам после фотомучений дать отд ителем. Водитель сидел сзади и перед его носом торчала задница оператора, прильнувшего к видоискателю. Сама камера представляла из себя контейнер длиной метра два, шириной и высотой под полтора. Изогнуться и выглянуть из-за камеры, что бы сориентироваться на площадке, оператору было невозможно и единственно за чем он мог следить и чем управлять - был фокус единственного 50 мм объектива в самом центре передней панели монстра. Впрочем, и следить за фокусом было проблемой, ибо единственным прибором визуального контроля был черно-белый киношный окуляр, пришпандоренный по центру задней стенки. Там же был и разъём головных наушников, висевших на крючке рядом с окуляром. Крючок был очень знаком, именно такие приспосабливали мы в наших дачных туалетах. Наклонять и поворачивать камеру было не под силу большинству операторов, справлялся ли такой задачей оператор-силач Пендер, не знаю. «Водитель» из-за спины оператора тоже ничего толком не видел и автомобильных «катастроф» на площадке было трудно избежать. Однажды в пылу съёмок на меня наехал коллега Удюрминский и только мой оглушительный вопль в эфире спас автора этих воспоминаний. Проконтролировать картинку в студии было тоже невозможно. На двух маленьких черно-белых студийных мониторах мы могли увидеть только границы кадра. Наверху в аппаратной был цветной монитор, но и он часто ломался и поэтому единственный контроль качества цвета во время эфира обеспечивали телефонная связь с кабинетом директора телецентра, там существовал единственный на Чапыгина надёжный цветной телевизор. Объёмных декораций почти не было. Понятия мы не имели, как их для цвета делать. Обходились задниками и кулисами. И как работать с цветом не знали, не было ни опыта, ни знаний. Ни у нас, ни у техников. На экране все получалось одного примерно цвета, но разной темноты и «зашумленности». Несколько попыток красить стенки разными цветами успеха не имели. Если света было мало, всё получалось серым, если много – белым. Такой же неудачей окончились эксперименты с цветным светом. Пробовали разные фильтры, но для функционирования камер требовалось такое количество общего света, что оно выбеливало любой цветной луч. Спасали яркие цветные костюмы выступавших, потому главным контентом нового телевидения были народные хоры и танцевальные коллективы. Петухи, подсолнухи и радуги на белых фонах кочевали из передачи в передачу. А выходило это чудо в Ленинградский эфир два, кажется, раза в неделю. Никогда в своей жизни не встретил ни одного телезрителя того телевидения."}, {"title": "ТЕЛЕСПЕКТАКЛИ МОЕЙ ЮНОСТИ (как не став актером я приобрёл некоторую известность) ", "date": "25 декабря 2021", "categories": "Телевидение", "file": "post/012.html", "text": "Служил я в те счастливые времена телевизионным оператором на зарплате ассистента и довольно часто попадал в состав тех или иных съемочных групп, снимавших те или иные телевизионные спектакли. Телевизионные спектакли на ЛенТВ шестидесятых шли в эфире практически через день и по популярности у зрителей и начальства уступали, пожалуй, только футболу и хоккею. Производство художественной телепродукции было поставлено тогда на поток, чего создатели нового телецентра на Чапыгина не предусмотрели. Студий и технических средств не хватало, про мизерный постановочный бюджет уж и не говорю. Многочисленные штатные и приглашённые режиссеры-постановщики умудрялись выпускать сложные, иногда блистательные, а то и почти   гениальные спектакли, довольствуясь минимальными техническими и творческими возможностями. Приходилось максимально сокращать и минимизировать творческий процесс - вся подготовительная работа велась дома, артисты звались, какие были в наличии, декорации и реквизит брались из подбора, одежка из собственных гардеробов, музыка, в виде виниловых пластинок, добывалась у друзей и знакомых, а съемочная группа формировалась чаще всего из приятельских отношений, по принципу «ты мне - я тебе» Утрамбованный более-менее съемочный коллектив приступал к репетициям «застольного периода». Правда, свободных столов на Чапыгина не всегда находилось и тогда это был скорее «скамеечный» или «лестничный» период.  Частенько на ступенях или на каменных скамьях стилобата перед телецентром можно было увидеть группки замечательных актёров и режиссеров, размахивающих руками и спорящих о высоком. Это они репетировали. Наступал съемочный период. В порядке живой очереди «проекты» получали пару-другую смен трактовых репетиции, после чего режиссеры традиционно писали слёзные докладные с просьбой дать им ещё немножечко порепетировать с камерами. Чаще всего ещё одну смену им давали. Неотвратимо накатывало время сдачи сотворенного начальству и непременного начальственного «нагоняя» за что-нибудь.  Бывало и запрещали дальнейшую работу, но это редко.  Для этого надо было очень обидеть советскую власть и сильно оскорбить партийные чувства конкретных цензоров. Такого я наблюдал лишь несколько раз, с Юрским, к примеру.  Ну а в благополучном финале творцы получали ещё одну-две трактовые репетиции на исправления высоких претензий, и всё - пожалуйте в эфир. Конечно же, вспоминаю я о временах до видеомагнитофонных, о золотом веке прямого телевидения с его трепетным чувством живого Эфира, совершенно непонятного нынешним деятелем теле индустрии. Тогда даже кабельмейстерша чувствовала, что несёт она камерный кабель не только за зарплату, но и во имя и для. Работать над телеспектаклями было не только почетно, но «прибыльно». Поскольку шли они в бухгалтерии по графе «художественного» вещания, то за каждый эфир полагались какие-никакие «постановочные». Операторы вроде меня получали за спектакль от пяти до десяти-двенадцати рублей.  Это, даже по тем временам, были не слишком большие деньги, от ассистентского безденежья не спасавшие, и приходилось искать   другие способы подработки. Одним из источников «обогащения» было участие в массовках.   На три, пять рублей это мелькание в кадре семейный бюджет увеличивало. И в нескольких телевизионных, как и киношных, съемках мне подзаработать удалось. Тут и пришло время рассказать историю, заявленную в заголовке. Конечно, было это так давно, что утверждать что-либо я не берусь, но кажется мне, что именно знаменитый режиссёр Клара Фатова взялась в середине шестидесятых экранизировать фантастические рассказы то ли Шекли, то ли Азика Азимова. И когда в спектакле, который снимался в малюсенькой 3-й студии, большая инопланетная массовка не поместилась, Клара Михайловна пошла экономным путём, сократив массовку до двух человек, одним из них позвав меня. Почему меня? Объясняю. Как всегда денег на экзотические костюмы и грим не было, а эти два звездных аборигена должны были хоть чем-то отличаться от обычных советских граждан. И Фатова решила, что такой   чертой может стать борода «пришельцев». Надо сказать, что в отличие от нынешних времён, бородатые люди на советских улицах были странностью. Относились к ним окружающие с подозрением, особенно милиция, дворники и начальники. Сколько раз мне указывалось на недопустимость моего облика, на его несоответствие высоким канонам, сколько раз меня собирались бить в трамваях и не пускать в кинотеатры, сколько раз различные инстанции вели со мной воспитательно- предупредительные беседы. Но брился я последний раз в десятом классе перед экзаменами и сияющего подбородка никогда больше не допускал. Вероятнее всего, из-за присущей мне некоторой лени. И когда помощницы Фатовой бросились искать бороды по коридорам Чапыгина, я был первой кандидатурой. Вторую нашли с трудом, где-то в недрах то ли постановочного, то ли осветительского цеха.  Нашей с коллегой задачей было фланирование по фону для оживления действия. Главные герои - знаменитые ленинградские актеры, в основном спорили и философствовали на крупных планах, а мы придавали «киношную» динамику и заполненность второму плану. У меня была и дополнительная задача. В финале трагедии суд приговаривал дочь императора к отсечению головы и я должен был вынести ее на руках из кадра навстречу смерти. Отрепетировали. Жажда славы добавила мне сил и я, как говорят свидетели, вдохновенно утаскивал девицу. Я так удачно исполнял все задумки режиссера, что был поощрён обещанием значительной роли в следующем спектакле. Наступил вечер эфира. По всему городу у экранов телевизоров замерли в предвкушении мои близкие и дальние родственники, трансляция спектакля шла и за Уралом и в Прибалтике, где телеграммами была предупреждена вся родня жены и родня родни жены, а в братской Эстонии даже некоторые члены правительства. В комнате же телеоператоров даже недолюбливавший меня Главный оператор пересел поближе к монитору, очевидно в ожидании моего фиаско. Так мне потом рассказывали. Я появлялся в кадре вовремя и кстати. Эфир шёл гладко, актёры играли увлечённо, спектакль явно удавался.  Приближался финал, наступал мой звездный час, я взволнованно готовился.  Принцессу играла изящная Ленинградская актриса, забыл, увы, кто именно, и на репетициях я блестяще справлялся, легко поднимая ее, запрокидывая в подмышку и изящно унося в сторону фонограммы народных рыданий и волнений ногами вперед. Но, как потом объяснилось, принцесса в порыве творческого вдохновения перепутала мизансцену и вытеснила на обговорённую для уноса метку мать свою, королеву вселенной, актрису преклонных лет и внушительного веса. Видеть этот казус я не мог из-за тесноты съёмочной площадки и по нужной реплике схватил, как и репетировали, фигуру в белом на нужной метке, приподнял ее и тут же надорвался. А уж попытки унести эту тушу из кадра должны были вызывать у зрителя гомерический хохот. Дело в том, что у королевы был ещё блистательный финальный монолог, которым все действие должно было завершаться, и который актриса все последние недели вдохновенно репетировала. Естественно, она всеми силами и весом моему уносу сопротивлялась. В результате я ее с грохотом выронил и она, заслуженная актриса РСФСР, в кадр обратно приползла и, отпихиваясь от меня ногами, финальный монолог прямо в присевшую над ней камеру, спасибо коллеге, выдала.  Пошли срочные титры. Фатову откачали, цензор позвонил на пульт и всех поздравил, отметив немного «смятый» финал, я предпочёл на банкет не идти. Где-то через неделю пошёл я в кассы Ленинградского вокзала покупать себе билет в Москву. Билетов, как всегда, не было. Но кассирша пристально на меня посмотрела. - О! -, крикнула она товаркам, смотри, кто пришел! Это вы эту чушку об пол грохнули!?  Здорово у вас это получилось! Мы всей семьей смотрели. Так ей и надо!» И вытащила из-под прилавка билет на «Стрелу»."}, {"title": " МАКБЕТ", "date": "14 ноября 2022", "categories": "Телевидение", "file": "post/013.html", "text": "В 62-м году при съемках «Макбета» мне доверили съемки сцены - «Болото с ведьмами». Для этой небольшой, но важной сцены художник, уже, конечно, не помню кто именно, заполнил водой бассейн в полу первой студии нового ленинградского телецентра. Ни до него, ни, насколько помню, после этой возможностью самого большого и самого современного съёмочного павильона никто не пользовался. Слишком уж сложным было и заполнение и особенно опустошение этого бассейна. Но для Давида Карасика решили рискнуть, заодно технологию водных съёмок проверить. Полдня осторожно наливали воду, потом реквизиторы затянули бассейн сетью с тряпичной травой и мочалками, изображавшими болотную тину, повтыкали по углам камыш из закупленных на ближайшем рынке веников, всюду разбросали пластмассовые цветочки и гирлянды и все это густо полили чёрной тушью. Получилось довольно вязко. Посреди этого киселя разместили фанерные листья лотоса для актрис ТЮЗа, нанятых исполнять малоприятные роли шекспировских ведьм. Вот весь этот Содом и Гоморру мне доверили снимать с крана, подняв стрелу с камерой под самый потолок студии. Первую пару трактовых репетиций было интересно и поучительно. Потом я сильно вспотел, весь жар студийного света взмывал ко мне под потолок, и расстроился - волей ведущего оператора, как оказалось, меня обрекли на жуткие творческие страдания. Мой общий план поросшего ряской водоема даже панорамы не предполагал. Даже движения вниз-вверх стрелы, даже, черт возьми, крутануть турель для смены оптики, почти невидимо для зрителя, как я умел и чем гордился, было запрещено. Моей задачей было держать мертво-намертво кадр и фокус все несколько минут сцены. И ни-ни творчества. Это ж было невыносимо. Не нашёл я теперь в сети упоминания этого телеспектакля Карасика и не очень помню ведущего оператора. Но в те годы Давид Исаакович работал предпочтительно с Володей Геллерманом. Предполагаю, что и тут Володя «царствовал». Просидел я на болотном кране несколько репетиций, пень пнём, жутко поскучнел и решился внести свою лепту в теорию и практику телевидения. Дома над газовой плитой соорудил из тончайших плексигласовых пластин несколько искажающих фильтров, руководствуясь статьей об оптических искажениях энциклопедии Брокгауза и Ефрона 1914 года выпуска. Изделие, в виде прозрачного шара, принёс в студию и приспособил на один из широких объективов моей камеры. Ну и, естественно, проверил эффект на ближайшем же тракте в перерыве репетиции. Так мне понравилось! Мое болото заструилось, покрылось пузырями, буквально «зачавкало» всплесками и омутами. А все три ведьмы взмыли над болотом, повисели там в гнилой высоте и начали распадаться на отдельные фрагменты. Это был успех, это был прорыв! Одного я не учёл, за одним не уследил. Поскольку мои революционные пробы проводились в основном во время чайных и папиросных пауз всей группы и технического персонала, то съемочный коллектив оказался не в курсе моего творчества. Никто моих спецэффектов на мониторах не видел и к их оглушающему действию готов не был. А опасность подобного неведения я себе не представлял. И тут настал день потенциального триумфа. День генерального прогона и сдачи спектакля высокому начальству. Кажется, Бажину. Или даже Фирсову. Все шло неплохо до болотной сцены. Я висел на своём кране практически на уровне аппаратного окна и видел довольные улыбки на лицах режиссерской группы и Приемной комиссии. Прозвучала «болотная» отбивка и ассистент режиссера, кажется, но не настаиваю, что это была Таня Васильева, плавно передвинула микшерную ручку, выводя мою камеру на эфирный монитор... Я дал ведьмам несколько секундную возможность произнести начало шекспировского текста и начал вращение оптической системы. В аппаратной все стихло. На глазах ошеломленного режиссера и неподготовленной комиссии от ведьм стали отделяться руки-ноги, головы, их балахоны, взмахнув полами, стали закручиваться сначала в одну, потом в другую стороны, рты и носы впали внутрь черепа, глаза увеличились и переползли на затылок... Я, конечно, был «в ударе» и крутил свою Латерну магику от души. В аппаратной повисла абсолютная тишина. Потом Таня Васильева, если это была она, изумленно выдохнула - что это? А где оператор? Что происходит, заикаясь, спросил Карасик? Где болото? Кто эти в белом? А разве у нас была такая сцена? - прошептала донельзя заинтригованная редактор Эй, на кране! - сориентировался наконец в студии Геллерман, если это был он, - что у тебя, черт возьми, случилось!? Я мгновенно «очнулся» и испуганно оторвал насадку от объектива - ведьмам сразу вернулось человечье обличье. Первым членораздельно и властно заговорил Бажин, или Фирсов. Так, сказал председатель комиссии, налицо вредительство и халтура, аппаратная не готова для сдачи ответственной работы. Вызовите сюда старшего смены, пусть разбирается. Тут же сбежалась в студию толпа технических девушек. Очень хорошеньких. Пришла куча синехалатных инженеров и просто начальства. ГЕЛЛЕРМАН, прежде других вычисливший причину скандала, грозно на меня посмотрел и шёпотом велел изобретение засунуть подальше и спрятаться, что я немедленно и сделал. Камеру сняли с крана, вскрыли ее и долго во внутренностях копошились, удрученно доложив наверх, что дефект «гуляющий» и надо, чтобы его «поймать», несколько часов просто погонять тракт. И меня и спектакль спас, как когда-то и все человечество, еврей. - Да ладно, чего терять время, это камера на кране, очевидно, перегрелась под светом и стала глючить - сказал спаситель Володя, показывая мне исподтишка кулак. - Давайте ее заменим и запустим прогон ещё раз! Запустили. Я просидел над болотом под студийным потолком ни жив, ни мёртв. Сдача прошла нервно, но ровно. Особо в конце и не обсуждали, так все, за исключением Бажина, или Фирсова, переволновались. Сцену на болоте смотрели во все глаза. Карасик аж встал. А я как вспотел. Признаюсь, если б не Володя ГЕЛЛЕРМАН, уволили бы меня с Чапыгина значительно раньше. 1962-2019"}, {"title": "Гусь", "date": "24 декабря 2021", "categories": "Царапины на памяти", "file": "post/014.html", "text": "Было это при крепкой советской власти начала восьмидесятых. Для министерства, которому киноотдел в котором я прирабатывал принадлежал, следовало снять какое-то кино. Не помню про что, про что-то связанное с торговым машиностроением. Снимать надо было в любимом Киеве. Командировки киноотдела планировались задолго и надолго, с хорошим  временным запасом на пожить и поработать в своё удовольствие. И куда было спешить, снимая никому не нужное кино в комфортных условиях и за очень приличные министерские деньги. Столько усталых киношников кормилось в советские времена на стезе отраслевой кинематографии. Сказочная была кормушка. И сказочные профессионалы при ней кормились. Так вот, про Киев. Я был занят чем-то на ЦТ и решил лететь на съемку прямо к ее началу.  Группа же, как обычно, выехала на своём автобусе с опережением  меня на несколько дней. Автобус у киноотдела был замечательным, как, впрочем, и все остальное - уютный  подвал с кухней и комнатами отдыха, кинозал, не хуже «Метрополя» (был такой кинотеатр в самом центре Москвы, я одно время в нем художником служил),  аппаратные, забитые вполне приличной кинотехникой для съёмок, монтажа и озвучки... такая, в общем, маленькая  амбициозная «частная» киностудия, укомплектованная замечательным коллективом алкоголиков. И это  при том, что сам руководитель отдела, Гриша И. , любую бутылку обходил за  версту, ни-ни. Он, вообще, в этой компании, да и во всей отрасли,  был восхитительной белой вороной, всех удивлявшей своим трепетным отношением к работе и высочайшим творческим потенциалом. А чего ещё было ждать от юноши из Риги. Но продолжим. В Киев отправился автобус «РАФ», ведомый штатным водителем киноотдела, по фамилии, естественно, Рафиков.  С операторской бригадой на борту, во главе с легендарным Толей Мокроусовым. Ну, Толя - это такая Музыка в папу, что подробный рассказ о нем отложу для другого случая. Ещё там был ассистент оператора  уникальный Дима... (э, черт, склероз. Забыл фамилию такого человека!) и ещё пара персонажей, которых я совсем, к сожалению, плохо помню.  Но рассказу это помешать, вроде, не должно. Важно следующее. Командировочные, вполне приличные, обычно спускались съемочной группой в первые три веселых и сытных дня, а дальнейшее ее существование строилось исключительно на талантливых импровизациях по добыванию водки и пищи. Этим искусством наши ребята, особенно ассистент Дима, владели всовершенстве. Теперь обратно к истории.  Прилетаю я в Киев, куда уже доехала группа, и оказываюсь в центре  фантастического скандала.  Группу мою из гостиницы выселяют, испуганного Диму  с особым пристрастием допрашивают люди в чёрных  глаженых костюмах. Съёмки отменяются, из Москвы срочно летит заместитель министра по кадрам. А дело, выясняется, случилось такое  -  РАФ преодолел российские просторы и двигался по дорогам Украины в сторону  столицы. День был четвёртый и служители «десятой музы»  постепенно начинали  экономить. Киношники традиционно подворовывали  на полях картошку с помидорами и вполне сносно питались. Запаса водки хватало. Ничего не предвещало. Но тут случилось непоправимое. Их командировочный путь пересекло стадо упитанных и  невинных гусей. С этого момента остановить беду стало невозможно. Не останавливая машину, прямо на ходу, Дима подсёк одного,  самого толстого, и затащил его в салон. Что б гусь сильно не возмущался и не мешал водителю Рафикову, ему в глотку залили бутылку водки и упаковали в чемодан с осветительными приборами. Так и привезли пьяного и ничего не подозревающего гуся в Киев и прямо в чемодане протащили в гостиничный номер. Теперь о гостинице, что важно.  Министерское кино селилось всегда в премиальных условиях, поскольку почти всегда выполняло высокие или очень высокие партийные и правительственные задания. Так было и тогда. По звонку  сверху  забронировали для нас в особой гостинице Киева  полулюкс и ещё один одноместный.  В большом номере мы обычно селили группу, так проще было держать  пьяниц в узде, а одноместные занимали сами. Вселившиеся в роскошный номер усталые, уже безденежные и  оголодавшие наши сотруднички, первым делом приступили  к приготовлению ужина. Этой технологией они владели в совершенстве.  В хорошо проветриваемом месте, обычно  в ванной или на балконе, устанавливался всегда возимый с собой  гриль со спиртовыми таблетками. На  худой конец подходило и ведро с паяльной лампой. Огонь от чужих глаз  завешивали брезентовыми панелями или подходящей мебелью, запахи отсасывали специальным мощным и не очень громким пылесосом. Умели. И тут развели костёр в мраморном душе и ещё не совсем проснувшемуся гусю подло отрубили в унитазе  голову... Вмиг протрезвевшая безголовая птица вырвалась из рук поваров, выскользнула через плохо прикрытые двери и помчалась зигзагами, сначала по номеру, потом по гостиничному беломраморному коридору, размахивая обрубком шеи и поливая ковры, белоснежные стены и портреты вождей потоками крови. Гуси, как известно, и без головы хорошо бегают. Не понимаю только, как ориентируются. А навстречу, естественно,  шествовала по коридору высокопоставленная коммунистическая делегация, кажется, из Анголы.  И тоже все в белом. Рафиков  утверждал, что в этот момент звучала по гостиничной радиосети песня  Толиного папы   «Снова замерло все до рассвета...». Москва, 2018"}, {"title": "Три рассказа", "date": "24 декабря 2021", "categories": "Царапины на памяти", "file": "post/015.html", "text": "Ещё несколько «царапин» на памяти Все из конца 70-х, начала 80-х КОЛОКОЛ Название города вспомнить не получается. Клин не Клин, но город от Москвы недалекий, старинный, на слуху. Поехали мы туда снимать что-то сталелитейное. Въезжаем в город,  а над ним колокольный звон. Протяжный, «малиновый».  Вот она, думаю, Русь святая! Под колокоп вселяемся в гостиницу, ужинаем. Звенит, не прекращается ни на минуту. Густой, «тяжелый». И ночью не смолкает. Еле засыпаем, заткнув уши. Утром за завтраком спрашиваю явно местного, раздражённого и невыспавшегося, - Что у вас тут за праздник? Колокола второй день не умолкают. -  Какой, к черту, второй - взрывается горожанин - скоро пятый уж!  И к какой-такой твоей матери колокола! Это в шахте вентилятор с оси  сорвало и ни одного трезвого монтера в городе найти не могут, что б его отключить. Из Москвы ждём. Правильно, значит, я про праздник спрашивал. А то с какого перепоя? ГАДЖЕТ Пришёл заказ снять новое достижение советской промышленности - банковский автомат для пересчета бумажных рублей. До начала восьмидесятых это автоматизировать никак не получалось, поскольку все бумажные купюры размерами и плотностью отличались. Про цвет уж и не говорю. Поехали в Ленинград в соответствующий НИИ. Ставят перед нами ящик размерами с большой телевизор. Дизайн, конечно, наш - накладные полоски из нержавейки, пупырчатый металл в приёмной нише, световая панель из оранжевых светодиодов. Чего там снимать! Прошу показать в действии.  Изобретатели смущаются, говорят, что запустить могут только вхолостую. Вот те на, удивляюсь - а что же снимать? Понимаете, говорят -  смежники-химики сорвали правительственный заказ, не изобрели эмульсию, что б бумажные рубли между собой в пачке не слипались  бы. А они слипаются и мы их «сухими» пересчитать, увы, не можем. Думайте, говорю - заказ на кино министерский, ваш ящик в подарок съезду партии назначен. Вхолостую никак нельзя. Думали они думали и в результате мозговой атаки процесс съемки выглядел так. Камеру поставили перед лотком, загрузили в приемное окошко автомата пачку рублей и запустили механизм. Заурчал тот, лампочками замигал, пытается каждую бумажку от пачки оторвать, не получается. Но за  автоматом сидел пригнувшись главный инженер института, изобретатель чудо-техники, и слюнявил языком каждую вылезавшую к нему купюру. Слюнявил и обратно засовывал. Машина напрягалась, дрожала, но смоченные бумажки принимала, перелопачивала и результат высвечивала. Получилось, Слава Богу Ну а я, при печати негатива, скорость попросил увеличить. Нормальное кино получилось, бодрое.  Министр Съезду подарил. СОЧИ Эту историю я люблю и хорошо помню. Опять же, в ней приняли участие уже известные вам  Анатолий  Мокроусов и Дима Слоевский. Перед Олимпиадой  партия решила автоматизировать Общественное питание. По всей стране возвели кафе-автоматы, в которых голодные советские люди могли без очередей и хамства удовлетворять  свои потребности. Заказ на такое кино нашел меня, а я нашёл Толю и Диму. Вопрос с местом съемки решился практически мгновенно. В Сочи, естественно. Не в Сыктывкар же. Прилетаем в осеннюю сказку и идём  прямиком в горком к соответствующему товарищу. Он нам не очень рад, но согласен поселить группу в лучший партийный санаторий на море. Только со съемкой кафе-автомата, единственного в городе, неувязочка - конец сезона, продовольствия в городе дефицит, на кафе не насобираешь.  Лучше, говорит, возвращайтесь в Москву, там в ГУМе точно такое же кафе.  При ГУМе, аргументированно отвечаю, нет моря, а нам поручено снять красиво. Возразить ему нечего, и хоть сильно он недоволен, но собирает совещание с руководителями городского снабжения - чем москвичам поможем, товарищи? Договариваемся, что через неделю, раньше никак, откроют для нас кафе-автомат «Волна» на набережной. Его ни разу с момента торжественного ввода в строй, не открывали и автоматы заржавели. Починим. Обсудили и ассортимент. Я на иллюстрациях из книги о вкусной и здоровой пищи объяснил товарищам, что хотелось бы иметь в кадре. Мокроусов особенно настаивал на красной икре и пиве. Сказали, что поищут. Через неделю замечательной жизни на берегу тёплого ещё моря, явились мы в кафе снимать кино.  Рано утром, чтоб солнце не упустить, и натощак, поскольку кафе всё ж.  Все открыто, вымыто, блестит, только совершенно пусто. На вращающихся полочках автоматов ни крошки.  Час ждём, другой. Проголодались. Разозлились. Ищу  телефон, чтобы в министерство пожаловаться. И тут. Въезжает на площадь перед кафе-автоматом кавалькада чёрных машин. 4 штуки, одна за другой, как на параде. Шикарно разворачиваются и причаливают прямо передо мной. Из каждой выходит черно-белый официант и на вытянутой руке держит поднос с единственным бутербродом на каждом. 2 бутерброда, таким образом, с красной икрой и два с ветчиной. И торжественно передают все это изобилие механикам для загрузки в автоматы. Вслед выползает из машины подвыпивший товарищ и объясняет мне, что это все, что они смогли в городе найти. Мол, мы вам говорили. И делайте, что хотите, кому хотите жалуйтесь, но больше продовольствия вы в городе Сочи не найдёте! Я понял, что таким образом указали нам на наше плебейское место и возмущаться совершенно бесполезно. Сняли мы эти четыре бутерброда со всех сторон и при разном освещении, проследили за их путешествием по внутренностям автоматов, сняли общие планы на закатном солнце и при электрическом освещении, и съемки закончили. Толя и  Дмитрий руки уже к бутербродам протянули, весь день не евши. Так во всем киношном мире принято, что съестной реквизит после съёмок  остаётся съемочной группе. По другому не бывает. Но не в Сочи. У четырёх бутербродов, оказывается, были не только носильщики -официанты, но и охранники. Люди в чёрном  отодвинули Толины руки,  потянувшиеся за хлебушком, аккуратно сняли реквизит со стеклянных полочек и водрузили его на подносы официантов. По одному на поднос. Всё медленно, плавно, демонстративно. Расселись по машинам, бутерброд на лимузин, и «парад» величаво покинул нас, увозя с собой все четыре куска хлеба с икрой и ветчиной.  Очевидно, повезли обратно  в партийный буфет. Толя в тот вечер не мог вымолвить ни слова. Таким ошарашенным я его никогда не видел   Одно меня до сих пор интересует -  весь этот «балет» надо же было придумывать, режиссировать, репетировать  Совсем нечего было делать сочинским товарищам? Или они так москвичей ненавидели?"}, {"title": "Вишнёвый ЗИМ", "date": "9 января 2023", "categories": "Повести", "file": "post/016.html", "text": "Михаил Либин Авантюрная повесть Если бы я писал режиссёрскую разработку всего этого, то начал бы с длиннющего начального кадра. Чтобы подчеркнуть неторопливость повествования. Отлёт камеры от переукрупнённого морского горизонта – кипящая линия  между небом и водой;  ныряющие за покатость шарика облака; мачты подтопленного горизонтом парусника; неправдоподобно огромные, похожие на парящих над водой рептилий, чайки, искаженные длиннофокусным объективом;  толкающиеся у входа в порт нефтяные баржи и угольные сухогрузы; прогулочные шлюпки, выброшенные по случаю волнения на песчаный пустынный пляж и перевернутые к небу красными потёртыми днищами;  над ближайшей такой шлюпкой высокий молодой человек в тюремной робе разложил на корме прижатый камешками серый двубортный костюм и пальцем оттирает от пятен черные лакированные туфли.., а камера летит дальше и дальше над гудящей тишиной, над песчаными завихрениями, над обрывками газет, мусорными урнами, переполненными арбузной в крупные семечки мякотью, над пивными бутылками и рыбьими позвонками, торчащими из всех щелей, над красными с белыми буквами полотнищами и остроносыми звездами… Провинция, областной центр, вечный  СССР, гордая нищета и абсолютная предсказуемость. На фоне вышеперечисленного плывет снизу вверх титр - «Хотя всё рассказанное в нашем фильме и происходило на самом деле, но все фамилии, места и герои этой истории – выдуманы авторами, которые за случайные совпадения ответственности нести не хотят и не могут.» - … Камера сворачивает от пляж еня несколько раз лишали месячной премии, рублей так по пятнадцать. Потому как я, в качестве ведущего оператора, допускал запись дублей, то есть допускал перерасход. Никакого, естественно, электронного монтажа. Записывали все действие одним куском в привычном режиме «прямого эфира». В исключительных, скандальных и наказуемых случаях, допускалась склейка пленки, с вырезом лишнего или вредного по цензурным соображениям. Резалась и склеивалась пленка по специальным лекалам под увеличительным стеклом осциллографа, монтажник искал стык сигналов соседних кадров. Умели это делать лишь пара-другая инженеров телецентра и были они..., ну очень из-за этого «заносчивыми». Куски вырезанной пленки Актом со многими подписями списывались и должны были утилизироваться. Но фиг, заносчивые инженеры умудрялись обрезки пленки собирать и склеивать в рулоны, что б «надежным» операторам и режиссерам, в число коих и я быстро попал, «дружески уступать» в критические для тех моменты. Из ещё важного для понимания пропавшей жизни - технология начала записи была следующей - ассистент режиссера, при готовности всех к съёмке, кричал женским, как правило, голосом в трубку обычного городского телефона - «старт» и волнуясь ждал ответного издалека вопля - «запись», что означало - «мотор пошел». Это когда магнитофон удачно запускался, что с первого раза было почти чудом. Съемочной бригаде после такого ответа следовало немедленно приступать к творчеству. Обычно на эту стартовую процедуру уходило, при счастливом стечении обстоятельств, около минуты-другой-третьей, во время которых всё на площадке замирало в тревожном напряжении. И не дай Бог кому-нибудь помешать этой нежнейшей технологии! А уж облажаться на самой записи - это вообще самоубийство, ну представляете последствия. Про это в телевизионном фольклоре есть много анекдотов и историй. Есть они и у меня. Буду помаленьку вспоминать и записывать, если хватит времени, сил и удовольствий.  Первой реанимировал совершенно документальную историю, со мной произошедшую - «Как я руководил советским правосудием». \"Встать, Суд идет!\" Или \"Как я руководил советским правосудием\" Год? Думаю, 62 или 63-й. Видеомагнитофоны еще не научились размещать в специальных автобусах (ПВС) и вывозить на съемочные площадки вне телецентра. Но записывать на магнитную пленку телесюжеты \"с натуры\" уже было модно и поощряемо. Видеосигнал при этом в аппаратные шел по радиоканалам. Благо, приемные тарелки даже старой телебашни на Павлова были видны в Ленинграде практически отовсюду, с любой крыши. Важно, что все радиочастоты в городе принадлежали военным и для телевидения выделялось весьма ограниченное время рабочего эфира. Поэтому одним из самых главных условий выездной работы была необходимость в это время строго укладываться. Для переговоров с телецентром пользовали обычную городскую телефонную линию. Чаще всего подключались прямо к телефонному автомату ближайшей уличной будочки.  За 2 копейки, если помните.  Бывало, в нервные переговоры с Чапыгина вмешивался случайный прохожий, вошедший в будочку и требующий от посторонних не мешать его разговорам с тёщей. Тут было море трагедий, анекдотов, невероятных историй. Итак, вспоминаю одну из, ну, одну из самых любимых. В цикле ленинградских телепрограмм о советской власти под названием \"Как это делается\" предстояло снять репортаж о работе простого советского Суда. Чтоб далеко не ездить, выбрали Народный суд Петроградского района, рядом со Студией.  Развернули ПТС, протянули кабели, расставили в зале камеры, свет, микрофоны... Фабула пятнадцатиминутного, согласованного на всех властных уровнях, действа была предельно чёткой - перед Народным судом предстает конкретный, с именем, фамилией и местом работы, нарушитель каких-нибудь правил советского правопорядка. По ходу процесса выступают все типичные для судопроизводства персонажи: прокурор-обвинитель, свидетели, защитник, народные заседатели, обвиняемый с последним словом... И в результате реального судебного состязания выносится взвешенное и, главное, всем понятное решение. И телезритель всю эту государственную кухню видит в действии, в ее несокрушимую справедливость, понятное дело, верит неистово и советскую власть любит еще больше. Редакторы нашли подходящее Дело. Кстати, подсудимым совершенно случайно оказался работник ленинградского Телецентра, что-то с кем-то не поделивший в ближайшей пивной. С некоторым трудом уговорили его поучаствовать в таком нужном и важном деле правого просвещения граждан. Естественно, пообещав ему за это всяческие судебные поблажки.  И прощение на службе. Кажется, обещали всего пятнадцать суток, при том, что дело реально тянуло на пару месяцев заключения. Я был оператором на центральной камере и все контакты режиссерской группы в ПТС с участниками процесса в зале должны были осуществляться через меня. Ок, я не против. В зале хоть и случайная, но более-менее проверенная бригадой и дежурными милиционерами публика. Пару затесавшихся бомжей вывели. На передние ряды под камеры я пересадил людей с максимально трезвыми лицами. Зажгли приборы. Все готово. Судья - симпатичная пожилая женщина ждет начала в судейской комнате. Дверь в судейскую чуть приоткрыта и в щели блестит глаз секретарши, ждущей мою команду на начало процесса. Очень смущенный камерами и светом подсудимый ёрзает на своей скамье в милицейском окружении. Помощник режиссера поправляет ему прическу. Милиционеры украдкой разглаживают ладонями свои гимнастерки. Обвинитель, адвокат и свидетели что-то бормочут, репетируют написанные редакторами речи.  Я, в \"ушах\" и с поднятой для отмашки рукой, жду соответствующую команду из ПТС. Слышу нервные телефонные переговоры автобуса с аппаратной на Чапыгина. И наконец – «Мотор! -  Пошел мотор!» ... и через минуту яростный крик ассистента режиссера – «Зааапись!». Машу рукой и хватаюсь за ручку фокуса. Дверь распахивается. Выскользнувшая из дверей секретарь суда провозглашает, сильно волнуясь, - «Встать, Суд идет!» Все радостно вскакивают, милиционеры выпячивают груди и подбородки, входит судейская тройка, рассаживается, раскладывает бумаги, судья начинает заветное - \"Именем ... \" В этот момент у меня в ушах вопль – «Стоп-стоп! Мотор не пошел». Отчаянно машу судье и заседателям – «Остановитесь, мотор не пошел, извините, еще раз начнём\". Работники правосудия немного удивлены, но собирают бумаги и уходят. Не каждый же день у них съемки. Опять в дверной щели появляется слегка испуганный секретарский глаз. Ждём минут десять. Снова «Мотор!» и через минутную паузу – «Начали».  Опять машу изо всех сил. «Встать, Суд идет!»\" – торжественно произносит Секретарь. Все встают. Суд входит и рассаживается, судья поднимает молоточек и открывает рот... «Да што ж это! Стоп-стоп!» Кто-то снял трубку в будке на улице и пр"}, {"title": "И аз воздам — часть вторая", "date": "29 ноября 2021", "categories": "Повести", "file": "post/019.html", "text": "И  АЗ  ВОЗДАМ Повесть в трех частях Часть вторая СЛЕДУЮЩИЙ Летел он долго, даже заскучал. Полёт в бесконечной трубе надоел порядком. Ничем его при этом не развлекали, ничего обещанного не показывали - ни его детства, ни летавших здесь до него родственников, ни сцен из жизни, ни трансляции поминальных событий после его отбытия… Ничего! Летел он, как его и положили, на спине со сложенными на груди руками.  Несколько раз пытался вывернуться, чтоб глянуть вперед, но лететь в таком извороте было крайне неудобно, к тому ж встречный ветер хлестал по щекам и глазам и ничего кроме яркого пятна в конце тоннеля он все равно не видел. Пришлось смириться. В принципе смотреть было не на что. Лишь бежала назад над головой лента серого бетона да мелькали температурные швы, позволяя оценить довольно резвую скорость перемещения. И неожиданно тихо было в трубе. Ветер, конечно, подвывал, но никакого, казалось бы присущего такой ситуации, прощального звукового обрамления не было. Ни тебе Гайдна, ни Шопена, ни Вивальди или хотя бы Свиридова с его бессмертным «Время вперед». И барабанной дроби с волынкой не слышно было. И не громыхало ничего. Только свист рассекаемого воздушного потока и шорох осыпающейся с потолка и стен, вслед его быстрого пролета, штукатурки. Хорошо хоть, что он летел быстрее, чем она сыпалась. Знать бы заранее, взял бы в гроб чего-нибудь защищающего, очки мотоциклетные, к примеру. Он заулыбался, оценив собственную шутку, тут же, впрочем, удивившись своей такой легкомысленной реакции. И думать было особенно не о чем. В начале полета, когда он очнулся после неизвестно сколько длившейся черноты, ужас, изумление, неверие в происходящее заполнили все его клеточки, сковали все его кости и мышцы, оглушили все чувства и он не то что подумать, он пальцем не мог пошевелить, ресницей дёрнуть, чихнуть не мог. Но потом как-то отпустило. Успокоился, расслабил летящее куда-то тело, стал посматривать по сторонам. Пара-тройка мыслей посетила мозг – неужели это со мною, неужели это правда, значит, не всё ещё кончено, значит есть… Ни одну из этих мыслей он додумать не мог, они недолго задерживались, выветриваемые набегавшей воздушной струёй. Последние пару месяцев он провел в коме и напряженно думать разучился. Да и зачем? Докторскую уже не защитишь, статья так и останется недописанной, пару идей, которую он вынашивал лет двадцать, так и не сформулировав, жаль безумно, но все равно их никто без него не поймет. Думать о родителях было тяжело - так к ним и не доехал, не попрощался. Думать о друзьях, о квартире, о разных разностях и мелочах не получалось - не думалось, не интересно, ни к чему.  Кошка, правда, вспоминалась с теплотой и грустью, она, небось, понимает, что с хозяином приключилось. Думать о Ней он себе запретил еще в больнице. Это было выше сил, даже в неподвижности комы. Как только она пыталась пробиться к нему – дотронуться рукой, вглядеться в зрачки, покрыть его лицо своими волосами, он мысленно вонзал зубы себе в язык, почти протыкал его и судорожно начинал двигать шахматные фигуры по потолку, пытаясь решить нерешенную никем задачу. Запрет действовал и здесь. Несколько раз её лицо пыталось сфокусироваться над ним, он зажимал язык зубами, готовый впиться в него, и образ тут же рассыпался на осколки, растворяясь в завихрениях полета. Несколько раз в полете по телу пробегала судорога. Внезапно волна дрожи вскипала в ногах, перекатывалась по позвоночнику и в мгновение докатившись до головы, трясла её и крутила. Все его знания о физике жизни и смерти разбивались этими приступами. С телом покойника так не может происходить! Не должно! Никак! Он опять вывернул шею в попытке посмотреть вперед, – Куда летим? Долго ли еще? Или всё что теперь предстоит – это вечный полет пузом вверх? Пятно света впереди внезапно быстро увеличилось, бросилось ему навстречу и конец полёта, наконец, стал ощущаем. На срезе туннеля неведомая сила его затормозила. Широкоплечий мужчина приличного роста с белоснежной кудрявой шевелюрой и кучерявой белой же бородой, в синем халате с белым крестом на спине, с большим сачком в руках и дымящей сигарой в зубах, приглашающим жестом велел приземляться. Само собою туловище летевшего приняло вертикальное положение и мягко спустилось прямо у выхода из туннеля. - С прибытием, Сергей! – дружески произнес белобородый, выпуская изо рта толстые колечки белесого дыма. - Надеюсь, полёт прошёл хорошо и вы всем довольны! Сергей облизал губы и вытер ладонью испарину на лысине. - И куда меня занесло? Далековато, однако, до вас добираться. Я думал, вы где-то под боком, за поворотом, а вы черте где. - Да, дорогой мой, этот главный в жизни путь не может быть коротким. Вам дается время, что бы успокоиться, привыкнуть, осознать, всё вспомнить, что-то забыть. Это быстро не делается! Некоторым приходится лететь дважды. Однажды мы клиента прокрутили в трубе три раза, так он нервничал. Сейчас заполним анкету и вы расскажете мне, что было, что ушло, что ещё помните. Сергей огляделся.  Прямо за туннельными воротами на большом чуть ржавом щите при выходе чернели три стрелки - прямо была указана дорога в Рай, налево в Ад и стрелка направо направляла почему-то в Израиль. Снизу красным фломастером довольно небрежно была подрисована стрелка в обратном направлении и корявыми буквами выведено - «Санкт-Ленинград». Под информационным щитом стоял прямо на земле круглый пластмассовый стол, такой голубой, что в нем отражались облака над ним. За столом - старая садовая скамья и черный венский стул, очень изящный. Мусорный контейнер, стоявший в стороне, был переполнен ватой и бинтами. Сергей размотал поддерживавший челюсть бинт и отправил его в общую кучу. Рядом с контейнером из ячеек винного ящика торчали несколько полувыпитых бутылок коньяка и «Столичной». Коньяком даже немного пахло. На столе шелестела на ветру довольно толстая стопка бумаг, придавленная сверху пепельницей со множеством тлеющих сигарных окурков.  На листках в стопке что-то было написано готическим шрифтом и римскими цифрами. По структуре бесконечного текста это было похоже на какую-то то ли Памятку, то ли Анкету, со многими разделами, пунктами, вопросами, таблицами и графиками. Ну! Я кой-чего смогу повспоминать, конечно, - спокойно сказал Сергей и удивился своему спокойствию, - но ничего особенного. Если я правильно помню соответствующие рассказы попов, то мне напоследок должны были всю мою жизнь показать? Я собирался кой-чего получше рассмотреть и понять, кой в чём разобраться, но ничего в туннеле не показывали. Вообще ничего. Это накладка или теперь всех так встречают? Бородатый встречающий накинул на сидение стула бумажное полотенце, сидение и спинка были сильно обгажены птицами, и жестом позвал Сергея сесть. Тот присел на самый краешек. Джинсы были единственными, их стоило поберечь. На всякий. - И почему кроме вас тут никого нет? – продолжил Сергей тихо и нудно. - Где Леги? - вспомнились ему из мифологий почему-то именно они. - Не туда я прилетел или чего-то не вижу? Что-то у вас испортилось? Вы не готовы меня принять? Могу и подождать. А сколько ж я летел? Сейчас который час? Бородач с интересом разглядывал прибывшего. - Да вы не беспокойтесь, - почти весело ответил он. - Всё тут работает надёжно. Тут поломок не было два тысячелетия с лишком. И ещё лет сто не ожидается. Леги сюда не вхожи. Говорите, не показали ваше прошлое? Поздравляю! Значит всё в порядке - уже особо нечего показывать. Нормально у вас память самоочищается. Так и надо. От лишнего груза избавляетесь ещё в пути. Признак, кстати, хорошего интеллекта. А который сейчас час не скажу. Не знаю. На этом конце тоннеля, в отличие от того, времени нет. Но если считать по-вашему, то добирались вы до нас сорок дней, как раз на выходе из тоннеля должно быть ровно сорок. - Дней! - подскочил Сергей, - Вы шутите? Ещё минут, куда ни шло, даже часа, думаю, не прошло. Но все равно - долго. Но чтоб дней! А сачок у вас зачем? Души ловите? - Да, угадали. Иногда тормоза у прибывающих отказывают, иногда засыпают от усталости, иногда хулиганы, особенно нетрезвые, или фа"}, {"title": "ТАНГО  ", "date": "24 декабря 2021", "categories": "Рассказы", "file": "post/020.html", "text": "(покадровая запись фрагмента фильма) - Хороший осветитель из Господа получился бы -  заметил я, выключая накамерный светильник. Солнце садилось в море прямо за каналом, отражаясь в нем, и двойной источник закатных лучей пронзал комнату вибрирующими золотыми потоками. Майя в этих обволакивающих, переплетающихся световых лентах выглядела офигенно. Камерный свет только бы помешал. Она загасила очередную сигарету, вдавив окурок в сияющую яхонтовую пепельницу, тонкая струйка дыма обвила  ее прозрачное ухо и втянулась в общую ауру вокруг головы. Потянулась серебряной десертной вилкой к черничному торту в центре стола и подцепила довольно большой кусок. - Очень вкусно - сказала она, вылизывая языком крупные чёрные ягоды, утопленные в сметанном креме, - о чем будем говорить дальше? - Как хочешь - сказала Таня - можно о любви, можно о деньгах, можно о Танго. - Ну их, деньги - отмахнулась Майя - давай о Танго. Таня посмотрела на меня - Камеру включил? - Не выключал. Таня подлила Кьянти Майе в бокал - Ты такая умница, знаток искусств и языков, энциклопедистка, преподаватель Философии. Почему Танго?  Зачем тебе Танго?  Ты много танцуешь? - Танго это очень сложный танец, это самый сложный танец пары. Как раз здесь в Германии многие интеллектуалы – академики, профессора, ученые, знающие и понимающие люди, увлечены Танго. Без этого они не могут. Это их жизнь, их способ существования, их возможность выживания. - Когда человек начинает серьезно заниматься танго это очень сильно изменяет его жизнь, его физическую жизнь, телесную, музыкальную. Такой интенсивной нагрузки на весь мой организм я в других занятиях не нашла. Это такая наркомания, без которой многие не могут выдержать жизнь обычную, будничную, каждодневную. Знаю даже людей, которые считают, что их семьи, их  профессии, их обязанности и обязательства – не самое важное. Самое важное – Танго. И у меня были такие истеричные времена, когда я каждый вечер спасалась танцем. Иначе бы покончила с собой. Я и Таня тоже потянулись за рюмками. - Но это же не настоящая жизнь! В этом же невозможно остаться! Вино было изумительным. - Да, это не настоящая жизнь, всего лишь иллюзия, искусственный мир. - Настоящая жизнь расслоена на отдельные процессы, каждый из которых занимает своё время. А Танго все так сублимирует, так концентрирует, так насыщает… - Когда ты танцуешь, ты забываешь обо всем, от всего освобождаешься, от всех горечей, бед, неудач, болей. Когда ты танцуешь, ты пуст, ты свободен. Только ты и музыка. Даже партнёр не важен. Конечно, хороший партнёр, не мешающий. - Танго помогает мне всё перетерпеть, со всем смириться, всё простить. Я не могу долго не танцевать. Раньше я танцевала каждый вечер и думала - скорей бы вечер. Я без этого не могла. Да и сейчас не могу. По каналу прошёл большой парусник и тени от голых ещё его мачт медленно проплыли по ее лицу. Она опять потянулась за сигаретой, я попросил закурить, но не затягиваться, долго держа сигарету в руке. Белый цилиндрик перекатывался в ее прозрачных пальцах, струйка белого дыма обвивала запястье, поднималась по руке, вилась у подбородка, у губ, у кончика носа.., а я панорамировал. Таня принесла ещё бутылку  вина. - Тебе не важен партнёр? В твоём танце нет секса? Ты не влюблена в человека, который тебя обнимает? Майя наконец затянулась, стряхнула пепел в яхонтовую пепельницу, обхватила самый верх бокала с сияющим под последним солнечным лучом гранатового цвета вином, провела пальцем по самому краю бокала, при этом стекло запело тонко-тонко, почти застонало. - Я все время в танце чувствую руку и бедро отца. Кто бы меня не вёл. Если я не разговариваю с партнером, я мы почти всегда в танце молчим, я забываю, с кем я. Вернее, я не знаю, мне не важно, кто меня ведёт, кто поворачивает, чья рука на талии.  Это всегда отец.  Хотя я с ним никогда не танцевала. Со мной всегда мужчина, которому я полностью доверяю, которого слышу и слушаюсь, во власти которого нахожусь. Я не думаю о партнере. Даже если танцую с любимым. Я довольно часто иду в клуб или на площадку одна и нахожу партнера там. На один вечер или даже на один танец. Конечно, это друзья, хотя бывают и незнакомцы. - да, это не жизнь. - Или  жизнь… За балконом быстро темнело. С моря потянуло холодком, Таня принесла Майе шаль. Я понял о чем и как мы снимем финал. Это будет трудный разговор. Я попросил Таню ещё налить. - Прости, Майя, можешь не отвечать, если не захочешь - Почему ты не отвечаешь на чувство Жереми? Почему ты его, прости, не любишь. Я не знаю более подходящей тебе пары. Это один из самых умных, красивых, выдающихся людей, которых я знаю. «Лучший студент Бенелюкса» - я и не представлял, что есть такой титул. И он безмерно тебя любит. Уже который год. По-че-му? Майя повертела на пальце кольцо, которое мы подарили ей перед началом интервью и которое ей очень понравилось. Сняла его, снова надела. Хлебнула кьянти, обалденно красивым жестом взъерошила волосы. - Вы хотите об этом говорить ? - Мы хотим говорить о тебе. - Он не танцует, не может, он не умеет танцевать танго… Мы снимали ещё полтора часа. Потом вышли на балкон. Ночной Гамбург шелестел человеческими жизнями, гудел портом и верфями, тихим ветром с моря, жужжанием поездов метро над каналом. Издали со стороны города вдруг донестись звуки танго. Это было Кумпарсито. - Хочу туда, сказала Майя. Гамбург, 2005"}, {"title": "ЖИЗНЬ ЕВРЕЙСКАЯ               ", "date": "16 февраля 2022", "categories": "Рассказы", "file": "post/021.html", "text": "На выходе из электрички какой-то выходящий следом белобрысый шибздик рванул у неё с плеча гитару. Она инстинктивно за инструмент ухватилась, рука зацепилась за верхний порожек, струны впились ей в пальцы, резанули по коже и взорвались, ударив нападавшего стальными обрывками проволоки по лицу. Гитара с оглушительным звоном упала на платформу и, скользнув в щель между вагонами, скатилась прямо под поезд. Белобрысый, с хлещущей из глаз кровью, бросился бежать, оставляя за собой пунктир красных на снегу пятен. Состав дернулся и медленно тронулся, переламывая колёсами остатки ее музыки. Марина, ещё не веря в произошедшее, дождалась последнего вагона, надеясь на чудо. Желтый труп гитары, раздавленной и разорванной, ещё дрожал там внизу и казалось тихий-тихий стон тянулся к Марине, обвивал ее, умолял спуститься, собрать останки. Она не стала спускаться. Две испуганные женщины встретили ее на углу - Где же вы? Давно пора начинать, публика расходится. Марина только развела руками Зал был полон. Стояли и сидели в проходах. Было довольно прохладно, многие сидели в шапках и платках, кутались в стеганки и ватники. Жидкие аплодисменты и недовольный гул вызвало ее появление на сцене. - Здравствуйте, простите, меня ограбили у вас на станции. Разбили гитару, мне не с чем для вас петь. Может, есть в зале инструмент? Несколько гитар поплыли к ней на сцену над головами собравшихся. Она попробовала их, одну за другой, не годилась ни одна. Весь концерт она читала свои стихи, иногда напевала их. Успех был средненький, но с ней рассчитались, даже обратно до Москвы довезли на заводском Рафике. Заработанного ей с дочкой хватало на полмесяца. Она зашла к матери на Плющиху, забрала дочь, матери нездоровилось, она лежала, было не до внучки. По дороге зашли в Смоленский гастроном. Знакомая продавщица, большая любительница ее песен, махнула рукой в сторону подсобки, вынесла что-то, тщательно завёрнутое в промасленную газету, и, оглянувшись, сунула пакет ей в руки. Запах от газеты шел плотный и уже подзабытый. Явно там был говяжий язык, выпирала довольно большая палка колбасы, небось, венгерская салями, и, кажется, большущий кусок копчённого морского окуня. Марина аж слюну почувствовала во рту. Давненько ее кухню такие деликатесы не посещали. Снующие мимо пустых прилавков посетители магазина что-то учуяли и заводили туда-сюда носами. Продавщица забеспокоилась, подтолкнула Марину к выходу. - Загляни в понедельник, помадки будут. С тебя пять двадцать, потом отдашь. В троллейбусе все обернулись на запах. - Где уворовали? - наклонился к ним плохо выбритый мужик - Поделитесь с трудящимся. Марина подхватила дочку и весело выпрыгнула из уже тронувшегося троллейбуса. Весь салон проводил ее взглядами. Пошли домой пешком, подгоняемые острым запахом и бурчанием возбужденного желудка. Утром ей позвонили из издательства - рукопись не прошла цензуру, есть претензии, надо заехать в комитет, в комнату 32, там ей объяснят, что нужно исправить. И надо сменить фамилию. У вас же есть нормальная - материнская. Уговорив соседку, вернее, отрезав ей большой ломоть окуня, Марина оставила на ее попечение дочь и поехала на Старую площадь в Комитет, предварительно, конечно созвонившись с куратором. Пропуска, однако, не было; пришлось по внутреннему телефону звонить секретарю. - Ольга Федоровна, это Марина Тоболь беспокоит, меня вызывал Андрей Палыч, но пропуска внизу нет. - Мариночка, здравствуй дорогая, он занят, просил тебе передать, что все замечания передал в издательство -, и понизив голос почти до шёпота – Там, что-то твой папа бузит, поговори с ним. Нехорошо стало у Марины на душе. Папа в ее жизни присутствовал только фамилией, виделась она с ним крайне редко, всегда случайно – на каком-либо литературном мероприятии, пару раз в метро, да однажды, тоже совершенно случайно, в гостях у Маршака. Он всегда был с ней немногословен, неулыбчив, очень посторонний. Всячески эту «посторонность» подчеркивающий. Номер своего телефона, правда, каждый раз ей оставлял, с предложением, «звонить, если что». Но сам не звонил ни разу, даже, когда родилась внучка. О Марининых песнях и публикациях он никогда слова из себя не выдавил, чего вдруг «бузить» стал, было непонятно и тревожно. Мама умерла утром. Неделю Марине было ни до чего. Она и к телефону не подходила. На похороны пошли самые близкие. И две любимые мамины собаки. Марина взяла на кладбище дочь, хоть её все отговаривали. Но она по себе знала, как во взрослой жизни необходима память о похоронах детства. Чувство корней только такой памятью и питается.  Дочка жалась к ее ногам, не отрывая широко раскрытых глаз от гроба. А когда тот стал проваливаться в песчаную яму, глаза закрыла и оцепенела. Отец не пришел и не звонил. Старейшего редактора детского радио знала половина литературной Москвы. На девятый день в подвале Марининых друзей в Столешниковом собралось много народу. Вспоминали покойницу шумно и весело. Много пили. К Марине подсела машинистка издательства. Сказала, что набор ее «Сказок» разобрали по приказу главного и из планов типографии книгу вычеркнули. Сказала, что пару контрольных отпечатков стащил Прохор и просил ей об этом сказать. Еще через неделю позвонила междугородняя, соединили с Краковом. Связь была ужасной, Марина только поняла, что переводчик ее книги спрашивает - Почему московская редакция отозвала договор? Петля затягивалась. Она решила позвонить отцу. Тот снял трубку и сразу, услышав ее голос, повесил. Больше не снимал. Лето выдалось голодным. Ее не печатали, не звали на радио. Отменилась пара планировавшихся концертов. Несколько рассказов под фамилией подруги ей пристроили в «Костер», но там гонорары были мизерными. Спасали друзья, подкармливали.  Немного она подрабатывала машинисткой, печатала и правила чужие рукописи, пару песен для мультфильма удалось продать, там авторством не особо интересовались. Как-то с дочерью выкручивались. Наконец, после бесконечных ее писем и звонков, ее принял большой начальник. - Марина Моисеевна, - сказал он ей. - Вы сами виноваты в своих несчастиях. Вам неоднократно предлагалось взять псевдоним или использовать фамилию матери. Наш прекрасный драматург Моисей Наумович категорически против использования его фамилии для самодеятельных песенок и сказочек. Он обратился к нам с таким совершенно справедливым требованием. Кроме того у методистов есть претензии к качеству ваших текстов. Не могут сказки для советских детей называться «Грустный еж» или «Гусиные слезы». Все у вас слишком мрачно и плаксиво. Мы согласны с вашим отцом, что ваши песни и рассказы не могут больше распространяться государственными изданиями. Вам еще многому нужно научиться, многое понять. Мы сочувствуем вашему горю, но разрешить ваши дальнейшие публикации я не могу. Если хотите, мы можем найти вам редакторскую работу. Ее взяли редактором в телевизионный отдел Союзрекламфильма. Работа была чудовищной. Она сидела в маленькой холодной каморке, перебирала глупейшие сценарии, представленные заказчиками и уже, как правило, «оплаченные». Править их было нельзя, да и править там было нечего, только выкидывать, ставила свою подпись – «просмотрено», и отдавала галиматью в производство. Дома после работы долго сидела на табуретке под душем и терла глаза. Ни одного стиха или песни ее душа и мозги сочинить уже не могли. Она только занималась дочерью, варила простенькую еду, спала и ходила в контору.  Так прошел год. Её надо было спасать. Друзья пристроили ее Завлитом в Кукольный театр Дома Архитекторов. Ей сразу понравились и обязанности, и коллектив. Платили немного, но и график был свободным, и часть работы она могла делать дома, который, кстати, был рядом. Да и какая это «работа», чистое удовольствие! Вся труппа собиралась три раза в неделю и занималась «фонтанированием» идей. Начальство Союза, в этот раз архитектурного, велело театру подготовить спектакль к грядущему юбилею Комсомола. Денег дало, велело творить свободно, в темах и приемах не ограничиваясь. Это всех взбодрило. Призвали в театр и нового режиссера, который казался малым талантливым и пред"}, {"title": "К собственному юбилею", "date": "27 декабря 2021", "categories": "Без категории", "file": "post/022.html", "text": "Инструкция к неизбежным поздравлениям меня с неизбежным. Кому-то в моих окрестностях стукнет скоро 80. Оглядываюсь, правда, не могу понять кому. Солидная цифра,  фанфаристая. Не то, что сморщенные 70 или нелепые 60. Ожидаемо,  что восьмидесятилетняя рухлядь должна  выползти вам навстречу в фуфайке, в шароварах и шлёпанцах на босу ногу. На носу у него, надеюсь, будут блестеть непременные плюс восемь, затерявшиеся тринадцать непонятного цвета волос аккуратно будут зачесаны за уши, а строевой шаг, понятное дело,  расслышать будет трудно. Приступим! Прежде всего о звуке. Юбиляра надо поздравлять тихо. Лучше под Шопена. Допускается Вивальди, но замедленный. Из инструментов близко подпускать лучше всего домру, хорошо бы без струн, там сам корпус хорошо потрескивает. Ни в коем случае не сопровождайте поздравления скрипкой. Ещё усыпите юбиляра и он челюсти выронит и на этом розовом поскользнётся. Аккордеон тоже опасен, слишком обдувает. А уж про медь и говорить нечего. Это к другим. Лучше всего издали  посвистеть. Но не громко. Вдруг услышит. Теперь об освещении. Прямые лучи - плохой вариант. Надо б, что бы светилось за углом и шевелилось. Такой осенний листопад, пузырящееся Пепси или вечерний Куинджи. Сильный контровой ни в коем случае, да и спереди поменьше. Такой слабенький скользящий, лучше желтенький. И свечек не надо, рано. Теперь про текст. Поздравительные слова к такому радостному случаю нужно подбирать только с одним ограниче
