нием - чтоб коротко. Три слова - уже перебор. Можно и одной буквой ограничиться - «О!»  и палец поднять. Юбиляр не успеет ослабеть. Про подарки. Тут переговорите с родственниками - что им нужно? Про танцы я ещё не решил. Определюсь ближе к дате. Но, конечно , надо быть очень больным человеком, чтобы всерьез таким поздравлениям радоваться. Поскольку поздравлять тут совершенно не с чем, никакой это не сюрприз, не подарок судьбы, не заслуженная награда. И обижаться уже поздно. «Полежи в сторонке», сказано было уже лет десять назад, «не твоё стариковское дело» - лет двадцать, «спасибо - мы и сами» - все тридцать. Привык, смирился, махнул рукой. Понятное дело - слушают теперь тебя из вежливости, дорогу уступают из жалости, не хамят из лени. Ну, а инструкцию я готовлю заранее, чтоб не забыть по прибытии."}, {"title": "Старая ПТС", "date": "25 декабря 2021", "categories": "Телевидение", "file": "post/023.html", "text": "Весной или летом 1958-го, или 59-го, проходил я, или проезжал, мимо «городского», до переименования, драмтеатра, или театра «Комиссаржевской» после переименования, что на верхних этажах Пассажа, и впервые увидел у входа телевизионный автобус Ленинградского телевидения. Передняя раздвижная дверь была приоткрыта и в совершенной черноте внутренностей светились четыре или пять маленьких огоньков - зелёные, синий и красный. И это волшебное для бесцветного детства разноцветье решило мою судьбу. Года через полтора я уже сидел перед этими лампочками напрямую. Первые передвижные телевизионные станции были устроены просто.  В кузове переделанного автобуса ЗИСа было три отделения - ближе к водителю «режиссерский» отсек с монтажным пультом и жестким диваном для двух-трех «творцов». За ним «технический» с тремя камерными каналами, контрольными осциллографами и коммутационной доской, к которой подключались камерные кабели. В багажном отделении - огромные барабаны с кабелями. С такого «колеса» разматывалось примерно 150 метров толстенного кабеля в чёрной резиновой оплётке, при необходимости кабель наращивался до 300, а иногда и больше, метров. На таком расстояние от автобуса можно было расположить «точку съёмки». Сам не помню, но говорили, что глава Первой ПТС Лёня Лейтус умудрился однажды нарастить кабель до километра, что было чуть ли не мировым рекордом. Естественно, это требовало специальных усилителей, которые сами же пэтээсные «Кулибины» изобретали и тут же «на коленочках» паяли. Камеры, штативы, тележки и прочая необходимость хранились и перевозились в автобусе вспомогательном.  В ящиках его комодов можно было отыскать всё -электронные лампы, сопротивления, конденсаторы, припои, отвертки и плоскогубцы, разводные ключи на все возможные гайки, все существовавшие на свете гвозди и шурупы, какие-то проводки и контакты, изоляционные ленты, зачитанные до дыр книжки и стаканы разной вместимости. Кстати, уместно вспомнить, что моя телевизионная карьера началась вполне символически. Впервые входя во вспомогательный автобус в должности радиомеханика, это в ноябре 1960 года, я поскользнулся на его ступеньках и ухватился за какой-то кабель, который в свою очередь смахнул на железный пол только что полученный полугодовой запас передающих трубок. Огромную тогда ценность. Вдребезги. Уже за одно за это меня должны были немедленно уволить, но такого хохота стены птс-ного бокса, думаю, больше никогда не слышали. На пару месяцев, пока не пришла новая партия иконоскопов, я коллектив своей 4-й ПТС «отпуском» обеспечил и тем сразу в него, в коллектив, «влился». Тем более, что во вспомогательном автобусе были лавки и столы для отдыха, перекуса и прочих приятных мероприятий. Сколько ж я там наотмечал, наговорил, нафантазировал. На первых послевоенных ПТС между кабиной водителя и режиссёрским отсеком была внутренняя дверь, что позволяло при необходимости размещать на водительском месте звукорежиссера с ручным звуковым пультом или дополнительного редактора со сценарием на коленях, или бдящее начальство, перед которым прямо на руль ставился маленький монитор. Творцы могли запросто переругиваться через дверной проём, что при отсутствии какой-либо служебной связи давало определенные преимущества старым машинам.  В перегородке, отделявшей водительскую кабину, было встроено четыре малюсеньких монитора - 3 камерных и один, побольше, «эфирный». Что б разглядеть содержание кадра, приходилось подходить к мониторам вплотную.  Красная лампочка зажигалась как раз над эфирным монитором, зелёные над тремя другими. Когда на режиссёрском пульте – небольшой железной коробочке с четырьмя кнопками и ручкой микшера, выбирался микшерный режим, загоралась синяя лампочка. Это значило, что переход с одной камеры на другую можно было осуществить постепенным смешиванием картинок. Процесс осуществлялся движением металлической ручки, весьма похожей на «кастет». «Микшер» - это единственный монтажный эффект, доступный тогда «творцам». Выбор был невелик, или переходить с кадра на кадр резко, кнопкой, что требовало от режиссуры каких-никаких знаний и пониманий - момент перехода, сочетание кадров, ритм, согласование внутрикадрового движения и прочие премудрости, или плавно вытеснять одно изображение другим, особенно логикой и точностью монтажа не утруждаясь.  Я до сих пор отношусь к «наплывам» вполне презрительно и в своей практике пользовался этим приемом редко и крепко подумав. Но что-то я отвлёкся. Совсем не об этом мои воспоминания. Выезжала ПТС на площадку задолго до съёмок. На стадион Кирова, к примеру, за неделю до футбола. Подключались к местной сети, разматывали кабели, разносили по местам камеры, наводили передающие антенны на телебашню. Несколько дней «гоняли» аппаратуру вхолостую, находя всё новые и новые ее погрешности. Тут же разбирали, паяли, настраивали. Инженеры на ПТС были, как сейчас говорится, умельцами «80-го уровня». Морщили лбы и решали любые задачи. Из «ничего» создавая «нечто». И это при абсолютной технической «нищете» тогдашнего телевидения. Камер, кто помнит - тот знает, было три. И одна резервная. В мои начальные годы это были КТ- 5 венгерского производства. Чуть позже появились советские аналоги – «Шестёрки». Они были посерее, поуродливее, но сильно надежнее. Несколько раз на моей памяти операторы «роняли» работающие камеры или по причине ветра, или от плохого самочувствия операторского организма, или от сочетания обстоятельств. Венгерские отрубались сразу, наши продолжали работать даже опрокинувшись в лужу. Весила камера в разобранном виде, без видоискателя и объективов, килограмм под пятьдесят. Ещё около того весили штатив и площадка. Техники таскали этот груз как правило вдвоём и в несколько ходок. Но была в команде 2-й или 3-й ПТС техник-дама, так утверждает легенда, которая поднимала и переносила камеру со штативом и площадкой одна и за один раз. Это под 150 кг общего веса. Я, правда, это чудо не застал. В редких и важных случаях две ПТС состыковывались и главная – «Ведущая» получала от «ведомой» дополнительные три картинки. Чуть позже «пристёгивать» стали и красавицу передвижку «Юность» с ее двумя камерами, рассчитанными на съемку с движения. Впрочем, годилась эта «связка» лишь для парадов на Дворцовой.  Иногда прямо во время съёмок камеры перетаскивались на новые площадки, увеличивая наши постановочные возможности. Но, как правило, все шестидесятые и начало семидесятых мы могли рассчитывать стандартно на три, максимум на шесть камер и этим должны были удовлетворяться. Когда сильно позже я в Лас-Вегасе на Всемирной телевизионной выставке увидел передвижную станцию с 16 (!) кабельными камерами, оцепенел надолго. Сколько ж внутри того автобуса было разноцветных огоньков!"}, {"title": "Александр Фукс", "date": "24 декабря 2021", "categories": "Телевидение", "file": "post/024.html", "text": "Программу «Лестница Якоба» начальство принимало раз пять, каждый раз вырезая из эфирного варианта все новые номера. Я пытался, конечно, возражать, взывая  к начальственному благоразумию, на дворе был 87-й, почти рассвет гласности и толерантности. Но с Владимиром Поповым, при всех моих к нему симпатиях и уважениях, спорить было невозможно. И отправлялись на отдельную кассету «вырезанные» один за другим «Бангкок» Моисеева, хиты «Европы», песни Андерсена, какие-то пугачевские номера, всего уже и не помню. Но когда было велено убрать «странного» Кузьмина, я решился на хитрость и половину его номера закрыл кадрами с «танцующим» рядом с ним оператором. Это был Фукс, «Чемпион мира» по операторскому преследованию объекта съемки. Уловка не сработала, так номер и остался только в моем архиве. Но то что Фукс выделывал с камерой достойно и особого удивления и восхищения. Знаю, что при съемках за рубежом, в которых он участвовал, публика приходила специально поглазеть на русского оператора, который в процессе съёмки выделывал совершенно немыслимые для его профессии па, пробежки и прыжки. В Финляндии, где мы с ним снимали заказной фильм, руководство «Сони» попросило Фуксал «потанцевать» с их новой камерой для рекламного клипа. Снимала клип английская группа и я видел, как «отвисала челюсть»  у её  звездных операторов, когда Саша  осуществлял свой коронный трюк - и «облетал» объект по диагонали без всяких кранов, стабилизаторов и поддерживающих ассистентов. При всём при том он и свет ставил «не хилый» - одно «Что, где, когда» чего стоит,  и кадр умел придумать и парень был зажигательной красоты. Много у меня было с ним разного. И ругались бывало. И обижались. Но его нелепая смерть, помню, меня оглушила надолго. За много лет до его смерти возвращались  мы из уже упомянутой Финляндии на «жигулях»,  купленной им там на свалке за бесценок. Всю дорогу гнал, скучал по семье. Меня за руль не пускал. Побаивался. Километров за 200 до Москвы  на скорости больше сотни уснул. Я увидел это совершенно случайно и перехватил руль. Хорошо, именно в этот момент трасса была пустой, нас развернула на встречку, выбросило в кювет и перевернуло. Долго сидели у костра, ожидая аварийку. Одного боюсь, сказал Саша, разбиться на мотоцикле. Когда узнал о его гибели позвонил Лене, его жене, спросил - был на мотоцикле? Да."}, {"title": "Борюсик", "date": "24 декабря 2021", "categories": "Рассказы", "file": "post/025.html", "text": "С все возрастающим чувством вины. Посвящается Борису Шпаро Он очень любил Книги. Он, думаю, любил только Книги и немножко себя. Его знали все книжные магазины Москвы, букинисты, коллекционеры и никто не ценил и не уважал.  Сам по себе он ничего из себя не представлял - маленький скрюченный еврей, озлобленный, неразговорчивый, занудный до предела. Ему всегда не везло, он это знал за собой и потому всегда держался с краю, ни во что не ввязываясь, никому и ничему не веря. Впрочем, что у него внутри, думаю, ни одну Душу на свете не волновало. Я его знал последние лет пятнадцать, никогда не видел, что б кто-нибудь с ним серьезно и о серьезном говорил. Всегда в его сторону  бросались ироничные, снисходительные реплики из двух-трёх слов, не больше. Его подкармливали, подпаивали, но говорить - о чем?  Борюсик большего не заслуживал БОРЮСИК Он жил только Книгами. Книги были целью его существования на земле. Он все про них знал и говорить мог только о них.  Правда, говорить он умел плохо и его энциклопедические знания  о предмете его любви практически никто не выслушивал. И я тоже. Библиофилия сделала его несчастным очень давно, ещё в несокрушимые советские времена, когда Книга была ещё тем предметом роскоши. Все его бухгалтерские заработки и подработки уходили букинистам и спекулянтам. Семья - мать, жены, дети, его за это ненавидела и методично сживала со света. Мать пыталась запереть в сумасшедшем доме, жены и дети поочередно -  лишить жилья и каких-либо прав.  И это у них всегда получалось. При каждой очередной семейной катастрофе все нажитые до того коллекции погибали. Он опускался по социальной лестнице на ступеньки ниже и вновь с нуля начинал свой каторжный труд. Каждый день, каждую копейку, каждое усилие он посвящал книгам.  Жил где придётся, иногда сторожем в сараях и гаражах, иногда в подъездах, иногда из жалости его пускали в заколоченные на зиму дачи. Наступили счастливые времена - библиотеки выбрасывались на помойки, магазины ломились от копеечных изданий, на уличных развалах можно было найти экземпляры, о которых в Союзе он и мечтать не мог. Коллекция быстро росла, насчитывала  уже тысячи названий. Были там совершенные раритеты. Хранил он своё богатство в мешках и чемоданах по чердакам и подвалам «друзей». И многие годы пытался из страны уехать, что бы обрести для своей библиотеки Дом. Например, к евреям в ФРГ. Моим словам, что это глупейшая затея и ему в ФРГ просто не выжить, не верил, обижался на меня, меня избегал. Эмигрировать было трудно, но никакого другого варианта у него в Москве не было. Он был обречён нищенствовать и бомжевать. И мечтал об отъезде. Наконец его документы в посольстве признали и дали добро на эмиграцию. В день когда ему об этом сообщили  сгорела дача знакомого, на чердаке которой он хранил треть своей коллекции.  Самую ценную треть. Он поехал на пепелище и вернулся неузнаваемым. От этого удара  уже никогда не оправился. Больше я не видел на его лице даже подобия улыбки. Никогда. В Неметчину Борюсик ехал автобусом, вёз первую порцию книг. Два мешка по тридцать килограмм. В назначенное время в определенном мною месте он не появился. Я прождал день-другой, пошёл искать. Нашёл в негритянском боксе в пересылке. Борюсик сидел в центре казармы, измученный, растрёпанный, обнимая руками мешки с книгами. Чёрные ребятишки играли вокруг него его книгами в футбол. Несколько переплётов валялись разорванными. Как он там вообще выжил, не представляю. Ни слова ни на каком языке, от мешков отойти боялся даже в туалет. Крепился из последних сил.  В это чёрное гетто даже охранники заходить боялись. Там с белыми не церемонились. Борюсик просидел там больше суток. Социал определил Борюсика в маленький городок Раштат под Карлсруэ в четырехместную камеру карантина.  Сокамерники быстро менялись, мало кто выдерживал тюремную жизнь больше недели. Борюсику некуда было деть  книги, занимавшие половину комнаты, поэтому он упрямо держался за пересылку и прожил там еще полгода.  Утром входил уборщик и орал - Raus, пошёл вон русский. Через полгода социал позволил ему искать себе  жильё. Его тут же обманули \"свои\", подсунули  никому не нужную «студию» прямо во дворе пересылки. Ужасная комната с туалетом,  облезшая, холодная и сырая. Но было куда складывать коллекцию! И раз в месяц он начал автобусом ездить в Москву, забирать книги. Вёз их через границу, всюду отдавая последние гроши таможенникам. Особенно польским. За два года книги заняли две-трети его жилья. Подобрал на шпермюлях выброшенные книжные полки. Расставил фолианты. Я ему пару настольных ламп подарил. Даже какой-то уют появился. Я редко к нему заезжал, ужасаясь его невезучести, неумению «жить», талантом фокусировать на себе все возможные неприятности и беды. Но впервые за многие годы мы поговорили и я поразился его эрудиции. Связывались мы односторонне - он звонил, когда была нужна помощь, и если я был в Германии, то ехал к нему «на край света». Это было нечасто. В тот день он ушёл от дома довольно далеко, зайдя в район Баден-Бадена, где его вообще никто не знал. Почувствовал удар в голове, упал и лежал с открытыми глазами, пока прохожие вызывали  скорую и полицию. Никаких документов при нем не было, пока его везли он неразборчиво повторял одно слово, буква «ж» в котором позволило определить, что он русский. Вызвали переводчика.  Единственным словом, как оказалось, было слово «книжки». Это зафиксировано в протоколе. К вечеру он умер. Искать его было некому, исчезновение никто не заметил и никаких запросов никто никуда не направлял. Через положенное время неопознанным трупом он и отправился в печь крематория. Квартиру вскрыли через пару месяцев в связи с неоплатой коммунальных платежей. Определились с пропавшим владельцем и выяснили, что за труп  значился «неопознанным». Никаких знакомых и родных за покойником не числилось. Квартиру продезинфицировали и закрыли. Мебели почти не было. Бумажную макулатуру свалили в мешки и самосвалом вывезли на переработку. Я обо всем узнал примерно через полгода, когда бросился искать Борюсика. Никаких следов не обнаружил. Ни его, ни книг. В полиции нашёл протокол осмотра тела и описание самого происшествия. ( от Виктора Богдановича в переписке по поводу смерти Бориса Шпаро) ... А ещё он любил играть в шахматы, средне. Очень любил джаз. Дружил с известным американским джазовым трубачом. Когда у того вышла здесь книга, лет 5 назад, он  скупил десяток экземпляров и дожидался его приезда, вручить. Не дождался.  У меня остался его старенький кофр с некоторыми документами и фото матери, вырезки про еврейство и диссидентство, невнятный блокнот. Пытался по разным телефонам найти его дочь - бесполезно. Ни от нее, ни от сына ни у кого звонков не было. Так и живут по сей день, ничего о нём не зная. Никому он был не нужен.  Только мы его, собираясь в бане, регулярно вспоминаем... Раштатт, 2010"}, {"title": "Жизнь собачья", "date": "24 декабря 2021", "categories": "Рассказы", "file": "post/026.html", "text": "Люди не относились к любимым им существам.  Он их плохо понимал, не нравились ему их нелепый вид, запахи, громкие звуки им присущие. Запоминал их плохо, с трудом различал, кто есть кто; частенько не мог определить пол особи, к нему подошедшей или его позвавшей, ее возраст, степень знакомства или даже  родства с ним; смысл с ней, с особью, общения, - чего смотришь? Совершенно не запоминал он их имён, мест встреч, обещаний и обязательств  и уж совсем путался в смыслах совместного с ними сосуществования.  С одной стороны, есть, конечно, хочется, а с другой - нафиг вы мне нужны. Сам и пропитание найду и смысл жизни. Вырос он в самом центре Ленинграда в доме музыкантов и музыку в любом виде не переносил. При звуках фортепьяно, скрипки или любого вида трубы начинал выть, скрести пол когтями, нервничать. А уж оркестровые звуки вызывали в нем такую панику, что он вырывался из любого помещения и убегал «куда глаза глядят», только б подальше.  И долго не возвращался, иногда никогда. Убежал однажды так далеко, что добежал до Порта и надолго стал  обитателем  портовых  улиц  и подворотней. Ни подруг, ни детей Бог ему не дал. Несколько приблудышей он воспитал, выкормил и выгнал на волю. Долго терпеть чужие несчастия не мог. Своих хватало. Впрочем, себе он совершенно не сочувствовал, бед и болезней не избегал, боли не боялся. Пару раз его правую лапу переезжали автомобили и он долго бездвижно лежал голодая, потом полз, потом хромал. Уже ближе к старости его поймали сетью живодеры и испытывали на нем какие-то вакцины, из-за чего он совершенно облысел и покрылся струпьями.  В приличном месте он уже появиться не мог. Его отгоняли палками и ногами от детей.  Милиционеры несколько раз брали его «на мушку», но промахивались.  Во двор Храма, где ему раньше подавали и лечили,  больше не пускали. Подкармливавшие до того бомжи,  его компанией стали брезговать и близко к себе не подпускали. Однажды он спасался от лютого мороза в вагонах масокомбината на портовых путях,  умудряясь запрыгивать в них прямо во время маневрирования состава. Там,  зарываясь в туши коров, он пытался согреться и замёрз окончательно. Его окоченелое безволосое тело нашёл станционный стрелочник и оттащил в свою будку, решив, спьяна, что из этого телёнка что-нибудь да сварится. Вода в процессе кипячения оживила его и он успел выскочить из таза ошпаренный, но в сознании.  Помер от удара только стрелочник, увидев такое чудо. Прожив зиму в опустевшей будке и доев запасы стрелочника, он решил искать наконец место для дожития. Вариантов было немного. Свалка, но там за место и пропитание надо было драться с молодой стаей, чего уже ой, как не хотелось. Кладбищенская служба, ему когда-то обещанная знакомым сторожем, но жив ли? И, наконец, в Доме престарелых, как он недавно обнаружил, проживала  теперь семейная пара его прошлых хозяев с Лиговки.  Можно было бы попытаться им о себе напомнить. Но как, в таком голом виде? Он попробовал все варианты. Не получился ни один. Сторож помер, хозяева не признали, для свалки ни зубов, ни шансов не хватило. Несколько недель наш пёс проголодал. И решил порыбачить, или чайку ухватить, или съестной мусор с кораблей найти,  или утонуть, в конце концов, как получится. Прыгнул с высокого пирса, плюхнулся в невскую воду, барахтается.  Ни рыбки, ни чайки. Пошёл ко дну, но заскучал о жизни и  попробовал всплыть. Получилось. Его увидели с борта большого индонезийского сухогруза, ожидавшего выхода в канал. Бросили спасательный круг, подтянули и подняли на борт. Несчастный русский пёс, лысый, беззубый и тощий, вызвал в индонезийцах умиление и национальную гордость. Впервые в жизни ему повезло. Накормили, отогрели и через полгода выпустили на пляж Мьянмы, проплывая мимо.  Дальше, увы, корабль шёл на металлолом. Его приняла за своего стая бездомных собак, квартировавшая при шалаше буддийского монаха. Каждое утро встречал он солнце из океана, куда ушёл его корабль, и  каждый вечер  туда же в океан солнце провожал. В один из закатов, лёжа на песке, мы познакомились и разговорились. Подружились, можно сказать. Ленинградцы всё ж. Санкт-Петербург, 2008"}, {"title": "Теле-телефон", "date": "25 декабря 2021", "categories": "Телевидение", "file": "post/027.html", "text": "В 61-ом году, кажется, или вокруг этого, в помещении старого телецентра на улице Павлова в Ленинграде открыли пункт видеотелефонной связи. Гордился им весь СССР. В «Огоньке» хвалили, в «Новостях Дня» показывали. Можно было увидеть и услышать родственников из двух-трех городов Союза, там где соответствующую аппаратуру поставили – Москва, Киев, еще где-то.  Аттракцион был сверхпопулярным и не дешевым. Записывались за недели.  И шли на Павлова, как на праздник! Одежку специально покупали или отглаживали. Были, конечно, и неприятные моменты. При мне один клиент требовал назад деньги – рублей пятнадцать, кажется.  Его по видеотелефону сосватали. Он поехал знакомиться и разочаровался качеством реальной женщины. На экране она выглядела куда лучше. Вот возмещение своих расходов на дорогу до дамы и обратно неудавшийся жених от дежурного оператора и требовал. Почти в драку лез. Кроме немалого технического персонала дежурил на Павлова при телефонной трубке и милиционер. Обошлось. К удивлению «звонящих», их собеседников можно было хорошо рассмотреть на маленьком экране. Даже узнать. Правда, посчитать, к примеру, количество зубов у говорящей головы на тогдашнем телевизоре было трудновато. Однако, чего ученые достигли!"}, {"title": "Клейман", "date": "24 декабря 2021", "categories": "Царапины на памяти", "file": "post/028.html", "text": "Буквально вчера-позавчера обругивали мы с Аркадием Клейманом всякие мемуарные воспоминания в обществе про друзей и знакомых. И в Википедии и в сети вооще.  Мол, сколько ж там вранья и глупостей. И бросил он мне такое своё мнение - «... Так это ж потом, после нашей жизни, какой-нибудь доброхот про нас такую хуйню напишет без  нашего контроля, что заеб..шься на том свете пыль глотать от злости и психического раздражения нервов.  Надо самому про себя если не писать, то контролировать.» Вот я для «контроля» решился этот текст опубликовать. Тем более, ДР Аркадия случился совсем на днях а я, в силу жизненных затруднений, ещё не поздравлял.  Поздравляю! КЛЕЙМАН Он старше меня на три месяца или я младше его на три месяца, многие уже десятилетия мы в этом вопросе согласия не находим. Нет единого мнения между нами и в том, кто раньше помрет. Хотя шансов быть вторым у Клеймана гораздо больше. И киевская природа его наградила несравнимой выносливостью и сам он себя всю дорогу закалял и тренировал.  Почти квадратный каратист, упругий и бугристый во всех ответственных мужских местах. Конечно, в  21-м веке он многие свои козыри растерял - глаза, зубы, мочевой пузырь...  Природные органы помутнели, поизносились, потребовали ремонта или замены.  Но если сравнивать со мной, то  он ещё в порядке, вполне живучего вида и перспектив меня похоронить. И, что важно, я уже лет пятьдесят не очень и против, так он убедителен словами и видом в своих превосходствах. В придачу  он ещё и человек системный. Есть некоторый набор хрестоматийных знаний, которым он неукоснительно подчиняется - знает про выпить обязательно 2 литра воды в день и выпивает, знает про обязательность прогулок и разминок и единственный из многомиллионного населения Баварии  регулярно прочесывает ее леса и горы в «грибных походах». Про необходимость спокойствия и размеренности он тоже знает и невозмутимость самая, пожалуй, яркая  теперь черта его внешности. Много раньше, как только он появился в Ленинграде, а это начало шестидесятых, его ярчайшей чертой был чуб на лысеющем черепе, чуб толстый, мохнатый и очень длинный, что позволяло укладывать его спиралью на голове, скреплять заколками и выдавать за приличную шевелюру. Даже я первое время на это покупался, считая  собеседника человеком красивым и волосатым.  А он на поверку оказался  всего лишь умным и изобретательным. Какое-то время знакомые девушки делали вид, что верят в его неотразимую внешность и охотно мне с ним изменяли. Но годы шли, чуб тончал и хирел, ему на замену пришел берет, совершенно рембрантовский. Он  не снимался никогда - ни дома, ни в гостях, ни на телевидении. Что там под ним - не видел никто, кроме Всевидящего. И это интриговало общество ещё больше.  Неснимаемый головной убор, правда, сильно подпортил его отношение с рядовым  христианством, превратив К в раздражённого атеиста. Но, поверьте, не разрешив ему ходить в храмы с покрытой головой  Церковь потеряла и теряет много больше.  Годами спустя роскошный берет уступил место солидной кепке  чёрного, темно-коричневого или защитного цвета. И она уже иногда, не часто впрочем,  своё место покидала. Хозяину стало проще и на похоронах и в музеях, и в театрах, которые все чаще стали писать его чуть искаженную, по его желанию,  фамилию на своих афишах рядом с большими буквами - «Премьера». Я был на нескольких спектаклях и лишний раз убедился, что театры у нас, даже центральные,  бывают глупее и скучнее авторов. Таким образом через драматургию мы плавно переходим к перечислению его публичных талантов. Чем он выделялся в Киеве,не знаю. Жил он рядом со стадионом Лобановского, но связан ли триумф Киевского Динамо с его личностью, утверждать не берусь. Мне он стал известен как автор чрезвычайно едких стихов, которые мой брат- поэт цитировал на пьянках в своем подвале в Столешниковом переулке, куда я из Питера постоянно стал ездить класса с восьмого- девятого. «Смешно» - реагировал брат на какую-нибудь штуку гениев, собиравшихся еженощно у него в подвале, а вот у Клеймана по этому поводу так - и выдавал наизусть что-нибудь залихватское из «Клеймана».  И Эдик Успенский и Вадим Левин, и Миша Жванецкий, и Юлик Ким, и разные другие таланты и талантища поднимали брови и цокали языками от восхищения. Позже он каким-то образом оказался в Ленинграде, но эту часть ленинградской жизни я не помню совершенно. Возможно, это как-то связано с его музыкальным образованием. Или не связано, поскольку в Киеве тоже есть училища при консерватории. Сначала он жил почти на Чёрной речке, а это чертовски далеко от Ленинграда, потом купил кооператив в Купчино, а это ещё дальше. Виделись мы не часто. В основном на Чапыгина, где в отличие от меня он быстро стал делать руководящую карьеру, что при его узнаваемой внешности, берету маэстро и записям в документах было очень непривычно. Но такой убедительности был талант. И его хобби тех лет было чрезвычайным  - он делал скрипки Страдивари. С конечной, как помню, целью - сделать лучше. Изучал скрипичную конструкцию,  физику и химию инструмента - состав дерева, лака, воздуха внутри. По стенам его квартиры висели скрипичные скелеты, которыми его снабжали дружки, впоследствии всемирно известные люди, из  Ленинградской консерватории. Умел ли он при этом играть на скрипке? Еврейский мальчик из Киева?  И не спрашивайте! Ну, естественно, умел. Но не лучше Ойстраха. Сделал ли он в результате инструмент лучше Страдивари? Не помню, а в сети про это ничего нет, но сеть же теперешняя с такими дырами про те времена! Предположим, не сделал, но каким-то забытым мною образом он от скрипок перешёл к художественной резьбе по дереву. В его квартире стало тесно ходить. Но продержался на этой стезе не очень долго. Дела на телевидении шли в гору, его сценарии принимались, советы и рецензии уважались, записи в трудовой книжке все улучшались. Он стал «авторитетом» в деле музыкального воспитания советских детей и подростков. Его книги для детей про музыку раскупались мгновенно и охотно переводились на другие  цивилизованные языки, не всегда, правда, с его разрешения, монгольский и японский, к примеру. Особо революционное влияние оказала на общество его «История государства российского». Я подозреваю что именно с этой его философской работы началось резкое ухудшение нашей жизни, но может и не с неё или не ухудшение. Круг его знакомств в кругах Ленинградской интеллигенции быстро расширялся. Он стал вхож в многие домашние коллекции питерской элиты и это, как понимаю, решило его судьбу в искусстве. Господь указал ему перстом на бормашину и лупу и сказал - «Это!».    И увлёкся К ювелиркой вообще и резьбой по янтарю и камню в главном. И стал портить глаза, делая камеи и инталии. Но какие! Повёл я как-то, очень давно, его с камеей его авторства к знакомой искусствоведше в Эрмитаж. Она повертела изделие в руках, посмотрела в окуляр и оценила так - ювелирка современная турецкая или польская, а вот камушек настоящий - резьба  итальянская 17-18 - го века. Дорогая штучка.  А эта дама, между прочим, была ведущим экспертом по глиптике Эрмитажа. Я с ней некоторые кино про музей делал. Впрочем, может быть я перепутал и рассказываю о визите не в Эрмитаж, а в Исторический музей в Москве, где у меня тоже знающая знакомая  образовалась, с должностью и званиями. Все одно, результат был таким же, лучшие эксперты страны были уверены, что в СССРе такого резчика не водится. А он какое-то время водился, пока не переехал в другую цивилизацию. Но это - тема отдельная и трудная. Пропущу. Его работы есть и в Эрмитаже и в английской королевской семье. Его выставки путешествовали по Европе, каталог его работ - желанное приобретение  для коллекционеров. Тут его достижения я описывать не берусь. Есть в сети и статьи об этом и фильмы и фото. Интересует, наберите в поиске Аркадий Клёнов и разбирайтесь сами."}, {"title": "Шпеер", "date": "25 декабря 2021", "categories": "Царапины на памяти", "file": "post/029.html", "text": "Чудесной дорогой добирались мы в Копенгаген. Паромом, потом живописным шоссе. Приехали в город с большим запасом времени. Хорошо в нем погуляли, пообедали,подремали на траве прямо в центре недалеко от Ганса Христиана и пошли в прекрасном настроении брать интервью у внука Шпеера. Никто на стук в дверь не откликался. Дверного звонка  не было, молоточка тоже, ни одного окна, выходящего в переулок, чтоб в него постучать, и обойти дом невозможно - высокий каменный забор с колючей проволкой поверху. Сели против дома прямо на поребрик, не знаем, что делать. Назначенное время давно вышло, телефон выключен, никаких других способов связаться нам не оставили. Сказали только - приходите точно, будет ждать. Мы и пришли минута в минуту. Полчаса прошло, час. Обидно, через пол-Европы добирались. Тут голубая, вся в грязных разводьях, дверь скрипнула и приоткрылась. И никого. Мы переглянулись. Значит, все это время в доме кто-то был. Поднялись, подхватили сумки с камерой и светом, сделали шаг к двери и она захлопнулась. Прямо перед «носом». Я разозлился и пару раз пнул дверь ногой. Сильно и шумно. Из-за двери  тотчас раздался мужской голос -  «Тише, дети спят. Кто вы, чего хотите?». Объясняем максимально вежливо и тихо, что русское телевидение договорилось с господином ... поговорить о его деде и о судьбе «детей нацизма». Что нам это время назначил он сам, что мы на улице торчим уже полтора часа и на наш стук никто не отзывается. Дверь приоткрывается сантиметров на 20 и в эту щель мы с трудом протискиваемся. За дверью темнота, тишина и сильные кухонные запахи. Пахнет луком, плохим мясом и какой-то химией. Глаза привыкают к темноте и различают мужскую фигуру напротив нас. Внук министра промышленности низковат, полноват и лысеват. Совсем габаритами не походит на красавца Шпеера. Да, говорит - я вас жду. Но у меня для вас есть только полчаса. О чем вы хотели узнать? Мы проговорили часа четыре. Его «понесло». Впервые в жизни, по его словам, он не боялся говорить. Впервые в жизни он позволил себе «вспоминать». Мы привезли несколько часов материала. Минуты две взял в свой, как всегда  импотентный, фильм заказчик - РТ, остальное так и лежит не смонтированным.  Руки и «душа» не доходят. А как  интересна «исповедь» потомка одного из главных министров третьего рейха. О деде, которого он и безумно любил и страшно ненавидел, о семьях главных преступников человечества, о необходимости всю жизнь прятаться,  менять адреса и фамилии, страны и города, врать друзьям, коллегам, собственным детям и себе. Жить за всегда запертой дверью, без телефона, в полутьме и тишине, боясь лишний раз выйти на улицу, боясь стуков в дверь, боясь телевизионных и газетных новостей, боясь своей собственной фамилии и памяти. Все надеюсь, что хватит моих сил и времени расшифровать и смонтировать этот разговор."}, {"title": "Буддиана", "date": "24 декабря 2021", "categories": "Рассказы", "file": "post/030.html", "text": "Рано утром перед отлетом он последний раз совершил ритуал сбора ракушек. Прошелся с километр по берегу, по влажному ещё от ночного прибоя песку, делая глубокие, как мог, вдохи и выдыхи, задерживая, сколько мог, дыхание. Мог, правда, не очень. Повращал туда-сюда плечами, поприседал пару раз, на большее сил не хватило, попробовал, оглянувшись, не видит ли кто, попрыгать, хлопая ладонями над головой. Зашёлся кашлем и дурость эту бросил. Побрел назад, «напоследок» закачивая в душу морские запахи, виды, звуки. Хотелось всплакнуть. Скорее всего, на океане ему больше не бывать. Ракушка подобралась очень необычная — узкий белый витой цилиндр, см 15 длиной, с заострённым кремовым выступом из «задницы». Словно пизанская колокольня, прикинул он. В набежавшей волне хорошенько ее отмыл от песка и сунул в пакет с прочим уловом. От Нгапали до Янгона сорок минут лета. Встретили в аэропорту, довезли до дома, накормили и налили стопочку. Постепенно дошла очередь и до пакета с ракушками. Он вывалил всю немалую коллекцию на большой обеденный стол и стал хвастать эксклюзивами. Были экземпляры очень интересные. Несколько просто замечательных. Надо бы отослать Клейману фото, вдруг пригодятся для его ювелирных поделок. Коричневый шерстяной рачок выглянул из цилиндрической ракушки совершенно для всех неожиданно. Первым его углядел сын. «Как же ты не проверил, не потряс хотя бы..!?».«Да проверял и тряс. И что теперь? Смотри, он почти дохлый». Принесли глубокую тарелку. Налили воды из под крана. Пресной. Соли морской подсыпать, что ли? Подсыпали. Рачок медленно зашевелил волосатыми лапками. А кормить чем? Раскрошили рыбных чипсов. Они быстро намокли в воде и обтянули несчастного липким слоем. Тот, вроде, и не среагировал. Достали из электронной ловушки несколько комариных трупов, сыпанули в воду. Рачок утянул свои лапки, уполз в глубь ракушки. Над тарелкой повисло тягостное молчание. Шутить не хотелось. Утром первым делом он проверил тарелку. Кажется жив. Шевелится, выглядывает. Решил переселить гостя в огромный садовый горшок с лотосом. Может там найдет пропитание. Белая изящная раковина очень была красива в больших залитых солнцем листьях лотоса. Тут же налетели вороны. Ели спасли. Перенесли несчастного с его домом в большую многолитровую банку. Прошло ещё два дня. Жив? Шевелится. Но все медленнее и реже выползает на свет божий. Он от банки почти и не отходил и был весьма мрачен. По ночам в его тяжелых снах возникал кто-то и грозил пальцем. Перелёт до океана — 100 долларов в один конец. Потом на рикше минут сорок до знакомого пляжа. Он достал ракушку с неподвижно обвившими кремовый выступ волосатыми лапками и положил на песок к самой кромке вечерней волны. Ждал минут десять. Вода заползала внутрь раковины, шевелила лапки. Может жив ещё. Потом он размахнулся во всю старческую мощь и забросил раковину в океан. Метров двадцать пролетела. Какое-то время белое пятно качалось на волнах. Несколько кругов сделала над ним крикливая чайка, но добычи не обнаружила и исчезла. Раковина, наконец, булькнула и пошла на дно. Нгапали, 2019"}, {"title": "Кофе с красной икрой", "date": "24 января 2022", "categories": "Рассказы", "file": "post/031.html", "text": "Весь текст этого «рассказа» является прямой речью двух стариков, недавно справивших почти шестидесятилетний юбилей своей дружбы в этом мире, вернее уже в том. И поскольку за бесконечной давностью знакомства их различия - физиономические, физиологические и умственные, подтерлись и сгладились, то кто и что именно говорит, не очень уж и важно. Потому позволю себе поставить дефис, открывающий прямую речь, один раз, в самом начале, и на том забыть об этой клавише, экономя скрюченный палец и умственные усилия. - Молодец, что добрался. Мне до тебя уже никогда не доехать. Ты для меня за краем света. Так я тоже себя плохо перемещаю, считай, что это всего лишь моя душа тебя посетила. А плохо подвижный организм весь там, в Германии. Ну что ж, и этому твоему куску рад, раздевайся, проходи. Чего твоё туловище потребляло помню, а душе чего налить - хороший кофе, бренди, коньяк, хороший чай? Это зависит от всего предлагаемого меню, что именно предстоит запивать? Ну, есть хлеб белый-чёрный, почти свежий, варенье на него - малина, смородина, алыча. Сыр есть, приличный. Бутербродик с икрой могу соорудить. Замечательная кислая капуста есть из Ашана. Огурцы соленые, немного прокисшие. А суп будешь? Борщ из пакета, очень даже вкусный, особенно с огурцами. Не, борщ слишком политизированная еда, начнём выяснять - чей Крым? А мне спорить с тобой надоело лет двадцать назад. Начинай с икры. А чай? Чай с икрой - моветон, обещан же кофе. Как знаешь, твой блокадный вкус всегда предпочитал соленое правильному, обувь не снимай, тут грязновато, всё нет сил прибраться. Будто тут было когда-нибудь чисто, даже кошка твой бардак не вынесла, померла. Не поминай всуе Проську, мне без неё тоскливо, вот доедаю ее запасы. Хочешь попробовать филе индейки? Спасибо, не настолько голоден. Чистоплюй, всегда знал за тобой это высокомерие. Проська это, кстати, чувствовала, потому и спать с тобой отказывалась. Не сочиняй, причина в другом – ты ревновал и она твою ревность учитывала. Да и мои питерские храпы ей не нравились. Ты с ростовским переливом - дело другое. А будешь изодранные обои переклеивать? Или на память оставишь? Да некому, самому не согнуться, а звать работяг не по карману. И сына загружать не хочу. Он свою квартиру никак не отремонтирует. Все последние годы рассчитывал на тебя, вижу, напрасно. Но, конечно, надо бы переклеить, эти кошачьи клочья на психику давят. Вот если до весны доживу… Ну так что - коньяк, бренди? Напьёмся? Похоже, последний раз встречаемся, чего уж врать то. Ты ко мне больше не выберешься, это понятно, и я на такой подвиг не способен. На повтор меня не хватит точно, наливай. Погоди, стопочки сполосну. Они уж год как в без дела стоят. Их мне, кстати, Боря подарил на одну из свадеб. Или своих или моих. Полвека из них пью. Дай посмотреть, это ж я тебе подарил, за переезд в Москву. Ага, щас, ты. Точно Боря, сейчас вспомню, по какому поводу. По-моему, по поводу диплома. Значит, в 69-м. Мы ж раньше тебя защищались. Я ему бочку казахского мёда, он мне стопочки из горного хрусталя. Ну ты и рухлядь! Это я тебе привез из Киргизии, когда ты москвичом стал. Сам вёз, сам вручал. Ладно, склероз прощаю. Спорить с тобой себе дороже. Ну, давай, за нас, за прожитую жизнь, за общее прошлое! (Чокаются, заедают бутербродами с красной икрой) И за Борьку! У меня, не поверишь, он перед глазами - тоже рюмку поднимает. Сколько же его нет? Да уже лет сорок, в каком году его зарезали? В 77-м. Значит, скоро сорок пять, ого! Кстати, когда его увозили в операционную, он тебе велел напомнить о твоём долге - ящике коньяка, а я тогда забыл, не сказал тебе, вот только сейчас напоминаю. Врешь, никакого-такого долга не было… Впрочем, погоди, что-то такое было, что-то мерещится, какой-то наш спор по поводу, ну да, ну да - кульминации в «Жанне» Ануя. Я, кажется, проспорил. Убей Бог… Теперь-то отдам. А хорошо пошло, что за пойло? Это бренди австралийский. Прислали недавно родственники. На годовщину Лены. Давай за Лену! Давай! Я тут подсчитал - ты искал её 67 лет, а я подключился к поискам на втором курсе, значит, я искал твою сестру 44 года. Это и моя жизнь! Мой поиск. За Лену, за найденных, за Победу! И за Борю! (Чокаются дважды, долизывают из баночки красную икру) И за сынов наливай. Я Фила своим считаю до сих пор, хоть последний раз видел совсем крохой. Они с Аркадием одногодки? Нет, Аркадий старше, помню, он в Целинограде за зелёным своим «Максимом» лежал и нас белогвардейцев расстреливал, когда Фил и в носу ковырять не умел. Помню его очень зримо. Филипп такая же моя боль, как и твоя. Не понимаю, как это напрочь отречься от детства, от родины, от отца, от памяти… Неужто Америка такой утюг, все сглаживает, запаривает, затрамбовывает. Не хочу об этом. Давай за всех наших парней! (Чокаются пять раз, переходят на дольки лимона) За жён будем? Куда денемся. Наливай. (Чокаются многократно, доедают лимон, достают из холодильника заплесневевшие огурцы). Так! Врачи советуют не торопиться. Перейдём, пожалуй, к борщу, греть не будем. Тебе его ложкой из кастрюли или в тарелку? А чесночку? Вот тут пол-ложки сметаны, оближи. Ох! Булка зачерствела, бери чёрный, обрежь только снизу. Уверен, что не хочешь борща? Уверен. Дай закурить. Не дам, Кирилл все отобрал. Да мне сейчас и затяжку не выдержать. Всё, откурился. Не стенай, переходи на жвачку. Так, что дальше? А не выпить ли и за знакомство, ты появился, помню, только на втором курсе. Это какой год? 64 или 65-й. Помню, мы тебя с Борей сначала определили как папашу Ермоловой. Входит в аудиторию старый, рослый, белозубый, курносый. Не еврей - одним словом? А уж шевелюра Байкальского оленевода. Так и определили - «папаша». Больше некому, не сокурсник же. Да и вы мелюзга, впечатление произвели на меня отвратительное. Столичная шпана. Пижоны бородатые. Так, за знакомство! (Чокаются, оглядываются, закусь кончилась, переходят на филе индейки) Ты всех помнишь? Можешь перечислить? Запросто. (Долго перечисляет) Офигеть! Я две-три фамилии бы вспомнил, не больше. Ну рожи какие-то мерещатся и тишина! Памяти твоей феноменальной всегда завидовал. Как с такой памятью помирать? Замечательно, вокруг толпа теней и голосов, не один. А ты вот в своих историях всё время врешь, всё путаешь или запутываешь. Это твоё беспамятство? Да нет, я ж не сочиняю, мне диктуют, я записываю. Кто диктует? Ну, тут варианты - глубинная память, или душа, или кукловод. А ты при этом видишь картинки, сцены, слышишь разговоры, звуки? Нет, мне диктуют слова, я только успеваю на клавиатуру жать. Интересно. У меня по-другому, я вижу и слышу, довольно четко. А уверен, что видишь не миражи? Нет, у меня все очень конкретно, выпукло, ясно. Не «как вчера», слишком далеко и мелко, долго всматриваюсь, но все реально и, как бы это сказать, правдиво! Я уверен, что так и было. Вижу солнечную веранду, маму, папу, себя за столом. Немцев помнишь? Нет, пожалуй, меня же прятали. Помню, как полицаев вешали, лица вижу. Но мне тогда уже порядочно было. Чего не помнить! (Чокаются, почти промахиваясь, но не расплескав) За географию поднимем? Тебе какое самое памятное место жизни? Дай подумать. Ну, кроме, естественно, Ростовского детства. Пожалуй, Свердловск. Там пик здоровья, потенции, счастья. Потом все как-то вниз. А у меня на весь мой Свердловск одна картинка - я у зелёной батареи в детском саду жду маму. И, кажется, реву. Потом вся память занята Ленинградом. Даже, когда в Москву переехал. И сейчас, если снится, то Питер, хоть я в нем лет пятнадцать уже не был. Но может и не Урал, погоди, может, Целиноград. Если спросить, откуда я…, кто я? Ну, явно, не москвич, не уралец, не ростовчанин. Нет, думаю, главная станция на моем пути - Целиноград! Знаешь, и для меня ты в первую очередь оттуда. В институте хвалился, друг - главный целинный режиссёр! Такая глыба! За Целину? За Свердловск! За Питер! За Ростовскую веранду! За Россию! (Чокаются и долго с остановками пьют, подливая) За Москву будем? А не перепьем? Последний раз же, черт с ними. Ты когда в Москву перебрался? Не соображу, в середине восьмидесятых? Тебе ж лучше знать, ты ме"}, {"title": "Режиссёр", "date": "26 декабря 2021", "categories": "Царапины на памяти", "file": "post/032.html", "text": "Это совсем не некролог. Режиссёр жив, чем-то занят, скорее всего перечитывает неплохую свою библиотеку. Как человек очень старо-советский он не признаёт компьютеры, интернет, всякие там фейсбуки и твиттеры.  Это успокаивает меня - не увидит, не прочтёт, не обидится лишний раз. Хотя всё что здесь  пишу, пишу с величайшим почтением и даже восхищением многими гранями его таланта. Один из самых интересных персонажей моей жизни. Когда-то очень близких. Поэтому «был» в этом тексте значит лишь одно - рассказ идёт о далеком  прошлом. Это я только потом, сильно после, понял, что он был для меня и других совершенно закрыт. И в мыслях, в логике поведения, в отношениях и замыслах.  Его поразительное качество - полный над собой и ситуацией контроль, ничего лишнего наружу.  Он и потому был совершенно лысым – неуправляемые волосы мешали бы концентрации,  суетились  бы перед глазами. Кроме того,  он с детства знал,  что умный человек должен походить на лошадь и этого сходства всегда добивался – выпячивал губу, подводил  глаза темным гримом, чуть горбясь наклонял голову и выдвигал лысый череп вперёд. Смеялся он тоже по лошадиному - коротко, громко, широко распахивая челюсти с большими кремовыми зубами, но с финалом смеха у него было не много вариантов - сразу мрачнеть, мрачнеть постепенно, застывать с полуоткрытым ртом и, засовывая туда сигарету, не спускать с собеседника глаз. Как и Пушкин, ходил он с железной тростью, внутри которой, возможно, был клинок. Но ни разу я не видел, что б он его доставал, даже в жестко конфликтных ситуациях. Хотя при опасности  всегда натягивал на руки чёрные кожаные перчатки, в качестве боксерского оружия, и умело ими пользовался. В его карманах и в непременной борсетке через плечо был всегда стандартный набор предметов, без которых он из дома не выходил.  Темные, почти чёрные, маленькие круглые очки, он всегда надевал их на улице и в транспорте; несколько зеркал - вогнутое, выпуклое, прямое с ручкой;  кожаные перчатки;  баночка светлой пудры  и пара тюбиков губной помады - посветлее и потемнее, он частенько уговаривал случайных встречных, согласных фотографироваться, припудрить лицо, подкрасить губы или оттенить глаза. Позже, уже в Германии,  он всегда носил с собой ещё и флакон освежителя для тела и рта и пачку апельсиновой жвачки. И всегда, даже в нищие советские времена, в его кармане лежал дорогой миниатюрный фотоаппарат. Карманы эти  были  специально пришиты  на всех его пальто и куртках, широкие и на нужной высоте. Аппарат должен был выхватываться  мгновенно и уже сразу удобно лежать в руке.  Многие его объекты даже не успевали заметить, что сфотографированы. Щёлкал он затвором повсюду - на тротуарах, в трамваях, в любимом роддоме, на рынках, в павильонах студии, на кладбище. Что б «прикрыть» этот механический щелчок он все время тренировал в себе умение громко подцыкивать в нужный момент. Редко, но получалось. Прохожие оборачивались на неприличный звук, не подозревая, что уже попались. Дома и в студии он предпочитал зеркальные аппараты или даже старинные пластиночные. Сходить в его доме в туалет или помыться было проблемой, всё было заставлено бутылями и пакетами с химией, висящими отпечатками, пленками,  пластинами, отдельными кадриками.  Сын и гости в туалет ходили  к соседям. В толпе он частенько пользовался зеркалами из сумочки. Снимал назад, не поворачивая голову.  Ультра-общий  план, снимал через поднятое над головой выпуклое зеркальце. Вогнутое использовал для выделения нужного лица. Часто снимал снизу, сквозь ноги, используя зеркало с ручкой. Ставить свет он не очень любил, или не очень умел, предпочитал естественное освещение.  Его  фотопортреты в контрасте солнечного света и тени получались иногда выдающимися. Несколько великихленинградских фигур отпевали и хоронили под  его работами.  «Аврора» и «Нева» не раз украшали свои обложки  его фотографиями. “Юность» как-то дала целый разворот его ленинградских пейзажей. Он был «охотник» - зоркий, терпеливый, точный. Умел заговаривать жертву, поджидая нужного состояния. Умел провоцировать на реакцию. Умел быть наглым и настойчивым. Умел быть слабым и застенчивым. Мало кто не обманывался его масками. Что мне в нем особо нравилось - он не был прямолинейным, при всём  своём занудстве. «Двойное дно»,  интрига, возможность вариантов не были ему чужды. Особой «изобретательностью» его идеи не отличались, но мастерство исполнения искупало всё. Его не любили коллеги. Он был высокомерно молчалив и молчаливо ироничен, товарищеских посиделок с водкой и анекдотами избегал. На подарки начальству не скидывался, по поводу агрессии Израиля не высказывался. Его любили женщины странные - худощавые, взъерошенные, стремительные. Он все время попадал в неприятные любовные коллизии - разрушал семьи, в том числе и собственную, преследовался бывшими жёнами и любовницами, мучился и оправдывался. Пытался писать стихи. Плохие. И в музыке он разбирался плохо, но быстро понял, что главное рабочее состояние хорошего режиссера – тоска,  тренируется не водкой, как ошибаются многие, а только музыкой. Стал ходить на концерты, купил проигрыватель, полюбил моего любимого Малера. Ничего он не понимал в живописи. Я настаивал, что для чувства композиции, цвета, гармонии  ему необходимо ходить со мной в Эрмитаж.  Он молча ходил и снимал лица посетителей. С Каналетто ему было скучно. С первых наших разговоров он твёрдо заявлял мне - «Я буду режиссером  лучшим чем ты и раньше тебя». Не скажу, что очень меня этим расстраивал -  я никогда  так  далеко не заглядывал, но когда он снял свой первый фильм я встал перед ним на колено и снял «шляпу». Хотя фильм мне, мягко говоря, не понравился."}, {"title": "Рождественское", "date": "24 декабря 2021", "categories": "Рассказы", "file": "post/033.html", "text": "В новогоднюю ночь слон почувствовал себя плохо и в гору не пошёл. Он остался внизу в деревне, прислонился к столбу, к которому днём был привязан цепью, а сейчас отвязан, закрыл глаза и задремал. Ему приснился ручей и мама слониха, поливающая его голову струйкой тёплой сладкой речной воды. Во сне мама была огромной и молодой, ее левый глаз, два ее глаза сразу он никогда не видел, был круглым и зелёным и в нем вспыхивали яркие звездочки. На берегу ручья в большой чашке из пальмового дерева лежали всякие розовые вкусности, мелко порезанная тыква, сладкие побеги тростника, мякоть арбуза. Из деревни за косогором неслись детские крики и совсем нестрашный собачий лай.  Остальной мир был очень тихим, только в слоновьих ушах что-то тоненько дребезжало. Слон медленно опустился на правое колено, потом завалился набок и уткнулся лбом в дорожную колею. Колея пахла вечным слоновьим пометом, тёплым, родным. Прямо перед его зрачком пробежал маленький геккон, притормозил  и, кажется, заглянул слону внутрь.  Ветерок с гор потрепал  его уже почти лысую холку, погладил истерзанную годами и неподъемной поклажей спину, смахнул мутную слезу с его ресниц. Гул в ушах отодвинулся, сквозь него тихо-тихо пробились стуки колотушки, которой когда-то звали его из леса. В бесконечно далеком синем детстве. Стук все усиливался, разрастался, заполняя огромный череп спокойствием и смирением. И заглушая все слоновьи  боли, чувства, мысли, прозрачные колокола отзвонили над ним  в вышине давно забытую им мелодию Джингл Белс. Последний звон прозвучал громко, почти оглушающе, и после него тишина наступила прекрасная, счастливая, рождественская. Мьянма, 2019"}, {"title": "Тридцать три", "date": "15 апреля 2022", "categories": "Рассказы", "file": "post/034.html", "text": "«А точнее?» — спросил он, отвернувшись к окну. За окном набухла сирень, черные скворцы выковыривали что-то из изумрудной травы, из желтого фургона выгружали перед соседним участком огромные керамические горшки и мешки с перегноем. «Месяца два. Вряд ли дольше. Мы можем ещё вас подержать в клинике, но это ничего не даст, не хочу вас обманывать. Два раза в день принимайте это, два раза по тридцать-сорок капель не больше, болей не будет. Если будет тошнить, пейте больше воды. Два раза в неделю сестра будет приезжать к вам, делать укол. Не беспокойтесь. Однажды Вы просто уснёте.» Трамвай катился по лесу. Оранжевые голые стволы обступили колею, перекатывались, передавали вагон друг другу. На повороте его коляску наклонило, какой-то мальчик подхватил, удержал. Они улыбнулись друг другу. За кухонным окном сидел кот, ждал. Увидел у калитки коляску, засуетился, забегал, приветственно поднял хвост. Сквозь стекло блестел пол в дальней комнате и белела раскрытая на полу упавшая книга. Когда его увозила скорая, задели полку, книга упала и так все эти недели пролежала. Он загадал, что за книга и на какой странице раскрылась. Книгу не угадал. А страница оказалась точно тридцать третьей. Ему на 33 всегда везло. И шкафчик в детсаду был тридцать третьим. И автобус этого номера шел к школе. И первый раз женился он Загсе с таким номером, правда, не очень удачно. А однажды на ипподроме 33-й номер принёс ему единственный в жизни большой выигрыш, сразу, впрочем, промотанный.  И в возрасте Христа случилась единственная в его жизни любовь и радость. Пусть недолгая, но запомнившаяся до конца. И вообще красивая цифра. Прежде всего он снял с кухонной стены календарь. Разорвал на страницы, скомкал и комок выбросил через кухонную дверь к забору, целясь в синий контейнер для бумаги у калитки, промазал, пришлось забираться в коляску, катить в сад, поднимать. В саду оглушительно пахло весной, он запрокинул голову, закрыл глаза и немного поспал. Пришел соседский сын, который уже погода выполнял функции секретаря при нем, принес коробки для упаковки библиотеки, расставил их перед стеллажами, записал список поручений, которые были обдуманы ещё в клинике. Забрал стопку писем родным и друзьям, почтовый ящик был на соседнем перекрестке. Уходя накапал в стопку 30 капель, протянул ему. Он подумал и попросил добавить ещё три капли. На закате вернулся из сада кот, обошел коляску, осмотрел хозяина, зевнул и растянулся, свесив хвост, прямо поверх старого толстого еще монитора.  Монитор потому и не меняли, хотя давно надо было, настолько привык хозяин к этой пушистой завесе перед экраном, которую все время приходилось сдвигать в сторону. Полистал почту, ответил на пару писем, удалил свои аккаунты из трёх соцсетей, все фотографии, все тексты, глянул по диагонали на ленту новостей, поморщился и отключился от сети. Навсегда. Свет в комнате включать не стал, так и сидел у окна, растворяясь в сумерках. В полной темноте подкатил к нему сияющий тридцать третий автобус, неожиданно полный пассажиров, голосов, музыки. Кот в последний миг примчался из кухни, заскочил в салон и радостно заорал. От этого ли крика или от чего другого лопнули почки в саду и всё вокруг зазвенело и закружилось. Потсдам, 2022"}, {"title": "Столовая на четвертом. Конец шестидесятых", "date": "27 декабря 2021", "categories": "Телевидение", "file": "post/035.html", "text": "Не знаю каким именно временам принадлежит это фото. Ни одного, вроде, знакомого лица. Но стулья и столики почти родные. Как-то своё существование мы этой столовой поддерживали. Не вкусно, не сытно, но сравнительно дёшево. Да и куда было деться. Не в Интурист же ходить, где так же невкусно, но дорого. Принёс однажды  Боря Карпов с собой на работу пирожки с капустой. То ли бабушкины, то ли девушкины. И уселись мы всей волосатой тройкой за столик - он, Олег Агафонов да я. И развернули пакет. Запахло сразу в столовой посторонним. Соседние столики насторожились. Вижу, поднимается из угла Бажин и идёт к нам. У них там наверху свой буфет был, но он предпочитал с народом. Подходит. Наглый Боря тут же ему пирожок предлагает. От души. Бажин, никак не могу вспомнить его имя - отчество, пару минут подбирал ответ - тужился, пыхтел, краснел. - И это, говорит наконец, вы с собой на работу носите. Отнимаете у родителей и стариков. Они всю войну недоедали, спасая вас и Родину. Морковку у Исаакиевского собора выращивали, хлеб у воробьев отбирали. Фотографии яблок только в газете “Правда» и видели. Я, говорит,  сам шишки в лесу собирал, масло из них давил. А вы хоть один колосок в своей жизни вырастили? Хоть одного раненного из-под огня вынесли? Хоть один русский город освободили? А туда же, с капустой! Стало нам очень стыдно и мы отдали ему весь пакет. Взял. Это, кто не в курсе, был первый заместитель директора Лентв, типа - Главный редактор. Славное было время. И капусты на всё хватало."}, {"title": "Смерть в Сингапуре", "date": "24 декабря 2021", "categories": "Рассказы", "file": "post/036.html", "text": "В Сингапуре его поселили прямо на границе с Индонезией. На сваях его дома, упиравшихся с одной стороны прямо в дно пролива,  укреплены были таблички с надписями на английском и китайском - «Внимание, выход на берег Сингапура без разрешающего документа карается смертью».  Метрах в двухстах от его окон проходила морская граница и наблюдать в бинокль за огромными судами, снующими туда-сюда сразу за ней, было его любимым времяпрепровождением.  Хозяин квартиры, ему  арендованной, особо предупредил, что нельзя высовываться из окна, могут крупно оштрафовать. Граница же. Тысяч на пятьдесят сингапурских долларов. Ха, ему столько и за полгода не заработать. Тогда в тюрьму  года на три.  Он и не высовывался, тем более стёкла огромных окон автоматически мылись  роботами каждые два дня и были идеально прозрачными. В центр он ездил на такси за очень божескую цену.  На автобусе почему-то выходило дороже, да и с контроллерами он не любил объясняться. Местные правила он знал плохо, боялся что-нибудь нарушить, запутаться в объяснениях и тут-же получить ни за что ни про что баснословный штраф. Таксисты же отлично говорили по английски и были кристально вежливы и честны.  Пусть вынужденно. Кстати, можно было и  не платить  сразу наличными. Радары, висящие по всему городу, отслеживали поездки  и поступки всех горожан и гостей и могли по вашему желанию снять оплату за любой сервис  с любого счета.  Правда, не дай тебе Бог что-то спутать или даже  смухлевать с оплатой. О последствиях страшно было и думать. В центре он прежде всего шёл в общественный туалет и приводил себя в порядок - чистил зубы, принимал душ, брился. Намазывался и опрыскивался при этом  всеми  одеколонами  и кремами, что стояли и лежали в витринах туалета. Не стоило это ничего. За все  гигиенические  потребности  граждан  платило государство.   Ему это экономило  очень приличные деньги на воде, электричестве и всякой парфюмерии. Сэкономленное позволяло каждое утро подниматься на крышу грандиозного небоскреба - Марина Бэй Сэнди  и там в райском саду у бассейна выпивать  чашечку отменного кофе со сливками и клубникой.  Потом, поглазев с головокружительной высоты на окружающий Сингапур океан и очередь до горизонта из тысяч,  ждущих входа в самый большой на Земле порт, пассажирских и грузовых судов, он спускался скоростным лифтом в гигантский холл отеля, успевая просмотреть выпуск новостей на бесконечном вертикальном экране.  Потом по главной торговой улице  не торопясь шёл в контору. Идти по улицам Сингапура само по себе было для него наслаждением.  Там в раскалённой вышине тропического неба горела  на гигантском  табло невообразимая цифра актуальной температуры - свыше пятидесяти.  Внизу же, в чащобе зарослей и цветочных кустов, жара совсем не ощущалась.  Километра четыре шёл он в струях свежайшего прохладного воздуха, дувшего из бесчисленных кондиционеров прямиком на прохожих. Небоскребы, прозрачнейшие и легкие - не Нью-Йорк, закрывали своими ажурными телами улицы от прямых солнечных лучей. Водопады зелёной воды лились широкими потоками с  верхних этажей многих зданий, рассыпаясь над тротуарами мириадами сверкающих капель, нежно охлаждающими кожу. Перед каждым входом в магазины, салоны, офисы автоматические ароматизаторы обдавали прохожих запахами роз, апельсинов и сладкой морской тины. Весь центр   был пропитан тончайшими благовониями.  И при этом, хоть и шёл он в довольно плотной толпе, городского шума почти не было слышно.  Ни топота ног, ни плача ребёнка,  ни мата  русских туристов, ни музыки из окон, ни сирен полиции и врачей, ни гула кондиционеров. Легко шелестели шины. Подсвистывали птички.  Там  наверху, в верхушках небоскрёбов и пальм, постанывал жаркий ветер. Изредка от океана доносились отзвуки далеких гроз. И над всем этим тихим и блаженным звуковым фоном висел в воздухе легкий многоголосый звон «колокольчиков». Это звенела  «кольчуга» из металлических пластинок,  которой  укутаны  фасады многих сингапурских строений. Дрожа и переливаясь от легчайших дуновений ветра, эти чешуйки визуально создавали  ощущение гигантской океанской волны, накрывающей город. Никогда и нигде такого не видел. Вот бы нам в Коммунарку. Он немного устал. Слишком много было впечатлений. Хотелось  курить.  Вот это было проблемищей. Конечно, где-то в лабиринтах гигантского города власти отвели уголки для прокаженных, желающих подымить, но как эти резервации найти. Спрашивать он побаивался. Могут не так понять. Он, конечно, знал, что за курение на улице или даже на собственном балконе, за брошенный неосторожно окурок или спичку, за  бумажную салфетку, упавшую на асфальт, за жвачку, не важно, за щекой или в в сумке, а уж про жёванную и не говорю, за плевок на землю, за кашель и насморк, за … - непременно последует  оглушительное наказание. Это, понятное дело, он знал хорошо.  Знал и то, что лет десять назад за окурок или жвачку могли по суду и расстрелять. Сейчас уж вряд ли распнут, но рисковать он был не склонен. Вытащил из кармана расплавившийся леденец, с трудом отодрал от него липкий фантик. Огляделся в поисках урны. Не обнаружил, скатал фантик и засунул его в карман, где склеились и растворились уже с десяток таких бумажек. На белых шортах расползалось под карманом желтое пятно.  Как бы не придрались! Он посмотрел на часы,  уже опаздывал, слишком долго любовался океаном. Надо бы прибавить ходу.  Заспешил, занервничал. Огибая толпу туристов случайно шагнул на проезжую часть. Совсем немного, ну полметра - метр. Слегка взвизгнул автобус, его объезжая. Тут же из кустов появился полицейский и укоризненно ткнул в него пальцем.  Наш герой  сделал резкий шаг к тротуару, споткнулся, схватился за грудь и медленно стал оседать, заваливаясь влево. Сингапур, 2019"}, {"title": "Недавний сон", "date": "24 декабря 2021", "categories": "Рассказы", "file": "post/037.html", "text": "Перед поездкой в Москву  в праксисе доктора Витмана сделали мне две прививки. Одну  против гриппа, другую от воспаления легких. Кололи в обе руки, в предплечья.  Куда-какую  кололи  не знаю, не интересовался. Через день правое предплечье покраснело, опухло, стало нестерпимо болеть.   Полезла температура.  Ночь была мучительной, никак не мог пристроить больную руку. Стонал, выпуская из носа дребезжащий храп. Перед рассветом пришел Бог, который именно я не разобрался.  Жалюзи были почти закрыты и во мраке полоски света от уличной рекламы проявляли только складки плаща да кончик носа. Сказал шепотом – «чего звал?»  «Болит сильно,  мочи нет!» - «Терпи, скоро кончится».   Помолчал, вспыхивая кончиком носа, я уснул Утром разбудила жена – «Живой?  Чего орал всю ночь?» - «Орал, не помню» - «Иди, кофе готов» - «Полежу еще» Пошевелил рукой, болит, но, вроде, меньше. Чего он имел в виду, что скоро кончится?  Боль, жизнь?  А  «скоро» - это как?  Завтра тут или послезавтра в Москве?  Или год-другой ещё есть. Надо спросить, если  появится  вновь? Оценил себя с удовольствием -  самообладание, спокойствие поразительные.  Напрочь никакого удивления или испуга.  Точно  знаю,  что не звал. Бывали в жизни минуты,  когда звал надрывно, неистово, с плачем  и крестным знамением. Жизнь бы отдал, что б  он проявился. Но  не  этой  ночью.  Приснился?  Ха!  Да  так подробно,  реально…  и  утром  не  исчез,  остался  в памяти  ясно, четко.  Невероятно.   К  чему бы?   Надо бы записать, но, вроде, и записывать нечего - мигающий нос да «скоро кончится». С трудом проволынил день. Боль утихала только при  ходьбе, ни сесть, ни лечь.  Еле дождался ночи. Подложил кучу подушек, кряхтя и постанывая  пристроился, жалюзи не закрыл. И тут же уснул. Мгновенно! Такого не было никогда. И впервые за десятилетия увидел продолжение сна,  2-ю, так сказать, серию.  Теперь цветную,  с шумами и музыкой, с сюжетом и смыслом.  И что замечательно, не просто увидел, а, как окажется  утром, запомнил и смог  записать. Это стало для меня шоком.  Невероятно. Быть не может! Объясню.   В принципе,  у  меня  паталогическое беспамятство. Зрительная память  отсутствует вообще, слуховая была в юности, кажется, хорошей, по крайней мере, мог проигрывать в мозгу множество симфонических произведений, реально их слыша, но годам к сорока эта способность совершенно разрушилась.  Про память на запахи  ничего сказать не могу, не помню.  Сейчас, естественно, никакой. Лет до тридцати была уникальная способность к ориентации в пространстве, и на натуре и на чертежах любой сложности.  Когда-то отправился пешком, один, без карты, компаса, теплой одежды, еды  и каких-либо подсказок через Эльбрус и несколько перевалов из Теберды в Сухуми. И дошел. Ни один инструктор альпинизма, не верил, что  городской мальчишка один дошёл, не заблудился. В пятьдесят я со страхом понял, что совершенно не  ориентируюсь в пространстве, теряюсь и не могу найти дорогу  даже по карте. Теперь без навигатора не рискну съездить даже в Баден-Баден, хотя дороги туда всего две-три и изъездил я их достаточно. И, конечно, я никогда не запоминал снов. В лучшем случае и крайне редко, проснувшись мог полчаса помнить, что  было что-то  интересное, хорошо закрученное  и исполненное.  Через полчаса уже не соображал - что именно снилось, что за сюжет, что за люди, зачем...? Ох, какими усилиями я пытался сканировать память, собрать расползающуюся историю, восстановить картинку и звук.  Но с каждой утренней минутой  всё стремительно бледнело, утончалось, безвозвратно разлеталось, сверкнув на прощание гранью или сколом.  Через полчаса оставался только привкус.  Потом и он исчезал. Запоминались  злость и разочарование от невозможности  собрать осколки.  Впереди всегда был испорченный день. Однажды, лет тридцать назад, внезапно приснилась,  и очень в деталях, какая-то  невероятная  пьеса, изумительно  сочинённая  и  замечательно  разыгранная. Что-то шекспировское на фоне изумрудной лагуны. Я в полном восторге заставил себя посреди ночи проснуться, включил свет и все  подробно записал,  даже тексты песен,  мелодию, костюмы, декорации.  Перечитал, сделался  счастливым  и лег досыпать.  Естественно, что проснувшись счастливым поутру тут же выяснил, что просыпался и записывал  я свою гениальную  пьесу тоже во сне, что никакой реальной записи не существует, а уж что  там привиделось и записывалось не помнил  совершенно.  Помнил только восторг проснувшегося во сне меня.  Горевал несколько  дней. Или лет. Вернёмся в старость. Тут-то,  теперь,  я проснулся наяву, не во сне, и всю ночную историю с Господом в плаще помнил. И зрительную и слова. Правда, края уже расползались, исчезали в дымке... Немедленно зафиксировать!  Всё  в сторону - больную руку, кофе, чистку зубов.., все потом. Записать стремительно тающую картину. Записал.  Перечитал. Удостоверился, что делаю это в реальности конкретно я - конкретно сегодня, конкретно у себя дома, конкретно на конкретной бумаге и ... потерял сознание. Температура подскочила до сорока. В беспамятстве провалялся три дня.  Очнулся.  Сон, естественно, забылся, но что я его,  преодолевая боль,  записал, помнил твёрдо.  Помнил и волшебное послевкусие от записи и радостное предчувствие встречи. Но куда  записал, где та бумага – не помнил, найти не смог. Продолжаю искать. Карлсруэ, 2008"}, {"title": "Зеркало", "date": "16 мая 2023", "categories": "Рассказы", "file": "post/038.html", "text": "Немец развел руками – Извините, я же предупреждал. –  Острие гвоздя проткнуло стенку над кроваткой, обсыпав её известкой и обрывками обоев. Извлечь гвоздь обратно было затруднительно. Из инструментов пленному выдавали только топор для подгонки паркетных досок, линейку и огрызок химического карандаша. Обухом топора он и прибил, по маминой просьбе, полочку в кухне. Гвоздь, как немец и предупреждал, проткнул тонкую стену и теперь глупо торчал ржавым остриём в стене детской комнаты. Тощий бледный конвойный постучал по стене кулаком и засомневался, стоит ли выбивать гвоздь, – Может не выдержать, гипсовая, повесьте тут картинку или зеркало, а фрица мне надо забирать, грузовик внизу, у нас конец рабочего дня.– Мама удрученно пожала плечами, сунула в руки немца газетный кулёк с «благодарностью» - варенная картошка, яйца, пара луковиц, кусковой сахар… Пожилой военнопленный ответил ей кивком головы, смущенной улыбкой и мычанием чего-то немецкого. Ребёнка он погладил по макушке, уронил в кроватку выструганный из паркетной доски игрушечный домик и помахал на прощание трехпалой рукой. На следующий день, предполагаю, пошли мы с папой на Сенной рынок покупать что-нибудь для маскировки гвоздя. Толкучка шевелилась на задах рынка у выхода на Фонтанку. Чем только там не торговали. Многие вещи я видел впервые и не представлял себе – что это и зачем. Но слово «зеркало» уже знал, знал про странный мир, в котором обитал мой двойник за сияющим стеклом – разглядывал в детсаду, в главном зале ДЛТ, у мамы на работе… На зеркале я и настоял. Возможно, использовал слёзы. Круглое в металлической раме, почти чистое и целое, только в самом низу с небольшой трещиной, зеркало отец выторговал у безногого инвалида за, как представляется, пару немецких марок, которыми расплачивались с мамой работавшие на строительстве нашего дома пленные. Мама покупала для них продукты и что-то кулинарила.  Марка тогда шла при обмене по пятьдесят копеек и была весьма ходовой валютой. Зеркало долго крепили на торчащем острие, прикрутили изолентой и снизу еще подстраховали двумя маленькими гвоздиками. Гвоздь от кухонной полки пробил стену в детской высоко и потому зеркало повесили ближе к потолку. Себя в зеркале я видеть не мог. Я до него долгие детские годы не дотягивался, даже подпрыгивая сначала в кровати, потом на сменившем кровать диване. Всё равно не доставал. Отражалось в зеркале лишь небо за окном. Повис таким образом прямо над кроватью овал в металлической витой оправе с утренним солнцем или ночными звездами, с облаками и тучами, с колышущимися завесами дождя или снега, вихрями пыли и дыма от горящего во дворе мусора, кружащими ветром желтыми листьям, воздушными шариками на первомай или обрывками ноябрьских листовок да газет. Окна наши выходили строго на восток. Поэтому совсем в прошлом повесили на зеркало тёмную, сдвигающуюся вбок, завесу, чтоб солнце не будило младенца слишком рано. И первый ритуал моей памяти – «открытие неба», когда кто-нибудь, мама, папа или сестра, сдвигали занавес и жизнь моя худо-бедно освещалась. Всю жизнь я поэтому боготворил театральный занавес, какую бы ерунду и скуку он не скрывал.  Иногда, и к старости всё чаще, моментом раскрытия занавеса мои впечатление о мире за ним исчерпывались. Дальше было неинтересно, не запоминалось. И задёргивание тряпочки я почти никогда не дожидался, засыпал. Ритуал «открытия» иногда не совершался, что значило, что я был болен, а болел я часто и тяжело. Тогда просто лежал под закрытым зеркалом и сочинял, иногда вслух, «пьесу», за завесой происходящую. И ждал, ждал «открытия». Чёрт его знает, возможно, моя «живучесть» этим бесконечным ожиданием и объясняется. Натренирован. Ближе к школе ритуал сам собою исчерпался. Отец переехал к другим окнам и занавескам, маме по утрам стало совсем не до того, да и у сестры времени на меня поубавилось. Мир надо мной больше не закрывался и навсегда остался в детской памяти овальным, чуть дрожащим на тонкой стене, отражением, со сдвинутой вбок, на всякий случай, темной стареющей шторкой. Потом я дорос до зеркала, правда редко в него заглядывал, еще реже вытирал на нем пыль, потом от него уехал, потом мне написали, что оно сорвалось с гвоздя и разбилось. Я, не очень и расстраиваясь, забыл про него, тем более мир вокруг становился всё цветастее и зеркальнее. Жизнь прошла быстро. Солнце всплыло над крышами.  На голых ещё ветвях сирени вспыхнул неоновый фейерверк - диски СD, развешанные соседскими детьми, качнулись на ветру, полыхнули под солнечными лучами ослепительно красным, зеленым, синим. Разбежались по стенам комнаты разноцветные зайчики. Зашевелились по тюлю тени ветвей и набухших почек. В круглом зеркале на дальней стене старик взглянул на себя и почувствовал какое-то дежавю, себя не сразу узнав. Старость – это расстояние между тобой и твоим отражением в зеркале. С прожитым расстояние увеличивается, подойти и дотронутся до себя становится все труднее. Тот старичок напротив всё более становится чужим, плохо узнаваемым, странным.  Связь между нами всё менее очевидна. Потому, наверное, зеркала в финале завешивают, отворачивают, выносят.  Чтоб разошлись с миром. С такой первой утренней мыслью он спустил с кровати ноги, ухмыльнулся типу в зеркале - скрюченная фигура, выдвинутая вперед голова, поднятые к шее плечи, отвисший нос, набитый чем-то живот..., нащупал шлепанцы и, подождав для стабилизации равновесия секунд десять, начал процедуру подъема. Удалось сравнительно быстро. Хотя, смотря с чем сравнивать. За окном светила весна, солнечные пятна качались на стволе сосны, тощая белка пыталась их поймать, но увидев его у окна, испуганно дернулась, оттолкнулась сразу четырьмя лапами
