ть - летают тучами, всю мелочь изгнали, стены домов продырявили (и об этом я уже писал), засрали все. Именно тут скандальный патологоанатом  фон Хагенс создал невероятный Театр трупов, с которым ездил по миру, шокируя человечество. Здесь столица мировой типографской техники, отсюда пошла современная строительная индустрия. Входит Хайдельберг в пятерку обязательных для посещения  туристских городов Германии, особенно для японских и американских путешественников. Есть тут чего сфоткать. Во время Войны избежал он обязательного для немецких городов уничтожения, потому сохранил настоящую древность своих строений и памятников. Про невероятный гуманизм союзной авиации, облетавшей город стороной, есть несколько версий. Одна, самая простая и логичная - американцы планировали здесь южный штаб своих войск и хотели служить в комфорте и красоте. Огромный кусок города, почти треть, занимала до недавнего времени американская база. Лет пять назад они ушли и городские власти ломают мозги, придумывая как эту плешь заполнить. Другая версия, мне она нравится больше, обьясняет чудо спасения замечательным анекдотом - Нобелевские лауреаты, учившиеся здесь,  обратились к Рузвельту с просьбой пощадить альма-матер. И тот снизошёл, запретил бомбежки всего района Неккара из уважения к Университету и его американским выпускникам. Так что, если написано на фасаде, что дому этому шестьсот лет, то вполне возможно, что так и есть. И если древностям  всей остальной Германии на самом деле не так уж и много лет- ну, семьдесят максимум, то в римском пригороде Хайдельберга  камушкам действительно веков по двадцать- тридцать.  И самые большие руины Европы над старым городом действительно взорвал Наполеон, а не «Дуглас». В горах Хайдельберга выросло в тридцатые движение «Гитлерюгенда» и до сих пор местные фашисты - серьезная сила. Многие видные поместья на склонах и в центре города принадлежат нацистским студенческим братствам. На олимпийском стадионе над городом каждый год в день рождения вождя  собираются многотысячные толпы в чёрном. Авто моего сына, активиста антифашистского студенческого союза, не раз громили и разрисовывали неизвестные. Дочь Геринга, проживающая где-то тут, наотрез отказалась встречаться с «русскими свиньями», когда мы запросили у неё интервью для фильма о детях нацизма. Рванет это когда-нибудь обязательно. Найдутся ли Нобелевские лауреаты, что бы ещё раз спасти Хайдельберг? Тут же, прямо под моими окнами, в долине перед горной цепью, трудится многокилометровый университетский огород, на котором урожаи снимают каждую неделю. Снимали. И в огороде осень. Много  лет назад мы поселились на обочине этого невероятного мира.  Среди многих десятков тысяч  преподавателей, студентов, врачей и пациентов  «жильцов» тут было двадцать - тридцать человек, не больше. Из более 800 строений этого «марсианского»  мира только три - жилые частные дома. Так исторически случилось. В одном мы пообитаем ещё несколько дней и уедем. Прощай, Хайдельберг! Из огромного текста предыдущей публикации, который, признаюсь, с трудом осилил, выделил бы «Гейдельбергские Правила» Менделеева, которым интуитивно, оказывается, следовал. Вот эти правила: 1. Не умничать ... Не предаваться желанию... 2. Знакомых много не иметь. 3. Работать и гулять… P.S.       Из моей коллекции невероятных совпадений одна история связана с ХД. Пару лет назад болезнь руки привела меня в Бангкокский госпиталь, входящий по классификации ООН в пятёрку лучших медицинских учреждений мира (писал об этом). Профессор, меня консультировавший, сказал, что есть только два места в Европе, где мне смогут помочь - Израиль и одна клиника в Германии в Хайдельберге. Дал адрес и направление. Стоило ехать через полмира - вход в нужную клинику был напротив моего дома."}, {"title": "МУ", "date": "26 декабря 2021", "categories": "Царапины на памяти", "file": "post/040.html", "text": "Состоял я с институтских времён в «полуподпольной» национал-революционной организацию МУЛИБО. Членов в ней было три - два полуеврея да один полный. Каждый принёс в организацию частицу своей фамилии.  За заглавное «МУ» отвечал у нас  Борис Муллокандов, режиссёр Душанбинского телевидения, мы его звали «таджидом», поскольку был он из горских евреев. Отец его, народный артист, оперный  певец, был в своих краях невероятно популярен и уважаем. Магомаев перед ним - тьфу, пацан. Вспоминаю, что поразил меня Борин папа тостом  при первой встрече - «Ничего в мире бояться не надо,  кроме землетрясения. Ну что война, с врагом всегда можно договориться, а при  землетрясении договариваться  не с кем...». Я как раз тогда впервые сильную тряску на своей шкуре испытал. Ночью Душанбе тряхануло на 6 или даже 7 баллов. В секунду все население четырехэтажного дома оказалось во дворе, один я застрял наверху не понимая, что происходит. Вот за мое «боевое крещение» он  тост и поднял. Красив был Боря чертовски. Тонкий, стройный, высокий, весь черно-бело-золотой. Роскошная борода и шевелюра - иссиня чёрные; улыбка в пол-лица - белоснежная; кожа, как у арабского шейха - золотая. Таким сияющим Али-Бабой он прохаживался по ленинградскому театральному институту, собирая восхищенные девичьи вздохи.  И умом и остроумием природа  Борю  тоже не обделила. С такими-то исходными данными делал он стремительную карьеру и в жизни и в профессии и в спорте – был волейбольным судьей союзного масштаба. Было одно но. Сначала вполне пустяковое. Барахлил у него один из сердечных клапанов. Всенародный папа поднял на ноги всю советскую медицину.  С годами ситуация ухудшилась. Стали его в Кремлевке готовить к операции по вживлению искусственного клапана. Не делали ещё в СССР такие операции, три года его тщательно готовили, тренировали и исследовали. Специально для него особый клапан мастерили. В Москве он обитал месяцами, я как-раз в Москву из Ленинграда перебрался и мы сильно сблизились. И 21-го марта 77-го положили, наконец, его на операционный стол.  Перед началом операции он мне позвонил, поболтали, пошутили, велел на саму операцию не приходить и отца не пускать. На следующий день с утра звоню в клинику - Боря умер. Вывозили его из морга в открытом гробу. Глаза его были полуоткрыты и мне все казалось, что он подмигивает. После отправки тела на родину палатная сестра мне рассказала - операция шла долго и прошла блестяще. Хирурги были в восторге, все друг друга поздравляли, прямо в операционной стопочки опрокинули - столько диссертаций можно было победно завершить. Ликуя и покачиваясь покидали они операционную, забыв указать старшей сестре, что надо прооперированного поместить в барокамеру, что б легкие запустить. Через какое-то время спохватились, но было уже поздно. И ещё одно было, что до сих пор скребёт на душе, не отпускает. В последнем нашем телефонном разговоре, вечером 20-го,  он прощаясь помолчал и почти шёпотом сказал следующее,  помню и паузу и слова и голос - «Знаешь Миша, бреюсь я сейчас перед операцией  и в зеркале за моей спиной стоит Рузи, она мне машет, зовёт. Вижу совершенно отчетливо». Сказал и повесил трубку. Рузи - его душанбинская подруга, умершая за два года до этого. Я ее  тоже хорошо знал."}, {"title": "О творчестве", "date": "24 декабря 2021", "categories": "Телевидение", "file": "post/041.html", "text": "Несколько лет назад,   когда начал я пользовать  Фейсбук в качестве «записной книжки» для своей обветшалой памяти, опубликовал я и эту запись. Повисела она на моей страничке в качестве анекдота, пособирала лайков и ухмыляющихся рожиц.  Но тут в одном  из комментариев  неожиданно объявился очевидец описываемых событий  и их подлинность подтвердил. Итак, О ТВОРЧЕСТВЕ Откуда в моем мозгу появилась эта история, не помню. Пытаюсь вспомнить, сопоставляя даты и факты, ноль результата.  Давным  давно поселилась она  в голове и всё.  Вряд ли я сам был свидетелем нижеизложенного, но почему-то с самого начала был уверен, что это не просто анекдот. Скорее всего, случилось это в начале шестидесятых, ну  может быть, в конце пятидесятых.  Киноотдел ленинградского телевидения снимал плановый «фильм-концерт» (такой жанр для сметы) про медвежий цирк Филатова.  Почему-то  кажется, что режиссером фильма мог быть Ермаков или Цуцульковский,  или Окунев, или кто-то другой из легендарного  списка режиссеров Лентелефильма, а про оператора-постановщика и гадать не буду, назову просто «N», что б кого-нибудь не обидеть. Был  «N» человеком солидным - фронтовой оператор, тщательный, настойчивый, «творческий».   Очень его беспокоила «банальность» номеров, снимаемых для фильма. Ну, медведь на автомобиле, на велосипеде, на мотоцикле, на коньках... было, было, было. И вот  прибегает он как-то поутру в контору,  невыспавшийся и возбужденный,  и сообщает, что придумал трюк мирового уровня. Никогда и нигде такого не было и близко - медведь парашютист. Очень идея всем понравилась.  И Филатову, и режиссеру  и руководству Студии,  и  бухгалтерии телецентра, особенно, когда той объяснили, что будет медведь прыгать с бесплатной парашютной вышки. Нашли такую в приморском парке Победы.  Договорились. Дождавшись нужной по ветру и свету погоды, устроили туда киноэкспедицию. Сами приехали и, естественно,  привезли нужного медведя да ещё  с дублером, на всякий случай. Расставили вокруг вышки диги, мощные такие «дуговые» светильники,  две - три  камеры поставили - на общий и крупные планы.  Затащили  с помощью палок и вкусной еды медведя наверх, на двадцатипятиметровую высоту,  и привязали к нему парашют. Свет врубили, ждут команду оператора. А тот бегает под вышкой, ищет точку для ручной камеры, для оригинального ракурса. Нашёл наконец,  лёг на землю, а свой аппарат с дорогущей оптикой направил в небо на красиво подсвеченные облака. Рядом  режиссёр прилег. «Давай», кричат. Как  бедный медведь не сопротивлялся, но столкнули его с верхней площадки и пошёл он медленно планировать вниз, как раз к нужной для хорошего кадра точке над камерой.  Летит, орет от испуга. «Превосходно» - ликует  режиссёр. Даже осветители зааплодировали, что бывает нечасто. И тут от всего пережитого случилась  с медведем, понятное дело,  медвежья болезнь  и в самый-самый неподходящий момент. Как раз в нужной точке. И многие  килограммы жидкого медвежьего помёта хлынули с неба и на режиссера, и  на оператора, и на камеру с ее  дорогущей оптикой... Дубль делать не стали, не решились. Заканчивал я всегда эту историю пояснением, что она -  «про творчество».                           Почему я так говорил, ума не приложу, не помню."}, {"title": "Текст", "date": "26 декабря 2021", "categories": "Рассказы", "file": "post/042.html", "text": "Постоянной боли не было, слава Богу. При приступах, участившихся в последние дни, он хватался за ногу и изо всех сил колотил ступней по стене. Боль отступала. Далеко ходить  не мог уже давно. Да центра города дойти, как это бывало ещё год назад, и не думал. Так, вокруг ботанического сада или зоопарка. Пару километров за час. Иногда через стекло утыкался в медвежью морду, вольер подступал прямо к дороге, тот подходил вплотную и долго смотрел зрачок в зрачок. Несколько раз падал, сильно разбил лицо, порвал одежду и потом боялся делать большие шаги, это и ходьбой нельзя было назвать. Так, шаркание. За руль почти не садился. Раз в неделю, до магазина. Особо думать было не о чем. Ничего особенно нового в его самоощущениях  не появилось. Такая же сонливость, постоянная усталость, слабость всего. Но мысль, что осталось недолго, уже из головы не уходила. Собственно, она одна в голове и сидела, почти в одиночестве. Остальные мысли проскальзывали, надолго не  задерживаясь и ни на чем особо  не настаивая, мол, нет так нет. «Надо бы новую обувь на липучках купить, чтоб не нагибаться. А этих разве не хватит? Да, пожалуй, и этих хватит». Смотреть телевизор было  утомительно. Не смотрел. Русские новости раздражали. Даже не содержанием, он и не вслушивался, а самим звучанием, скоростью бодрого говорения, бесконечным жужжанием дикторов, занудность гудения экспертов и чинуш. Пару раз начинал смотреть громкие сериалы. Бросал после первых двух-трёх серий. До конца выдержал только Соррентино. Даже возбудился и пару дней улыбался. Жена на кухне частенько включала захлебывающегося Венедиктова с невыносимо безмозглым  Бунтманом, или экающего Быкова.  Уже и не раздражался, просто поплотней закрывал дверь. Фейсбук и Телеграм перелистывал по утрам, особо ни на чем не задерживаясь. Правда открыл для себя несколько, в основном ленинградских, фотографов.  С немыслимыми для его юности ракурсами и качеством. Зачем-то перенёс понравившиеся городские пейзажи  в свой фотоархив. Поймал себя на нелепости действия, но удалять не стал. Интересно почему? Ещё три года назад, впервые серьезно подумывая о финале, очень беспокоился о следах своего существования. Хотел кардинальной «зачистки». Была, во первых, куча стыдного, которую хотелось бы поглубже зарыть, во вторых был довольно объемистый архив бессмысленных бумажек, который хотелось бы уничтожить самому, не оставляя эту болезненную процедуру близким. Было и желание как-то поотчетливее зафиксировать свою персону, без лишних глупостей и подробностей, покрупнее, покрасивше,  поумнее. Для этого надо было с архивом разобраться, большую часть выкинуть, что -то оставить и в нужном виде сгруппировать и подкрасить. Пригодился Фейсбук. Показался удобной записной книжкой. Стал выкладывать семейные фото, вспоминать сопутствовавшее, скоблить память. Привык к почти ежедневным публикациям.  Причём, с любопытством открыл - публикация равна стиранию. Написал, «повесил» - и голова пуста.  Потом и это надоело. Да какая разница. Впервые за 13 лет попугаи признали его за своего, стали садиться на подоконник, заглядывать в комнату. Наконец-то  разглядел он зелено-желтые физиономии с красным ожерельем вокруг шеи.  Пузырьки глаз, правда, совершенно пустые, дурацкие. Но наклоны головы, щелканье массивным клювом, ужимки и топтание на месте, выдают какой-никакой интеллект. Пробует с ними поговорить. Слушают, не улетают. Может вместо надоевшего Цукерберга оставшиеся ещё в памяти истории излагать этим тварям!? Он решил «подумать» эту интересную мысль. Хайдельберг, 2019"}, {"title": "Эрик Малинин", "date": "27 декабря 2021", "categories": "Телевидение", "file": "post/043.html", "text": "Присмотримся.  Никак по другому человек с такой фамилией выглядеть не может. Именно у Эрика - авторские права на мировой скепсис в такой упаковке.  Подслащенный вековой интеллигентностью прищур лишний раз предупреждает, договориться с  этим милым человеком, по любому поводу, - занятие проблемное. Эрик сразу не верит никому и ничему. Скепсис угнезден не только в его сократовском черепе, но и во всей постановке тела. Он сомневается во всем, что видит не через рамку  видоискателя.  Сильно раньше, ещё в прошлом веке,  хотя бы фотографическая бумага, проявленная и отфиксированная проверенным способом, являлась для него аргументом.  А сейчас и не знаю, каким способом договаривается с ним современный люд.  Впрочем, технический  прогресс Эрик всегда опережал на пару шагов и именно у него можно было узнать новости о компьютерном железе и монтажных программах. И его данные всегда были абсолютно точными и проверенными. Уже порядочно давно Малинин выступил моим практическим конкурентом на рынке музыкальных съёмок, режиссуры и компьютерного монтажа. Хвалить его за это не буду, не знаю, сколько хлеба он у меня отобрал. Но признать, что он это умеет и может, как немногие, должен. Горжусь несколькими комплиментами Эрика в свой адрес. От человека, пронизанного скепсисом с макушки до пят - это дорогого стоит. Как и с остальными корифеями этой четверки, меня с Малининым связывают годы общей работы, некоторых побед, грустных и веселых приключений, искреннего интереса к профессии  и прочие мелочи и важности, что, собственно, и являлось важнейшей частью моей московской жизни.  Спасибо, ребята! Здоровья ! А там посмотрим"}, {"title": "Корейский сервиз", "date": "24 декабря 2021", "categories": "Рассказы", "file": "post/044.html", "text": "Ночью в шкафу чуть задребезжало. Корейский кофейный сервиз, перевидавший за свои три века всякого, потрясла новость - «К нам едет оценщик». «Как оценщик! Какой оценщик!” Новость могла значить что угодно, но сразу заподозрилось худшее - продажа и, значит, неопределенность и возможная катастрофа. Вся фарфоровая семья за последние лет семьдесят так свыклась и с уютным зашторенным шкафом, прибывшим в Москву в победном сорок пятом прямиком из Вены и частенько долгими зимними ночами проскрипывавший им свои шенбургские детские воспоминания. И с немного кривоногим венским же столом, пахнущим настоящим альпийским дубом и имевшим в своём брюхе под столешницей потайное отделение, о котором даже хозяева не подозревали. А таились там всего-то треснувшие, уже позеленевшие, костяные палочки, облизанные еще в фашистской Австрии. И с уютно тёплой, даже в зябкие осенние вечера, верандой они не мыслили расстаться и с огромным стеклянным абажуром Тиффани, световой конус которого столько раз высвечивал всю хрупкость и статность их фигур и обводов. И с грозной картиной над столом в массивной резной раме - «Гроза в молдавских лесах» кисти псевдопольского живописца, которая однажды сорвалась с крюка и рухнула на всё фарфоровое семейство, вольготно расположившееся на ажурной шелковой       скатерти в ожидании гостей, они не предполагали расстаться. Правда, пару сестёр они тогда потеряли вместе с пузатой сахарницей. Склеить осколки не удалось, как хозяева не старались. С тех пор пострадавший сервиз не очень любил настенную живопись и всякие упоминания о Молдавии, хотя к зловещей опушке и черному небу над ней привык и даже находил некоторое изящество исполнения. Впрочем, насладившиеся кофеем гости разговаривали все больше об Иерусалиме и Мытищах, иногда о гастрономе на Пушкинской и о разных других малоинтересных вещах. Хозяева, сами люди тонкие и образованные, щадили тонкостенные натуры и особо горячего кофе в чашечки не наливали. Мыли семейство в тёплой воде натуральным персиковым мылом мягкой бархатистой тряпочкой и близко злодея кота Моисея не подпускали. Тот мог только издали выпускать когти в сторону золотых рыбок, просвечивающих сквозь тончайший фарфор настоящего корейского мастерства. Шкаф, в котором они отдыхали в свободное от гостей время, крепко закрывался, и злобный Моисей только и мог, что точить снаружи когти о его створки и облизываться. Так что перспектива смены хозяев и среды обитания, после многих десятилетий понятной, привычной и почти комфортной жизни, корейский сервиз привёл в отчаяние до дрожи. Оценщик появился перед стеклом шкафа внезапно. Шторки сдвинулись, с легким скрипом распахнулись створки и лоснящиеся щеки постороннего нависли над семейством в одно хмурое и безжалостное утро двадцать первого века. Сначала он, не отрывая ещё сестёр от блюдец, пощелкал по их стенкам грязным расщепленным ногтем и навесил над ними огромное волосатое ухо. Звук, растекшийся по внутренностям венского шкафа, был божественным - высоким, серебряным, поющим. Даже по вибрирующим щекам оценщика стало понятно его изумление и полное восхищение. Он чуть порозовел и уже шевелиться над полками продолжил с некоторой осторожностью. Подняв одну за другой со своих блюдец узкогрудые чашечки, он вынес их из шкафа, повертел, подняв над собой, потом рассмотрел то одним глазом, то другим на просвет, носом в красных волдырях понюхал, поставил на столешницу и зачем-то покачал туда-сюда. Очевидно, проверил устойчивость к возможным ураганам и землетрясениям. Потом он спустил с полок тарелочки, поскрёб их позолоту ногтем мизинца, попробовал кромки на зуб и осторожно покатал блюдца, поставив вертикально, по столу. Такую издевательскую процедуру ошарашенное семейство до сих пор и не видело. Напряжение нарастало. За чашками последовал кофейник. Клеймо на его донышке оценщик оценивал несколько долгих минут. Он крутил стройный кувшин, отодвигал его от глаз и приближал, включал и выключал лампочки Тиффани, рассматривал оттенки и проблески иероглифа, накрывал фарфоровое тело сосуда крышечкой и легко тряс его, выслушивая чуть заметное дребезжание. Последним вынырнул из шкафа молочник. Детального рассматривания, впрочем, он не удостоился. Вещь и вещь! Итак, вроде, понятно, что ценная, не хуже остального. Всё, уцелевшее в бесчисленных кофепитиях, застольях, празднествах и ссорах, семейство замерло на огромной поверхности венского стола, вокруг которого стали нарезать туда-сюда круги хозяева и какие-то люди, пришедшие с оценщиком,                                                                                                  зловещие, шумные и малоприятные. Они о чем-то мрачно и быстро все разом говорили на уже полузабытом, кажется, немецком, качали неприятно постриженными головами, тыкали в семейство пальцами и мимикой узких, идеально выбритых, подбородков выражали явное свое чем-то неудовольствие. Появилась у фарфорового семейства надежда – не сговорятся, не продадут, не заставят переезжать. Но судьбу, как мы все пожившие знаем, не перехитришь. Толстый кот Моисей, огромный и противный, воспользовавшись общей неразберихой и замешательством, выпрыгнул из-за спины хозяина, рухнул всеми лапами на столешницу, отчего все семейство подпрыгнуло и частично опрокинулось, сгрёб мощной лапой все чашечки и блюдца в одну кучу и добравшись наконец до золотых рыбок мгновенно когтями и зубами завершил функцию молдавского леса, напрочь раздавив и измельчив на белоснежные кусочки всю эту корейскую запредельную красоту. Остался в «живых» только дремавший в стороне молочник, который особо стройно и изящно высился теперь на фоне переливавшихся под светом Тиффани осколков белоснежного фарфора и золотых иероглифов. После долгих криков и последующей тишины молочник подняли, долго носили по дому в поисках пристанища, и наконец вернули внутрь шкафа, где, думаю, в тишине и одиночестве он и проживет оставшиеся человечеству десятилетия. Царицыно, 2002"}, {"title": "Случайные утренние заметки", "date": "24 декабря 2021", "categories": "Рассказы", "file": "post/045.html", "text": "Первый лайк появился в пол-одиннадцатого. Потом, через минут пять, второй. Он подождал, больше лайков не появлялось, нехотя сел, спустил ноги, нащупал ногой под кроватью халат, подтянул его, поднял с пола и накинул на себя. Сходил в туалет и прямо в халате сбежал вниз во двор - мусор выбросить да сигарет у дворника занять.  Пробыл на улице минут десять и побежал к себе - не налайкали ли ещё? Нет, только те два отрубленных кулака так под фотографией и синели. Он, естественно, не стал планшет выключать, просто положил его на подушку и пошёл на кухню завтракать. Сварил пару яиц, намазал хлеб баклажанной икрой, две дольки чеснока почистил, подумал и одну чищенную засунул в холодильник, предстояло ещё в конторе показаться, давно не показывался, а зубы чистить нечем. Всё забывал купить пасту. Из комнаты от подушки звякнуло - он быстренько, засовывая в рот сразу два яйца, рванулся к кровати - третий лайк возник в чате. Аватарка была незнакомая - какая-то лысая девушка. Он тут же налаженным щелчком отправил аватарку в «друзья» и не спуская глаз с экрана, пятясь, отошёл к шкафу, из которого наощупь достал почти свежую рубашку. Экран больше не шевелился - три синих пальца так и торчали в правом углу под его последним творением - селфи с огромной, заполненной пенистым пивом, кружкой, из которой он пытается отсосать пену тоненькой коктейльной трубочкой. Шутку он заимствовал у одного китайского «друга», с которым сеть его совокупила уже недели три как. Под той китайской «шуткой» стояли сотни две лайков, просто синий лес пальцев и азиатских иероглифов, а вот московская реакция была какой-то реденькой и бессловесной. Он ещё чего-то подождал, натянул носки и застегнул ширинку, потом засунул, не выключая, планшет в рюкзак, взмахом покрывала захлестнул кровать, мать могла прийти и орала бы на беспорядок, поискал ногой под кроватью ключи, нащупал и побежал на кухню допивать вчерашний растворимый кофе. Тут в рюкзаке свистнуло-брякнуло. Пришло что-то личное. Пришлось рюкзак расшнуровывать, доставать планшет. Но гаджет не доставался, поскольку зацепился в глубине за вчерашние, ещё влажные, трусы, которые он после сауны с друзьями вытащить из рюкзака забыл. Все внутри рюкзака оказалось, кстати, влажно и склизко. Планшет тоже. Потому-то он и скользил и вытаскиваться отказывался. Долго возился, наконец справился и вытащил за уголок, сумев не уронить. Как раз на мокром экране погасла строчка вызова - новая лысая подружка желала общения, но не дождалась. Пара лайков, между делом, под его селфи прибавились. Пять торчащих пальцев - ещё не успех, но уже и не провал. Он протёр экран подолом рубашки, положил планшет на кухонный стол и решил все ж допить ледяной уже кофе. Глотнул и сморщился. Досыпал в чашку три ложки сахара и отвратительное пойло в себя опрокинул. Чуть не стошнило, но хоть какое-то действие было доведено до конца. Что-то, раньше называемое «музыкой», запело в коридоре. На языке 21-го века это называется «рингтон». Какие-то всхлипы и стоны. Он потыкался по углам, разыскивая источник звуков, с трудом нашёл его в капюшоне куртки, брошенной вчера на стуле, и посмотрев на звонящий номер приложил телефон к уху. Там ему тотчас стали говорить что-то ругательное, судя по его враз осунувшемуся лицу. Он пытался выдавить из себя всякие «но» и «это не я», но его ответы, судя по всему, звонившего не интересовали. Он долго держал айфон, уже, похоже, замолчавший, у уха, потом сел на заваленный одежкой стул и долго сидел почти неподвижно. Если бы было кому к этой неподвижной фигуре присмотреться, то на его щеках можно было бы разглядеть слёзы. Я подумал, что теперь он может вернуться в кухню и съесть уже и вторую дольку чеснока - похоже, идти ему больше было некуда. Москва, 2021"}, {"title": "Заметки путешествующего", "date": "27 декабря 2021", "categories": "Рассказы", "file": "post/046.html", "text": "Вирус летел рейсом 2264 на 22F месте, его укачало и он слегка дремал, особо не прислушиваясь к беседе двух соседей сзади. А там обсуждались темы серьезные. - Понимаешь, это же факт, что, как самостоятельно существующей структуры, ума нет. Нет умных нервоклеток, нет каких-либо умных генов, нет собственно, таких качеств, которые можно определить как ум.  Умный это кто? Это какой?  Толстый - понятно, много сантиметров в талии, горячий понятно - кипишь, еврей понятно - написано же. А умный в чем измеряется? Скажешь , IQ! В метрической системе это где? Как это исследовать и проверять? У Обамы меньше ста, не пускать на выборы? Вирус лениво повернулся, потянулся, задел обнаженный кусок слизистой. Понятное дело, сработал  неврологический синдром носоресничного нерва, посредством чиха вирус эмигрировал в салон и осмотрелся. Над большинством сидений белели, синели и чернели маски на лицах. Пара собеседников розовела пустыми щеками. Шевеля членами вирус спланировал в их сторону. - Почему я умный, а ты дурак, или наоборот. Как расставить таблицу несуществующего? - Ну вот ты - дурак, поскольку так ставишь вопрос… Аргументация этого мыслителя понравилась вирусу больше, он ему  в ноздрю и спланировал. За иллюминатором замигали огни Шереметьева. Здравствуй, Москва. Москва, 2021"}, {"title": "И аз воздам — часть первая", "date": "30 ноября 2021", "categories": "Повести", "file": "post/047.html", "text": "И  АЗ  ВОЗДАМ Повесть в трех частях Часть первая СНЫ Глава первая -  Путь Парил он довольно долго, даже заскучал. В конце тоннеля его приземлили. Дальше путь троился - на большом чуть ржавом щите при выходе чернели три стрелки - прямо была указана дорога в Рай, налево в Ад и стрелка направо направляла в Израиль. Под информационным щитом стояла старенькая скамейка с весьма потертым сидением и обгаженной птицами спинкой. Садиться на неё в праздничном костюме не хотелось. Стоящий рядом со скамейкой мусорный контейнер был переполнен ватой и бинтами. Рядом с контейнером из ячеек винного ящика торчали несколько полупустых бутылок дорогого пива и «Столичной». Перед скамьёй на небольшом шестиугольном столе шелестела на ветру довольно толстая стопка бумаг, придавленная сверху пепельницей со скуренной наполовину дымящей самокруткой.  На листках в стопке что-то было написано, готическим шрифтом и римскими цифрами. По структуре бесконечного текста это было похоже на какую-то то ли Памятку, то ли Анкету, со многими разделами, пунктами, вопросами, таблицами и графиками. Ему было совсем не до рассматривания этого ребуса, он повертел листки в руках, перелистал всю стопку словно карточную колоду и положил обратно. Огляделся - никого. Помощи, которую обещал священник при отпевании, он до сих пор не получил. И не понятно, кто её смог бы дать. Ни одна душа ему ни в туннеле ни здесь не встретилась. Спросить - дальше, что и куда? - было не у кого.  Вытащив из кармана брюк свои старые ручные часы, которые незаметно для остальных сунула туда при прощании внучка, он их встряхнул.  Механизм пошёл, батарейки, слава Богу, он сам менял сравнительно недавно, и они хоть и потекли в печи, но свою китайскую надёжность подтвердили. Стрелки, правда, за треснувшим стеклом оплавились и повисли на оси как усы Тараса Григорьевича, но что до заката осталось немного можно было по их отвислости вычислить. Он ещё потоптался у стола.  Ждать, не понятно кого и чего, совсем не хотелось. А вдруг стемнеет. Следовало, наверное, куда-нибудь спешить, что-то решать.  К сожалению, самому.  Проще всего и понятнее было пойти прямо. Он подтянул обгорелые местами, особенно на заднице, брюки, которые с него спадали. В последние недели он сильно похудел, а ремень вдеть провожающие или не догадались или пожадничали. И пошёл прямо. Дорожка была хорошо натоптана, шла под уклон, так что шёл он резво и почти не спотыкался. Смотреть особо было не на что. По сторонам висели дымовые завесы, словно горели торфяники и их белёсый дым скрывал все детали потустороннего мира. Иногда слева из клубящейся завесы выпрыгивала разная мелкая живность - бурундуки, кролики, куропатки и перебегали дорогу прямо перед ним, скрываясь в правой дымовой кулисе. В сторону Израиля перелетели над ним несколько гусей. Молча хлопая крыльями. Однажды прямо под ногами, также слева направо, скользнула большая змея, не обратившая на него ни малейшего внимания. Шёл он довольно долго, и эта монотонная ходьба ему порядком надоела, как и тягучий полёт в тоннеле.  Потусторонний сервис был организован плохо - ни указателей, ни мест отдыха. И ожидаемая божественная музыка отсутствовала как факт, было по-мертвому тихо. Только ветер чуть подвывал в серой вышине. Знать бы заранее, взял бы с собой плеер с записями Гульда, но кто ж знал. Всё чаще серую плоскость приподнимали холмики, похожие на могильные, с оградками, скамейками, памятными камнями. Некоторые камни были пустыми, с некоторых смотрели лица с широко раскрытыми глазами, многие лица были очень-очень знакомыми, но не вспоминались. Ни надписей, ни дат. Правда, по обочинам дороги в таких местах высились потрепанные ветром билборды с прекрасными счастливыми лицами и вопросами-призывами – «А ты очистил память?», «С чистой памятью в чистое будущее!», «Убей своё прошлое!». Самый большой плакат изображал Роденовского «Мыслителя» с кричащим, красного цвета, шрифтом – «Вечность не свалка!» Совсем не темнело, хотя по его ощущениям уже должен был бы быть глубокий вечер. Лёгкое сияние так и висело над бесконечной, слегка виляющей и не очень широкой, дорожкой. И, он это благожелательно отметил, особых неудобств не возникало - ноги шли не уставая, есть и пить не хотелось, и туалета организм не требовал. Ну, это понятно, решил он. Вот для чего организм перед последним мгновением полностью очищается. Для долгого пути. Интересно, налево такая же длинная дорога? А к евреям? Вдали показались какие-то таблички на обочине. Он поспешил к ним, почти побежал, и минут через пять добежал. Оказались банальными дорожными указателями - «умерьте скорость, дорога сужается, ремонт дороги, смотрите под ноги».   Действительно, дорога превратилась в тропу, огороженную желтыми в чёрную полоску конусами, и почему-то запахло свежим асфальтом. Но ни одной работающей фигуры или даже тени глаза не увидели, хотя чёрная смесь под ногами, явно только-что уложенная, ещё кипела и пузырилась. И опять возникло у него ощущение, что именно это в его жизни уже было, все это он видел, в этом участвовал. Но когда, почему? Ещё через пару километров он уткнулся в опущенный шлагбаум, над которым перемигивались желтые светофоры. Что это значило, было непонятно - идти, стоять? Минуты простоял, или часы. Слева послышался нарастающий шум электрички. Довольно обшарпанная, совершенно подмосковная электричка, только желтая, шатаясь и громыхая на стыках, промчалась мимо. Тоже слева направо. Вагоны были переполнены. Лица многих пассажиров, с глазами навыкате и открытыми от изумления ртами, были направлены в его сторону. Показалось, что лица некоторых до боли знакомы. Кто-то, он не успел рассмотреть кто, вдруг замахал ему руками. На последнем вагоне мигала неоновая надпись «End». Шлагбаум так и остался опущенным, только светофоры погасли. Он наконец решился и нырнув под опущенный шест пошел дальше. За шлагбаумом дым рассеялся. Ничего интересного это не дало - горизонт расширился, но был также пуст - ни строения, ни деревца. Слева слегка дымило, справа дымило посильней, но без огня. Он вернул взгляд перед собой и вздрогнул от неожиданности. Прямо перед ним, перегораживая дорогу, стояла синяя \"Победа\" с шашечками по борту. - Привет, Евгений! - сказал таксист, когда странник поравнялся с передним опущенным стеклом, - садись, ты один или кого-нибудь ждём? - Один, а кого ждать? - Ну, мало ли, все сначала в эту сторону прут. Идиоты. Водила повернул ключ зажигания, машина слегка затряслась. - Постойте, - сказал Евгений, плюхнувшись на задний диван. - Я на такси не рассчитывал и совсем без денег, не думал, что они тут нужны. - Кому они тут нужны. Тут всё в долг. Расплатишься, как все, памятью. - Не понимаю, с кем? И как? - Скажут, когда нужно будет. Поедем что ль? - А куда? Вы уверены, что именно меня ждёте? - Понятное дело, в райисполком - тебе же нужна прописка и талоны на нектар. Машина лихо развернулась, чуть не сбив перебе
